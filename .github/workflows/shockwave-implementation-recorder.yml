name: Shockwave implementation recorder

on:
  push:
    branches:
      - feature/slice-5-shockwave

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/slice-5-shockwave
          fetch-depth: 0
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Apply approved Shockwave implementation
        run: |
          python tools/shockwave_implementation_recorder.py
          python tools/shockwave_lint_fix.py
      - name: Remove temporary recorder
        run: rm .github/workflows/shockwave-implementation-recorder.yml tools/shockwave_implementation_recorder.py tools/shockwave_lint_fix.py
      - name: Format changed source and docs
        run: |
          npx prettier --write \
            src/game/items/itemDefinitions.ts \
            src/game/items/ShockwaveSystem.ts \
            src/game/items/ProjectileSystem.ts \
            src/game/items/ItemEffectDispatcher.ts \
            src/game/physics/KartController.ts \
            src/game/items/ItemTestMode.ts \
            src/game/items/ShockwaveCounterFixture.ts \
            src/game/KartTimeTrial.ts \
            tests/shockwave.test.ts \
            tests/kart-controller-effects.test.ts \
            docs/SLICE-5-SHOCKWAVE-SCOPE.md \
            docs/IMPLEMENTATION-STATUS.md
      - name: Validate repository
        run: |
          git diff --check
          git lfs fsck
          npm run validate
          npm run format:check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement approved Acoustic Shockwave Pulse"
          git push origin HEAD:feature/slice-5-shockwave
