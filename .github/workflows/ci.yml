          import hashlib, json, time, urllib.error, urllib.request

          TRANSIENT_HTTP_STATUSES = {429, 500, 502, 503, 504}
          MAX_PRESERVATION_ATTEMPTS = 5

          def verify_published_file(url, relative, expected_sha):
              for attempt in range(1, MAX_PRESERVATION_ATTEMPTS + 1):
                  request = urllib.request.Request(url, headers={
                      'Cache-Control': 'no-cache',
                      'User-Agent': 'neon-grid-pages-preservation-check',
                  })
                  try:
