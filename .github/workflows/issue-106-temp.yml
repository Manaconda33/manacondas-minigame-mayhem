name: Apply Issue 106 standings fix

on:
  push:
    branches:
      - fix/issue-106-live-results

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-106-live-results
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Apply bounded Issue 106 fix
        run: |
          python <<'PY'
          from pathlib import Path

          kart = Path('src/game/KartTimeTrial.ts')
          text = kart.read_text()

          old = """export interface TimeTrialOptions {\n  canvas: HTMLCanvasElement;\n  character: CharacterDefinition;\n  onHud: (state: HudState) => void;\n  onFinish: (result: RaceResult) => void;\n}\n"""
          new = """export interface TimeTrialOptions {\n  canvas: HTMLCanvasElement;\n  character: CharacterDefinition;\n  onHud: (state: HudState) => void;\n  onFinish: (result: RaceResult) => void;\n  onStandings?: (standings: RaceResult['standings']) => void;\n}\n"""
          if old not in text:
              raise SystemExit('TimeTrialOptions patch target not found')
          text = text.replace(old, new, 1)

          old = """    if (this.playerProgress.finished && !this.finishReported) {\n      this.finishReported = true;\n      const standings = this.currentStandings();\n      this.options.onFinish({\n        time: this.playerProgress.finishTime ?? this.elapsed,\n        place:\n          this.playerProgress.finishPlace ?? standings.findIndex(({ id }) => id === 'player') + 1,\n        standings: standings.map((racer) => ({\n          name:\n            racer.id === 'player'\n              ? 'YOU'\n              : (this.opponents.find(({ id }) => id === racer.id)?.name ?? racer.id),\n          place: racer.finishPlace,\n          time: racer.finishTime,\n        })),\n      });\n    }\n  };\n\n  private crossedCheckpoint(\n"""
          new = """    if (this.playerProgress.finished && !this.finishReported) {\n      this.finishReported = true;\n      const standings = this.currentStandings();\n      this.options.onFinish({\n        time: this.playerProgress.finishTime ?? this.elapsed,\n        place:\n          this.playerProgress.finishPlace ?? standings.findIndex(({ id }) => id === 'player') + 1,\n        standings: this.resultStandings(),\n      });\n    }\n  };\n\n  private resultStandings(): RaceResult['standings'] {\n    return this.currentStandings().map((racer) => ({\n      name:\n        racer.id === 'player'\n          ? 'YOU'\n          : (this.opponents.find(({ id }) => id === racer.id)?.name ?? racer.id),\n      place: racer.finishPlace,\n      time: racer.finishTime,\n    }));\n  }\n\n  private crossedCheckpoint(\n"""
          if old not in text:
              raise SystemExit('finish result patch target not found')
          text = text.replace(old, new, 1)

          old = """    this.inkSplat.clear(opponent.id);\n    this.projectiles.cancelOwnerArcs(opponent.id);\n  }\n"""
          new = """    this.inkSplat.clear(opponent.id);\n    this.projectiles.cancelOwnerArcs(opponent.id);\n    if (this.playerProgress.finished) this.options.onStandings?.(this.resultStandings());\n  }\n"""
          if old not in text:
              raise SystemExit('finishOpponent patch target not found')
          text = text.replace(old, new, 1)
          kart.write_text(text)

          shell = Path('src/app/mountAppShell.ts')
          text = shell.read_text()
          old = "import type { HudState, KartTimeTrial as KartTimeTrialInstance } from '../game/KartTimeTrial';"
          new = "import type { HudState, RaceResult, KartTimeTrial as KartTimeTrialInstance } from '../game/KartTimeTrial';"
          if old not in text:
              raise SystemExit('mountAppShell import patch target not found')
          text = text.replace(old, new, 1)

          old = """function formatTime(seconds: number): string {\n  const minutes = Math.floor(seconds / 60);\n  const remainder = seconds - minutes * 60;\n  return `${String(minutes)}:${remainder.toFixed(2).padStart(5, '0')}`;\n}\n\n"""
          new = """function formatTime(seconds: number): string {\n  const minutes = Math.floor(seconds / 60);\n  const remainder = seconds - minutes * 60;\n  return `${String(minutes)}:${remainder.toFixed(2).padStart(5, '0')}`;\n}\n\nexport function standingsMarkup(standings: RaceResult['standings']): string {\n  return standings\n    .map(\n      (racer, index) =>\n        `<li><span>${String(index + 1)}. ${racer.name}</span><strong>${racer.time === null ? 'RACING' : formatTime(racer.time)}</strong></li>`,\n    )\n    .join('');\n}\n\n"""
          if old not in text:
              raise SystemExit('formatTime patch target not found')
          text = text.replace(old, new, 1)

          old = """    game = await KartTimeTrial.create({\n      canvas,\n      character: selectedCharacter,\n      onHud: updateHud,\n      onFinish: (result) => {\n"""
          new = """    const renderStandings = (standings: RaceResult['standings']): void => {\n      getElement('#standings').innerHTML = standingsMarkup(standings);\n    };\n    game = await KartTimeTrial.create({\n      canvas,\n      character: selectedCharacter,\n      onHud: updateHud,\n      onStandings: renderStandings,\n      onFinish: (result) => {\n"""
          if old not in text:
              raise SystemExit('KartTimeTrial.create patch target not found')
          text = text.replace(old, new, 1)

          old = """        getElement('#finish-time').textContent = formatTime(result.time);\n        getElement('#standings').innerHTML = result.standings\n          .map(\n            (racer, index) =>\n              `<li><span>${String(index + 1)}. ${racer.name}</span><strong>${racer.time === null ? 'RACING' : formatTime(racer.time)}</strong></li>`,\n          )\n          .join('');\n"""
          new = """        getElement('#finish-time').textContent = formatTime(result.time);\n        renderStandings(result.standings);\n"""
          if old not in text:
              raise SystemExit('standings render patch target not found')
          text = text.replace(old, new, 1)
          shell.write_text(text)

          tests = Path('tests/app-shell.test.ts')
          text = tests.read_text()
          old = "import { APP_TITLE, markGameFinished, mountAppShell } from '../src/app/mountAppShell';"
          new = "import { APP_TITLE, markGameFinished, mountAppShell, standingsMarkup } from '../src/app/mountAppShell';"
          if old not in text:
              raise SystemExit('app-shell test import target not found')
          text = text.replace(old, new, 1)
          marker = """  it('provides a non-interactive race minimap surface for responsive HUD placement', () => {\n"""
          addition = """  it('refreshes post-finish standings markup as later racers finish', () => {\n    const initial = standingsMarkup([\n      { name: 'YOU', place: 1, time: 62.5 },\n      { name: 'Krios', place: null, time: null },\n      { name: 'Alex', place: null, time: null },\n    ]);\n    expect(initial).toContain('Krios</span><strong>RACING');\n    expect(initial).toContain('Alex</span><strong>RACING');\n\n    const updated = standingsMarkup([\n      { name: 'YOU', place: 1, time: 62.5 },\n      { name: 'Krios', place: 2, time: 64.25 },\n      { name: 'Alex', place: 3, time: 65.75 },\n    ]);\n    expect(updated).not.toContain('RACING');\n    expect(updated).toContain('2. Krios</span><strong>1:04.25');\n    expect(updated).toContain('3. Alex</span><strong>1:05.75');\n  });\n\n"""
          if marker not in text:
              raise SystemExit('app-shell test insertion target not found')
          text = text.replace(marker, addition + marker, 1)
          tests.write_text(text)

          testing = Path('docs/TESTING.md')
          text = testing.read_text()
          section = """\n## Issue #106 post-finish results synchronization\n\nThe bounded Issue #106 regression gate verifies presentation only. Finish as the player before at least two AI racers, keep the results card open, and confirm each later AI finish refreshes the standings from the authoritative race state. Finished racers must replace `RACING` with their locked finish time/order, the final displayed order must match authoritative standings, and the player's locked place/time must not change. Repeat on desktop and mobile. This gate must not alter checkpoint/lap authority, AI behavior, item balance, race timing, or victory/results entry behavior.\n"""
          if '## Issue #106 post-finish results synchronization' not in text:
              testing.write_text(text.rstrip() + '\n' + section)
          PY

      - name: Validate
        run: npm run validate

      - name: Diff hygiene
        run: git diff --check

      - name: Commit bounded fix and remove helper
        run: |
          rm .github/workflows/issue-106-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/KartTimeTrial.ts src/app/mountAppShell.ts tests/app-shell.test.ts docs/TESTING.md .github/workflows/issue-106-temp.yml
          git commit -m "Fix live post-finish standings updates"
          git push origin HEAD:fix/issue-106-live-results
