name: Record AI hazard-response governance

on:
  push:
    branches:
      - docs/slice-5-ai-hazard-response-scope

permissions:
  contents: write

jobs:
  govern-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          ref: docs/slice-5-ai-hazard-response-scope
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record approved governance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # README reconciliation after Slick live acceptance.
          replace_once(
              "README.md",
              "Slice 3 Character Selection & Avatar Ingestion is complete and live accepted. The competitive Grand Prix systems defined for Slice 4 were completed earlier because of a documented sequencing error and remain retained. Slice 5 foundation, visible item boxes, roulette, held-item HUD, desktop/mobile ITEM input, Nitro Surge, Ricochet Kinetic Disc, Homing Seeker Drone, Apex Orbital Missile core, and Timed Blast Orb are merged, deployed, and live accepted. Ten item effects remain unimplemented, together with real cross-item counter integration, Hyper-Drive Rocket autopilot, AI tactical item use/hazard response, soak/performance evidence, and final Slice 5 acceptance. Issue #106 remains a deferred standings-display defect. Slice 6 remains locked.",
              "Slice 3 Character Selection & Avatar Ingestion is complete and live accepted. The competitive Grand Prix systems defined for Slice 4 were completed earlier because of a documented sequencing error and remain retained. Slice 5 foundation, visible item boxes, roulette, held-item HUD, desktop/mobile ITEM input, Nitro Surge, Ricochet Kinetic Disc, Homing Seeker Drone, Apex Orbital Missile core, Timed Blast Orb, and Slick Trap are merged, deployed, and live accepted. Nine item effects remain unimplemented, together with real cross-item counter integration, Hyper-Drive Rocket autopilot, full AI tactical item use, the approved-but-not-yet-implemented Blast/Slick AI hazard-response increment, soak/performance evidence, and final Slice 5 acceptance. Issue #106 remains a deferred standings-display defect. Slice 6 remains locked.",
          )

          # Scope approval record.
          replace_once(
              "docs/SLICE-5-AI-HAZARD-RESPONSE-SCOPE.md",
              "# Slice 5 proposed next increment: AI hazard response\n\n**Status: PROPOSED FOR PRODUCT-OWNER REVIEW. No gameplay implementation is authorized by this document.**",
              "# Slice 5 approved next increment: AI hazard response\n\n**Status: APPROVED FOR GOVERNANCE. Gameplay implementation remains locked until this documentation checkpoint merges to `main` and its post-merge CI/Pages run passes.**",
          )
          replace_once(
              "docs/SLICE-5-AI-HAZARD-RESPONSE-SCOPE.md",
              "Baseline: `main` at `190a7d1d926287c1c6cd15479a9e46ee2052d759`. Nitro Surge, Ricochet Kinetic Disc, Homing Seeker Drone, Apex Orbital Missile core, Timed Blast Orb, and Slick Trap are live accepted. Slice 5 remains active; Slice 6 remains locked.",
              "Baseline: `main` at `190a7d1d926287c1c6cd15479a9e46ee2052d759`. Nitro Surge, Ricochet Kinetic Disc, Homing Seeker Drone, Apex Orbital Missile core, Timed Blast Orb, and Slick Trap are live accepted. Slice 5 remains active; Slice 6 remains locked.\n\n**Approval record:** Manny approved this AI hazard-response scope as written on 2026-09-07 and explicitly directed the governance checkpoint to correct the stale README Slick/count status. PRD working amendment 2.10 and ADR-071 govern the approved fill-ins below once this checkpoint merges and its post-merge CI/Pages gate passes.",
          )
          replace_once(
              "docs/SLICE-5-AI-HAZARD-RESPONSE-SCOPE.md",
              "If Manny approves this scope as written, the governance checkpoint should:\n\n1. record the bounded AI hazard-response behavior as PRD working amendment **2.10** and ADR-071;\n2. add the automated/live verification rules to `docs/TESTING.md`;\n3. update `docs/IMPLEMENTATION-STATUS.md` with the approved next increment;\n4. correct the stale Slick/remaining-item count in `README.md`; and\n5. remain documentation-only.",
              "Manny approved this scope as written on 2026-09-07. This governance checkpoint:\n\n1. records the bounded AI hazard-response behavior as PRD working amendment **2.10** and ADR-071;\n2. adds the automated/live verification rules to `docs/TESTING.md`;\n3. updates `docs/IMPLEMENTATION-STATUS.md` with the approved next increment;\n4. corrects the stale Slick/remaining-item count in `README.md`; and\n5. remains documentation-only.",
          )

          # PRD amendment 2.10.
          prd = Path("docs/PRD.md")
          text = prd.read_text()
          old_version = "Version 1.1 - Final approved baseline; working implementation amendment 2.9"
          if text.count(old_version) != 1:
              raise SystemExit("PRD version anchor mismatch")
          text = text.replace(old_version, "Version 1.1 - Final approved baseline; working implementation amendment 2.10", 1)
          if "## Approved implementation amendment 2.10 - AI hazard response for Slick Trap and Timed Blast Orb" in text:
              raise SystemExit("PRD amendment 2.10 already exists")
          marker = "## Approved implementation amendment 2.9 - Slick Trap hazard behavior"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("PRD amendment 2.9 anchor missing")
          next_heading = text.find("\n## ", start + len(marker))
          if next_heading < 0:
              raise SystemExit("PRD next heading after amendment 2.9 missing")
          amendment = """

## Approved implementation amendment 2.10 - AI hazard response for Slick Trap and Timed Blast Orb

Approved September 7, 2026 after live acceptance of both Timed Blast Orb and Slick Trap. This amendment fills the previously unspecified operating details for the existing Section 21.5 AI obstacle-avoidance requirement without enabling AI item acquisition/use, changing accepted hazard physics, altering item probabilities, changing racer statistics, or beginning Slice 6. `docs/SLICE-5-AI-HAZARD-RESPONSE-SCOPE.md` and ADR-071 are normative for this bounded increment.

AI hazard awareness consumes read-only Slick Trap and Timed Blast Orb snapshots and reasons by wrapped forward route distance on Circuit Alpha. Relevant hazards are considered up to **20 m ahead**. The existing five bounded lane candidates remain authoritative. AI planning treats Slick as conflicted inside a **2.5 m** planning footprint and Blast Orb inside a **4.5 m** planning footprint; these are decision margins only and do not change the governed Slick trigger or Blast radius. Moving Blast Orbs are evaluated at their current position plus a **0.5 s** drag-aware prediction capped by remaining fuse time.

Hazard clearance takes precedence over preferred-lane convenience while existing nearby-racer avoidance remains active where possible. If every candidate lane is conflicted, AI chooses the candidate with greatest minimum clearance rather than receiving guaranteed immunity. After the last relevant hazard clears or moves behind, AI holds the avoidance lane for at least **0.6 race seconds** before normal preferred-lane recovery. All lateral motion continues through existing steering dynamics: no teleport, transform snap, hidden speed boost, speed penalty, emergency brake rule, rubber-band change, or lap/checkpoint mutation is authorized.

Awareness timers advance only with race simulation, so pause freezes the clear-hold. Removed/expired hazards disappear from awareness on the next simulation step; restart, return-to-hub, and disposal clear temporary avoidance state. Deterministic acceptance instrumentation may use `?testAiHazardAvoidance=slick` and `?testAiHazardAvoidance=blast` to place a real accepted hazard approximately 12 m ahead of the first unfinished AI after five race seconds without consuming AI inventory or enabling AI item tactics. Gameplay implementation, publication/deployment, and live acceptance remain separately gated.
"""
          text = text[:next_heading] + amendment + text[next_heading:]
          prd.write_text(text)

          # Keep the Slice 5 design's governing PRD line current.
          replace_once(
              "docs/SLICE-5-ITEM-SYSTEM-DESIGN.md",
              "**Governing PRD:** v1.1, working implementation amendment 2.9.",
              "**Governing PRD:** v1.1, working implementation amendment 2.10.",
          )

          # ADR-071.
          decisions = Path("docs/DECISIONS.md")
          dtext = decisions.read_text()
          if "## ADR-071:" in dtext:
              raise SystemExit("ADR-071 already exists")
          dtext = dtext.rstrip() + """


## ADR-071: Use bounded lane-intent AI avoidance for accepted Slick and Blast hazards

- **Status:** Approved; gameplay implementation gated on governance merge + post-merge CI/Pages.
- **Context:** Timed Blast Orb and Slick Trap are both live accepted, satisfying the deliberate dependency recorded in their scopes. PRD Section 21.5 already requires AI to detect slicks and Blast Orbs, deviate from the ideal spline, and return gradually. Existing `AiDriver` already owns bounded five-lane racer avoidance.
- **Decision:** Extend `AiDriver` with typed read-only hazard awareness for Slick Trap and Timed Blast Orb only. Use wrapped route-relative detection up to 20 m ahead; the existing five bounded lane candidates; 2.5 m Slick and 4.5 m Blast planning footprints; 0.5 s drag-aware Blast prediction capped by fuse; hazard-first lane clearance with existing racer pressure retained where possible; greatest-minimum-clearance fallback when boxed in; and a 0.6 race-second clear hold before preferred-lane recovery.
- **Guardrails:** Lane intent only. No teleport/snapping, hidden speed or braking rule, rubber-band change, hazard-physics change, item probability change, racer-stat change, lap/checkpoint mutation, AI item acquisition/use, or Slice 6 work. Pause freezes avoidance timers; restart/disposal clears temporary state.
- **Testing rule:** Automated tests must cover route wrap/distance filtering, planning-footprint boundaries, moving-Blast prediction, multi-hazard fallback, racer/hazard coexistence, gradual recovery, pause/cleanup, fixture isolation, and accepted-item/AI regressions. Deployed review uses `?testAiHazardAvoidance=slick` and `?testAiHazardAvoidance=blast` plus a normal unforced URL.
- **Next gate:** Merge this documentation-only governance checkpoint and require successful post-merge CI/Pages before gameplay implementation begins. Gameplay publication/deployment and product-owner live acceptance remain separate later gates.
- **Approval:** Manny approved the complete bounded AI hazard-response scope as written on 2026-09-07 and directed the same governance checkpoint to correct README's stale Slick/count status.
""" + "\n"
          decisions.write_text(dtext)

          # Testing contract.
          testing = Path("docs/TESTING.md")
          ttext = testing.read_text()
          if "## Slice 5 AI Slick/Blast hazard-response acceptance" in ttext:
              raise SystemExit("AI hazard testing section already exists")
          ttext = ttext.rstrip() + """


## Slice 5 AI Slick/Blast hazard-response acceptance

The approved PRD amendment 2.10 / ADR-071 increment is limited to AI movement response to the already accepted Slick Trap and Timed Blast Orb hazards. Full AI item acquisition/use remains a separate later Slice 5 gate.

Automated evidence must verify route-relative wrapped forward distance, route-distant false-positive rejection, the 20 m lookahead, 2.5 m Slick and 4.5 m Blast planning boundaries, 0.5 s drag-aware Blast prediction capped by fuse, deterministic left/right and boxed-in lane selection, coexistence with nearby-racer avoidance, the 0.6 race-second clear hold, gradual preferred-lane recovery, pause freeze, hazard removal/expiry cleanup, restart/disposal cleanup, fixture isolation, no lap/checkpoint mutation, unchanged Speed-stat/rubber-band/controller authority, existing three-lap AI integration, finite transforms, road/grass bounds, accepted-item regressions, and probability-selector regressions.

Before publication review run clean `npm ci`, `npm run validate`, `git diff --check`, Git LFS verification, and hosted PR CI.

Deployed acceptance must verify:

1. `?testAiHazardAvoidance=slick` produces a visible bounded avoidance attempt before the real Slick when a clear lane exists, without teleport/snapping.
2. The AI returns gradually after the Slick passes or is removed.
3. `?testAiHazardAvoidance=blast` produces a visible route/lane response to the accepted Blast Orb before detonation when geometry permits.
4. Avoidance remains road-bounded without obvious grass-cutting, wrong-way behavior, recovery loops, or collision deadlock.
5. Other AI racers retain character-Speed-governed race behavior and believable nearby-racer avoidance.
6. Pause/restart freezes or clears fixture/avoidance state correctly.
7. Normal unforced gameplay contains no fixture badge or forced hazard behavior.
8. Accepted Nitro, Kinetic, Seeker, Apex, Blast Orb, and Slick Trap behavior remains unchanged.

Record exact implementation commit, hosted CI, post-merge CI/Pages, live desktop/mobile results, defects, and Manny's acceptance in `docs/IMPLEMENTATION-STATUS.md`. Passing this increment closes only AI Blast/Slick movement-response evidence actually proven; it does not close full AI item tactics, remaining items/counters, issue #106, final soak/performance, overall Slice 5 acceptance, or Slice 6.
""" + "\n"
          testing.write_text(ttext)

          # Current continuity status.
          status = Path("docs/IMPLEMENTATION-STATUS.md")
          stext = status.read_text()
          baseline = "PRD baseline: **v1.1, working implementation amendment 2.9**."
          if stext.count(baseline) != 1:
              raise SystemExit("Implementation status PRD baseline anchor mismatch")
          stext = stext.replace(baseline, "PRD baseline: **v1.1, working implementation amendment 2.10**.", 1)
          anchor = "PRD baseline: **v1.1, working implementation amendment 2.10**.\n"
          checkpoint = """

## Slice 5 AI Slick/Blast hazard-response governance checkpoint

Manny approved the complete bounded AI hazard-response scope as written on 2026-09-07. PRD amendment 2.10 / ADR-071 governs read-only Slick/Blast awareness, 20 m wrapped route-relative lookahead, the existing five candidate lanes, 2.5 m Slick and 4.5 m Blast planning footprints, 0.5 s drag-aware Blast prediction capped by fuse, hazard-priority lane intent, greatest-minimum-clearance fallback, and a 0.6 race-second clear hold before gradual preferred-lane recovery.

This checkpoint is documentation-only. It does not enable AI item acquisition/use or change accepted hazard behavior, probabilities, racer stats, track/checkpoints, Speed-stat authority, rubber banding, controller tuning, assets, dependencies, or Slice 6. Deterministic deployed review is governed through `?testAiHazardAvoidance=slick` and `?testAiHazardAvoidance=blast` plus a normal unforced URL.

PR #122 is the governance checkpoint. Gameplay implementation remains locked until PR #122 merges to `main` and its post-merge CI/Pages run passes. Gameplay publication/deployment and live acceptance are later separate gates. Full AI item tactics, playable Shockwave/counters, Prismatic/Hyper-Drive interactions, nine remaining item effects, issue #106, final soak/performance closure, overall Slice 5 acceptance, and Slice 6 remain open.
"""
          if "## Slice 5 AI Slick/Blast hazard-response governance checkpoint" in stext:
              raise SystemExit("AI hazard implementation-status section already exists")
          stext = stext.replace(anchor, anchor + checkpoint, 1)
          status.write_text(stext)
          PY

      - name: Install from lockfile
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Verify LFS and diff hygiene
        shell: bash
        run: |
          git lfs fsck
          git diff --check

      - name: Commit governance checkpoint
        shell: bash
        run: |
          rm .github/workflows/record-ai-hazard-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PRD.md docs/DECISIONS.md docs/TESTING.md docs/IMPLEMENTATION-STATUS.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/SLICE-5-AI-HAZARD-RESPONSE-SCOPE.md .github/workflows/record-ai-hazard-governance.yml
          git diff --cached --check
          git commit -m "Govern approved AI hazard-response scope"
          git push origin HEAD:docs/slice-5-ai-hazard-response-scope
