name: Materialize approved Archer kart
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-archer-kart.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'feature/archer-2d-assets' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned builder dependencies
        run: python -m pip install numpy==2.3.5 matplotlib==3.10.8 Pillow==12.3.0
      - name: Rebuild exactly approved models and prove unchanged pointers
        shell: bash
        run: |
          python - <<'PYMODEL'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          ledger=json.loads(Path('docs/evidence/2026-10-01-archer/kart-candidate-3.json').read_text())
          assert len(ledger['files']) == 3
          for asset in ledger['files']:
              path=asset['runtime_path']
              assert path in ['public/assets/characters/aa-13/kart.glb','public/assets/characters/aa-13/lod/kart-lod1.glb','public/assets/characters/aa-13/lod/kart-lod2.glb']
              env=dict(os.environ, ARCHER_KART_LOD=asset['lod'].upper(), ARCHER_KART_OUT=path, ARCHER_KART_SKIP_PREVIEW='1')
              subprocess.run([sys.executable,'tools/assets/build_archer_kart.py'],env=env,check=True)
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == asset['sha256']
              subprocess.run(['git','add',path],check=True)
          subprocess.run(['git','diff','--cached','--exit-code'],check=True)
          subprocess.run([sys.executable,'-m','unittest','discover','-s','tools/assets','-p','test_archer_kart_contract.py'],check=True)
          PYMODEL
      - name: Store only the three approved objects
        run: |
          python - <<'PYUPLOAD'
          import json, subprocess
          from pathlib import Path
          assets=json.loads(Path('docs/evidence/2026-10-01-archer/kart-candidate-3.json').read_text())['files']
          subprocess.run(['git','lfs','push','--object-id','origin',*[a['sha256'] for a in assets]],check=True)
          PYUPLOAD
      - name: Clear cache and prove remote fetch-back
        run: |
          rm -rf .git/lfs/objects
          git lfs pull origin
          git lfs fsck
          python - <<'PYFETCH'
          import hashlib,json
          from pathlib import Path
          for a in json.loads(Path('docs/evidence/2026-10-01-archer/kart-candidate-3.json').read_text())['files']:
              assert hashlib.sha256(Path(a['runtime_path']).read_bytes()).hexdigest() == a['sha256']
              print(a['runtime_path'],a['sha256'])
          PYFETCH
