name: Apply Slice 5 RacerEffects and Nitro Surge patch

on:
  push:
    branches: [feature/slice-5-racer-effects-nitro-surge]
    paths:
      - tools/patch-slice5-nitro.py
      - .github/workflows/patch-slice5-nitro.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: feature/slice-5-racer-effects-nitro-surge

      - name: Verify Git LFS
        run: git lfs fsck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct sustained-speed test fixture calls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/patch-slice5-nitro.py')
          text = path.read_text()
          replacements = {
              "    const capKart = makeKart();\\n": "    const capKart = makeKart(sliceOneDriver, 2000);\\n",
              "    const grassKart = makeKart();\\n": "    const grassKart = makeKart(sliceOneDriver, 2000);\\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one fixture match: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Apply guarded patch
        run: python tools/patch-slice5-nitro.py

      - name: Give Nitro long-run fixtures independent track length
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/kart-controller.test.ts')
          text = path.read_text()
          old_signature = '  function makeKart(stats: DriverStats = sliceOneDriver, groundHalfWidth = 500): {'
          new_signature = '''  function makeKart(
            stats: DriverStats = sliceOneDriver,
            groundHalfWidth = 500,
            groundHalfLength = 500,
          ): {'''
          if text.count(old_signature) != 1:
              raise SystemExit(f'Expected one makeKart signature, found {text.count(old_signature)}')
          text = text.replace(old_signature, new_signature, 1)
          old_ground = 'RAPIER.ColliderDesc.cuboid(groundHalfWidth, 0.1, 500)'
          new_ground = 'RAPIER.ColliderDesc.cuboid(groundHalfWidth, 0.1, groundHalfLength)'
          if text.count(old_ground) != 1:
              raise SystemExit(f'Expected one ground collider match, found {text.count(old_ground)}')
          text = text.replace(old_ground, new_ground, 1)
          old_long = 'makeKart(sliceOneDriver, 2000)'
          if text.count(old_long) != 2:
              raise SystemExit(f'Expected two Nitro long-run fixture calls, found {text.count(old_long)}')
          text = text.replace(old_long, 'makeKart(sliceOneDriver, 2000, 2000)')
          path.write_text(text)
          PY

      - name: Format intended files
        run: >-
          npx prettier --write
          src/game/items/itemDefinitions.ts
          src/game/items/RacerEffects.ts
          src/game/items/ItemEffectDispatcher.ts
          src/game/physics/KartController.ts
          src/game/KartTimeTrial.ts
          src/app/mountAppShell.ts
          tests/kart-controller.test.ts
          tests/racer-effects.test.ts

      - name: Install from lockfile
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Verify patch whitespace
        run: git diff --check

      - name: Remove temporary patch machinery
        run: rm tools/patch-slice5-nitro.py .github/workflows/patch-slice5-nitro.yml

      - name: Commit validated checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Implement RacerEffects and Nitro Surge checkpoint"
          git push origin HEAD:feature/slice-5-racer-effects-nitro-surge
