name: Record Slick Trap live acceptance

on:
  push:
    branches:
      - docs/slick-trap-live-acceptance
    paths:
      - .github/workflows/record-slick-live-acceptance.yml

permissions:
  contents: write

jobs:
  record-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4
        with:
          ref: docs/slick-trap-live-acceptance
          fetch-depth: 1
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record live acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1).rstrip() + "\n")

          # IMPLEMENTATION-STATUS: make the current state and Slick checkpoint truthful.
          replace_once(
              'docs/IMPLEMENTATION-STATUS.md',
              '**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - NITRO, KINETIC, SEEKER, APEX, AND BLAST ORB LIVE ACCEPTED / SLICK SCOPE APPROVED, GOVERNANCE MERGE PENDING**',
              '**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - NITRO, KINETIC, SEEKER, APEX, BLAST ORB, AND SLICK TRAP LIVE ACCEPTED**',
          )
          replace_once(
              'docs/IMPLEMENTATION-STATUS.md',
              'Hosted clean-install PR CI remains required before publication review. Live acceptance is pending; test URLs serve the prior accepted build until publication is separately approved and deployed.',
              'Hosted clean-install PR CI run `34153344029` passed at reviewed head `d6f7f752eaa06f38954ed6fa3adab8a617b3d1b9`. Manny approved publication; PR #120 squash-merged at `bcc5bcc500b08ea42984eed8afa188fa87ba1cf9`, and post-merge CI/Pages run `34153760001` passed validation and deployment. Manny then completed the deployed Slick Trap live playtests and reported all checks passed. Product-owner evidence is PR #120 comment `5574748827`. **Slick Trap is LIVE ACCEPTED.**',
          )
          replace_once(
              'docs/IMPLEMENTATION-STATUS.md',
              'PR #119 merged at `2ce2212e5d89e192b9118ec07c655bacefbdf45a`; post-merge CI/Pages run `34151395918` passed. Manny then explicitly authorized the approved gameplay implementation. Slick gameplay is implemented on `feature/slice-5-slick-trap-implementation`; publication/deployment and product-owner live acceptance remain separate pending gates. AI Blast/Slick avoidance, playable Shockwave, real Prismatic/Hyper-Drive interactions, remaining Slice 5 items, issue #106, final soak/performance closure, and Slice 6 remain deferred.',
              'PR #119 merged at `2ce2212e5d89e192b9118ec07c655bacefbdf45a`; post-merge CI/Pages run `34151395918` passed. Manny then authorized gameplay implementation and later approved PR #120 publication. PR #120 squash-merged at `bcc5bcc500b08ea42984eed8afa188fa87ba1cf9`; post-merge run `34153760001` passed validation and GitHub Pages deployment. Manny completed the deployed eight-check Slick Trap acceptance and reported all playtests passed on 2026-09-07. **Slick Trap is LIVE ACCEPTED.** AI Blast/Slick avoidance, playable Shockwave, real Prismatic/Hyper-Drive interactions, the nine remaining item effects, issue #106, final soak/performance closure, and Slice 6 remain deferred.',
          )
          p = Path('docs/IMPLEMENTATION-STATUS.md')
          text = p.read_text()
          text = text.replace('Real playable Shockwave/Prismatic interactions, Slick, AI Blast/Slick avoidance, issue #106, remaining Slice 5 items, final soak/performance gates, and Slice 6 remain later/deferred gates.', 'Real playable Shockwave/Prismatic interactions, AI Blast/Slick avoidance, issue #106, remaining Slice 5 items, final soak/performance gates, and Slice 6 remain later/deferred gates.', 1)
          text = text.replace('Playable Shockwave, real counter acceptance, Slick, AI hazard avoidance, issue #106, remaining Slice 5 items, final soak/performance evidence, and Slice 6 remain deferred.', 'Playable Shockwave, real counter acceptance, AI hazard avoidance, issue #106, remaining Slice 5 items, final soak/performance evidence, and Slice 6 remain deferred.', 1)
          p.write_text(text.rstrip() + '\n')

          # Slick scope: close the publication/live gate without changing governed behavior.
          replace_once(
              'docs/SLICE-5-SLICK-TRAP-SCOPE.md',
              '**Status: IMPLEMENTED. PR #119 governance merge and post-merge CI/Pages passed; Manny explicitly authorized gameplay implementation. Publication/deployment and live acceptance remain pending.**',
              '**Status: LIVE ACCEPTED. PR #120 merged and deployed successfully; Manny completed the deployed Slick Trap playtests and reported all checks passed on 2026-09-07.**',
          )
          replace_once(
              'docs/SLICE-5-SLICK-TRAP-SCOPE.md',
              'The eight deployed checks above remain pending. The gameplay PR records automated validation before publication review. Existing accepted items, probabilities, AI scope, issue #106 and Slice 6 gates remain as governed.',
              'The eight deployed checks above passed after PR #120 publication. Existing accepted items, probabilities, AI scope, issue #106 and Slice 6 gates remain as governed.',
          )
          scope = Path('docs/SLICE-5-SLICK-TRAP-SCOPE.md')
          text = scope.read_text().rstrip()
          if '## Live acceptance — 2026-09-07' not in text:
              text += '''\n\n## Live acceptance — 2026-09-07\n\nPR #120 was reviewed at head `d6f7f752eaa06f38954ed6fa3adab8a617b3d1b9`; hosted clean-install PR CI run `34153344029` passed. Manny approved the separate publication gate. PR #120 squash-merged to `main` at `bcc5bcc500b08ea42984eed8afa188fa87ba1cf9`; post-merge CI/Pages run `34153760001` passed validation and GitHub Pages deployment.\n\nManny then completed the deployed eight-check acceptance matrix and reported **all playtests passed**. Product-owner evidence is PR #120 comment `5574748827`. This closes the Slick Trap functional/live-acceptance gate only. AI Blast/Slick avoidance, playable Shockwave and real cross-item counter acceptance, Prismatic/Hyper-Drive interactions, the nine remaining item effects, issue #106, final Slice 5 soak/performance closure, overall Slice 5 acceptance, and Slice 6 remain open.\n'''
          scope.write_text(text.rstrip() + '\n')

          # ADR-070: close the item core gate and retain explicit deferred boundaries.
          replace_once(
              'docs/DECISIONS.md',
              '- **Status:** Implemented; publication/deployment and live acceptance pending',
              '- **Status:** Live accepted / closed for Slick Trap core; AI hazard response and playable counter interactions deferred',
          )
          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          anchor = '- **Approval:** Manny explicitly approved the complete Slick Trap scope as written on 2026-09-07 and directed the ADR-069 live-acceptance status correction in this governance checkpoint.'
          if text.count(anchor) != 1:
              raise SystemExit('ADR-070 approval anchor missing/ambiguous')
          addition = anchor + '\n- **Publication / live acceptance:** PR #120 reviewed head `d6f7f752eaa06f38954ed6fa3adab8a617b3d1b9` passed hosted PR CI run `34153344029`. Manny approved publication; PR #120 squash-merged at `bcc5bcc500b08ea42984eed8afa188fa87ba1cf9`, and post-merge CI/Pages run `34153760001` passed. Manny completed the deployed Slick Trap acceptance matrix and reported all playtests passed on 2026-09-07; product-owner evidence is PR #120 comment `5574748827`.'
          text = text.replace(anchor, addition, 1)
          decisions.write_text(text.rstrip() + '\n')

          # Slice 5 item checklist: close only the Slick functional item line and add objective evidence.
          replace_once(
              'docs/SLICE-5-ITEM-SYSTEM-DESIGN.md',
              '- [ ] Slick lasts approximately 12 seconds, triggers the approved spin/speed effect, and obeys the two-per-owner active cap.',
              '- [x] Slick lasts approximately 12 seconds, triggers the approved spin/speed effect, and obeys the two-per-owner active cap.',
          )
          design = Path('docs/SLICE-5-ITEM-SYSTEM-DESIGN.md')
          text = design.read_text()
          marker = '## Race, HUD, input, and AI integrity'
          if text.count(marker) != 1:
              raise SystemExit('Slice 5 race checklist marker missing/ambiguous')
          evidence = 'Slick Trap acceptance evidence, 2026-09-07: gameplay PR #120 squash-merged at `bcc5bcc500b08ea42984eed8afa188fa87ba1cf9`; post-merge CI/Pages run `34153760001` passed; Manny completed the deployed eight-check live matrix and reported all playtests passed. Product-owner evidence: PR #120 comment `5574748827`. This closes only the Slick Trap functional gate; AI Blast/Slick avoidance, playable Shockwave/counter acceptance, the nine remaining item effects, soak/performance, final Slice 5 acceptance, and Slice 6 remain open.\n\n'
          if 'Slick Trap acceptance evidence, 2026-09-07:' not in text:
              text = text.replace(marker, evidence + marker, 1)
          text = text.replace('deferred Shockwave/Prismatic interactions, Slick, AI hazard avoidance, remaining items, soak/performance, final Slice 5 acceptance, and Slice 6 remain open.', 'deferred Shockwave/Prismatic interactions, AI hazard avoidance, remaining items, soak/performance, final Slice 5 acceptance, and Slice 6 remain open.', 1)
          design.write_text(text.rstrip() + '\n')

          # Durable acceptance evidence record.
          acceptance = Path('docs/SLICK-TRAP-LIVE-ACCEPTANCE-2026-09-07.md')
          acceptance.write_text('''# Slick Trap live acceptance — 2026-09-07\n\n## Result\n\n**PASS / LIVE ACCEPTED.**\n\n## Publication evidence\n\n- Governance checkpoint: PR #119 merge `2ce2212e5d89e192b9118ec07c655bacefbdf45a`; post-merge CI/Pages run `34151395918` passed.\n- Gameplay reviewed head: `d6f7f752eaa06f38954ed6fa3adab8a617b3d1b9`.\n- Hosted clean-install gameplay PR CI: `34153344029` — PASS, including 34 Vitest files / 254 tests and production build.\n- Gameplay publication: PR #120 squash merge `bcc5bcc500b08ea42984eed8afa188fa87ba1cf9`.\n- Post-merge CI / GitHub Pages: run `34153760001` — validation PASS, deployment PASS.\n- Product-owner acceptance evidence: PR #120 comment `5574748827`.\n\n## Live gate accepted\n\nManny completed the deployed acceptance matrix and reported all playtests passed. The accepted checks cover:\n\n1. forced `slick-trap` pickup and successful one-slot consumption;\n2. rear-only placement for both normal ITEM and Brake/Reverse + ITEM;\n3. stationary readable hazard, approximately 12 race-second lifetime, and pause freeze;\n4. approximately 1.1 m trigger with one 360-degree / 0.85-second presentation, roughly 60% retained planar speed, and correct chase/rear driver art;\n5. 0.35-second owner immunity followed by legal later self-trigger;\n6. two active Slicks per owner with successful-third oldest replacement and no three-active state;\n7. `?testSlickAhead=1` victim-side fixture and clean restart reset; and\n8. normal unforced gameplay plus accepted Blast Orb, Nitro Surge, Kinetic Disc, Seeker Drone, and Apex core regressions.\n\n## Closed by this acceptance\n\n- Slick Trap functional item gate.\n- Slick Trap publication/deployment gate.\n- Slick Trap deployed desktop/mobile acceptance evidence exercised by this increment.\n\n## Still open / deferred\n\nNine item effects remain: Blaze Orbs, Frost Orbs, Arc Blade, Arc Hammers, Shockwave, Ink Splat, Nitro Overdrive, Hyper-Drive Rocket, and Prismatic Invincibility. AI item-use policy and the shared Blast/Slick hazard-avoidance increment remain open. Playable Shockwave and real cross-item counter acceptance, Prismatic/Hyper-Drive interactions, issue #106, all-item cleanup/object-count soak, performance evidence, final Slice 5 desktop/mobile acceptance, and Slice 6 remain separate gates.\n\nNo PRD product requirement, item probability, racer statistic, track/checkpoint authority, character asset, or accepted Nitro/Kinetic/Seeker/Apex/Blast behavior changes in this acceptance record.\n'''.rstrip() + '\n')
          PY

          rm .github/workflows/record-slick-live-acceptance.yml
          git diff --check

      - name: Install from lockfile
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Verify LFS runtime assets
        run: git lfs fsck

      - name: Commit acceptance checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION-STATUS.md docs/SLICE-5-SLICK-TRAP-SCOPE.md docs/DECISIONS.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/SLICK-TRAP-LIVE-ACCEPTANCE-2026-09-07.md .github/workflows/record-slick-live-acceptance.yml
          git commit -m "Record Slick Trap live acceptance"
          git push origin HEAD:docs/slick-trap-live-acceptance
