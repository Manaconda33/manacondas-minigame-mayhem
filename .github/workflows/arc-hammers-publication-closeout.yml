name: Arc Hammers Publication Closeout

on:
  push:
    branches: [docs/arc-hammers-publication-closeout]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'Add temporary Arc Hammers publication closeout workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/arc-hammers-publication-closeout
          fetch-depth: 0
          lfs: false

      - name: Reconcile Arc Hammers publication records
        run: |
          python - <<'PY'
          from pathlib import Path

          merge = 'a129bbac75f919dc7136ac50dfd63564fe5cd52e'
          pr_ci = '35137395927'
          post = '35137681000'
          head = 'e395c63e3f0a425a985de2208e624adf2dd87574'

          # README
          p = Path('README.md')
          s = p.read_text()
          old = 'Kinetic Arc Hammers governance is published under amendment 2.16 / ADR-077 through PR #142, and Manny has authorized bounded gameplay plus original model/VFX/audio/presentation implementation under amendment 2.17 / ADR-078; local implementation is in progress and is not yet published or live accepted.'
          new = f'Kinetic Arc Hammers gameplay and original procedural presentation are published under amendment 2.17 / ADR-078 through PR #144 at `{merge}`; hosted validation and Pages passed, while product-owner live acceptance remains pending.'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Decisions
          p = Path('docs/DECISIONS.md')
          s = p.read_text()
          old_status = '- **Status:** Implementation authorized; local feature work is in progress. Gameplay publication, deployment and live acceptance remain pending.'
          new_status = f'- **Status:** Gameplay merged/deployed through PR #144 at `{merge}`; hosted PR CI `{pr_ci}` and post-merge validation/Pages `{post}` passed. Product-owner live acceptance remains pending.'
          old_boundary = '- **Boundary:** This clears the implementation gate only. It does not claim a merged/public gameplay release, hosted deployment or Manny live acceptance. It does not alter probabilities, accepted item behavior, racer statistics, track/checkpoint authority, AI item acquisition/use, dependencies or Slice 6 final polish.'
          new_boundary = f'- **Boundary:** Publication is complete but no Manny live acceptance is claimed. The published increment does not alter probabilities, accepted item behavior, racer statistics, track/checkpoint authority, AI item acquisition/use, dependencies or Slice 6 final polish.\n- **Publication evidence:** Reviewed head `{head}` passed hosted PR CI `{pr_ci}` with 50 test files / 446 tests and 82.19% statement coverage; PR #144 squash-merged at `{merge}` and post-merge validation/GitHub Pages `{post}` passed.'
          assert old_status in s and old_boundary in s
          s = s.replace(old_status, new_status, 1).replace(old_boundary, new_boundary, 1)
          p.write_text(s)

          # Scope
          p = Path('docs/SLICE-5-ARC-HAMMERS-SCOPE.md')
          s = p.read_text()
          old_top = '**Status: SCOPE APPROVED AND GOVERNANCE PUBLISHED. PR #142 MERGED AT `ba7e20ab69666ce04ba253a147c93b1ae985db8f`; POST-MERGE VALIDATION/PAGES `35124948452` PASSED. MANNY AUTHORIZED ARC HAMMERS GAMEPLAY AND ORIGINAL MODEL/VFX/AUDIO/PRESENTATION IMPLEMENTATION ON 2026-09-16. LOCAL IMPLEMENTATION IS IN PROGRESS; GAMEPLAY PUBLICATION AND LIVE ACCEPTANCE REMAIN PENDING.**'
          new_top = f'**Status: GAMEPLAY AND ORIGINAL PROCEDURAL PRESENTATION PUBLISHED. PR #144 MERGED AT `{merge}`; HOSTED PR CI `{pr_ci}` AND POST-MERGE VALIDATION/PAGES `{post}` PASSED. PRODUCT-OWNER LIVE ACCEPTANCE REMAINS PENDING.**'
          assert old_top in s
          s = s.replace(old_top, new_top, 1)
          old_intro = 'This authorization permits the bounded implementation below; it does not claim gameplay publication, deployment or live acceptance, and it does not authorize Slice 6 final polish.'
          new_intro = 'The bounded implementation below is now published and deployed through PR #144. This publication does not claim product-owner live acceptance and does not authorize Slice 6 final polish.'
          assert old_intro in s
          s = s.replace(old_intro, new_intro, 1)
          old_start = 'Governance is published on `main` at `ba7e20ab69666ce04ba253a147c93b1ae985db8f` after Rebounding Arc Blade live acceptance. Post-merge validation and GitHub Pages run `35124948452` passed.'
          new_start = f'Governance remains rooted at PR #142. The gameplay/presentation implementation is published on `main` at `{merge}`; hosted PR CI `{pr_ci}` and post-merge validation/GitHub Pages `{post}` passed.'
          assert old_start in s
          s = s.replace(old_start, new_start, 1)
          old_adr_status = '**Status:** Implementation authorized; local feature work in progress. Gameplay publication, deployment and live acceptance remain pending.'
          new_adr_status = f'**Status:** Gameplay merged/deployed through PR #144 at `{merge}`; hosted PR CI `{pr_ci}` and post-merge validation/Pages `{post}` passed. Live acceptance remains pending.'
          assert old_adr_status in s
          s = s.replace(old_adr_status, new_adr_status, 1)
          old_boundary = '**Boundary:** This clears the implementation gate only. It does not claim a merged/public gameplay release, hosted deployment or Manny live acceptance. It does not alter probabilities, accepted item behavior, racer statistics, track/checkpoint authority, AI item acquisition/use, dependencies or Slice 6 final polish.'
          new_boundary = '**Boundary:** Gameplay publication/deployment is complete, but Manny live acceptance is not yet claimed. The increment does not alter probabilities, accepted item behavior, racer statistics, track/checkpoint authority, AI item acquisition/use, dependencies or Slice 6 final polish.'
          assert old_boundary in s
          s = s.replace(old_boundary, new_boundary, 1)
          old_gate = '4. **Gameplay publication:** **PENDING.** Local implementation and validation must complete before a publication request.'
          new_gate = f'4. **Gameplay publication:** **COMPLETE.** Reviewed head `{head}` passed hosted PR CI `{pr_ci}`; PR #144 squash-merged at `{merge}` and post-merge validation/Pages `{post}` passed.'
          assert old_gate in s
          s = s.replace(old_gate, new_gate, 1)
          p.write_text(s)

          # Testing: replace the stale Hammer governance-only section without touching historical matrices.
          p = Path('docs/TESTING.md')
          s = p.read_text()
          old = '''## Slice 5 Kinetic Arc Hammers - approved governance contract; gameplay/assets held

PRD amendment 2.16, ADR-077, and `docs/SLICE-5-ARC-HAMMERS-SCOPE.md` define the approved future validation contract. **Manny explicitly did not authorize Arc Hammers gameplay implementation or asset/presentation development.** Therefore no Hammer runtime route, model, VFX/audio implementation, fixture, or gameplay test is deployed by this governance checkpoint.

When gameplay is separately authorized later, automated validation must cover the exact approved values and boundaries: five charges; 0.35-second commit-only cadence; forward/backward input; 36 m/s horizontal launch, 11 m/s upward velocity, 24 m/s^2 gravity and 0.20x capped planar inheritance; 0.36 m radius; 0.18-second owner arming; one genuine supporting-surface bounce with 0.78 tangential retention / 0.55 normal restitution; 0.75-second post-bounce and 2.25-second hard lifetime; first-wall and second-terrain-contact destruction; 0.85-second standard hit spin; later self-hit; immunity/Prismatic absorption; Shockwave <=5 m pre-movement clearing; chronological collision ordering; shared-capacity rollback; pause/lifecycle cleanup; race-authority preservation; repeated-use soak; and full accepted-item/race regressions. Helper-only trajectories are insufficient: the real dispatcher, capacity, Circuit Alpha surface query, RacerEffects and runtime camera/contact path must be exercised.

Future primary deployed review route, only after separately authorized gameplay publication: `?testItem=arc-hammers`. Future optional diagnostics are `?testItem=shockwave&testArcHammerCounter=shockwave` and the Prismatic protected/expired `testArcHammerCounter=prismatic` routes defined in the scope. They must never be treated as live or distributed as playable Hammer tests before that later deployment.
'''
          new = f'''## Slice 5 Kinetic Arc Hammers - deployed; live acceptance pending

PRD amendments 2.16-2.17, ADR-077/078, and `docs/SLICE-5-ARC-HAMMERS-SCOPE.md` govern the deployed implementation. Reviewed head `{head}` passed hosted PR CI `{pr_ci}` and PR #144 squash-merged at `{merge}`. Post-merge validation and GitHub Pages run `{post}` passed. Automated evidence is **50 test files / 446 tests**, **82.19% statement / 77.39% branch / 86.56% function / 83.70% line coverage**, strict typecheck, zero-warning lint, Git LFS/runtime-asset verification, branding checks and production build.

Hammer-specific automation covers the exact approved values and boundaries: five charges; 0.35-second commit-only cadence; forward/backward input; 36 m/s horizontal launch, 11 m/s upward velocity, 24 m/s^2 gravity and 0.20x capped planar inheritance; 0.36 m radius; 0.18-second owner arming; one genuine supporting-surface bounce with 0.78 tangential retention / 0.55 normal restitution; 0.75-second post-bounce and 2.25-second hard lifetime; first-wall and second-terrain-contact destruction; 0.85-second standard hit spin; later self-hit; immunity/Prismatic absorption; Shockwave <=5 m pre-movement clearing; chronological collision ordering; shared-capacity rollback; pause/lifecycle cleanup; and race-authority preservation. `tests/arc-hammers-runtime.test.ts` additionally exercises production ITEM input, real shared capacity, the actual Circuit Alpha supporting-surface query, RacerEffects, KartTimeTrial/controller contact state, camera anchoring and recovery behavior.

Primary deployed review route: `?testItem=arc-hammers`. Counter diagnostics: `?testItem=shockwave&testArcHammerCounter=shockwave`, `?testItem=prismatic-invincibility&testArcHammerCounter=prismatic&testArcHammerPhase=protected`, and the same Prismatic route with `testArcHammerPhase=expired`. A miss, rail interception, terrain/lifetime expiry, recovery discontinuity, or unsuitable geometry is INCONCLUSIVE rather than PASS. Product-owner rendered desktop/mobile acceptance remains pending and must be recorded separately.
'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Item-system design
          p = Path('docs/SLICE-5-ITEM-SYSTEM-DESIGN.md')
          s = p.read_text()
          old = 'Original procedural model/VFX/audio presentation and acceptance routes are authorized for this bounded increment. Keep the Arc Hammers functional checklist row open until implementation, validation, publication and live acceptance are complete.'
          new = f'Original procedural model/VFX/audio presentation and acceptance routes are implemented and deployed through PR #144 at `{merge}`; hosted PR CI `{pr_ci}` and post-merge validation/Pages `{post}` passed. Keep the Arc Hammers functional checklist row open until Manny live acceptance is complete.'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Current implementation status is intentionally concise and reconstructable.
          Path('docs/IMPLEMENTATION-STATUS.md').write_text(f'''# Implementation Status

## Current slice

**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - KINETIC ARC HAMMERS DEPLOYED / LIVE ACCEPTANCE PENDING**

PRD baseline: **v1.1, approved implementation amendment 2.17 / ADR-078**.

Latest verified `main`: **`{merge}`**.

## Kinetic Arc Hammers publication - 2026-09-16

Kinetic Arc Hammers gameplay plus the approved original procedural model/VFX/audio/presentation are now merged and deployed under amendments 2.16-2.17 / ADR-077-078.

Publication evidence:

- Final reviewed PR head: **`{head}`**.
- Hosted PR CI **`{pr_ci}`: PASS** — Git LFS verification, clean `npm ci`, strict typecheck, zero-warning lint, **50 test files / 446 tests**, **82.19% statement / 77.39% branch / 86.56% function / 83.70% line coverage**, branding/runtime-asset verification and production build.
- Review repaired accidental connector truncation artifacts in large governance/testing documents before merge; no temporary repair workflow or truncation artifact entered `main`.
- Governed production-runtime coverage includes real ITEM input/inventory/capacity, actual Circuit Alpha supporting-surface sampling, RacerEffects spin/hit state, KartTimeTrial/controller contact behavior, camera anchoring, race-authority preservation and recovery behavior.
- PR #144 squash merge: **`{merge}`**.
- Post-merge validation / GitHub Pages: **`{post}` PASS** for both validation and deploy jobs.
- Existing Vite large-chunk warning remains known/nonblocking.
- Three moderate npm audit findings remain in the unchanged dependency set.

**Publication is complete. Product-owner live acceptance is NOT yet recorded.**

## Deployed Arc Hammers review routes

- Primary: `?testItem=arc-hammers`
- Shockwave: `?testItem=shockwave&testArcHammerCounter=shockwave`
- Prismatic protected: `?testItem=prismatic-invincibility&testArcHammerCounter=prismatic&testArcHammerPhase=protected`
- Prismatic expired: `?testItem=prismatic-invincibility&testArcHammerCounter=prismatic&testArcHammerPhase=expired`

A miss, rail interception, terrain/lifetime expiry, recovery discontinuity or unsuitable geometry is INCONCLUSIVE rather than PASS for counter diagnostics.

## Rebounding Arc Blade final state

Rebounding Arc Blade remains **LIVE ACCEPTED** under amendment 2.15 / ADR-076. Gameplay PR #139 merged at `8822341b61900799e0166cfe94bf69cb3986bf0e`; post-merge validation/Pages `35118484183` passed; PR #139 comment `5700594653` records Manny's deployed acceptance.

## Slice 5 accepted/deployed state

Live-accepted bounded increments include item boxes/one-slot inventory/roulette/HUD/input foundation, Nitro Surge, Ricochet Kinetic Disc, Homing Seeker Drone, Apex core, Timed Blast Orb/HazardSystem, Slick Trap, Slick/Blast AI hazard response, Acoustic Shockwave Pulse, Prismatic Invincibility, Blaze Orbs, Frost Orbs, and Rebounding Arc Blade.

