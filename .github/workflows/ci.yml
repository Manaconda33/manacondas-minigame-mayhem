name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify Git LFS runtime assets
        run: git lfs fsck

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Check out pinned Race Results preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 9aceba5de4c5d184772d3467f47463b26a633df0
          path: feature-preview
          lfs: true

      - name: Verify preview assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git -C feature-preview lfs fsck

      - name: Build Race Results at its preview URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: feature-preview
        run: |
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/race-hud-results/

      - name: Check out pinned Archer review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 62583845461098caee5fec3e1334502da671de1d
          path: archer-preview
          lfs: true

      - name: Verify and build Archer review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: archer-preview
        run: |
          git lfs fsck
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/archer/

      - name: Check out pinned motion blur review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 949fd77993b9859bc9ca68da5b8f3bc01bd846d6
          path: motion-blur-preview
          lfs: true

      - name: Verify and build motion blur review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: motion-blur-preview
        run: |
          git lfs fsck
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/motion-blur/

      - name: Check out pinned terrain material review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 375c933766dbc52cead91592cd69d954ab022d38
          path: terrain-preview
          lfs: true

      - name: Verify and build terrain material review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terrain-preview
        env:
          VITE_SOURCE_COMMIT: 375c933766dbc52cead91592cd69d954ab022d38
        run: |
          git lfs fsck
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/terrain-materials/

      - name: Check out pinned Lunarcrystal review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 1051cd9c8c6b1ff7237dc605417b17869f4cea9b
          path: lunarcrystal-preview
          lfs: true

      - name: Verify and build Lunarcrystal review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: lunarcrystal-preview
        env:
          VITE_SOURCE_COMMIT: 1051cd9c8c6b1ff7237dc605417b17869f4cea9b
        run: |
          git lfs fsck
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/lunarcrystal/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            character: 'Lunarcrystal', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/lunarcrystal/',
            status: 'review only; production acceptance pending'
          }, null, 2));
          JS

      - name: Check out pinned shadow polish review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: efbcc74f5c8103d2b6411c8bdedd35953b224f3f
          path: shadow-preview
          lfs: true

      - name: Verify and build shadow polish review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: shadow-preview
        env:
          VITE_SOURCE_COMMIT: efbcc74f5c8103d2b6411c8bdedd35953b224f3f
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/shadow-polish/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Circuit Alpha shadow polish', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/shadow-polish/',
            status: 'review only; visual and production acceptance pending'
          }, null, 2));
          JS

      - name: Check out pinned Neon Grid main-route review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: e441ab73ed0a5c3a2d75663de7a89a57606689b8
          path: neon-grid-preview
          lfs: true

      - name: Verify and build Neon Grid main-route review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: neon-grid-preview
        env:
          VITE_SOURCE_COMMIT: e441ab73ed0a5c3a2d75663de7a89a57606689b8
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Neon Grid Circuit 02 main-route blockout', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/neon-grid/',
            status: 'Stage 2 review only; no tokens or shortcuts; production acceptance pending'
          }, null, 2));
          JS

      - name: Check out pinned Neon Grid 5.3 residual repair review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 9459bf0f64705fb744f7cc1e810be0c0a6f02b3b
          path: neon-grid-5-3-preview
          lfs: true

      - name: Verify and build Neon Grid 5.3 residual repair review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: neon-grid-5-3-preview
        env:
          VITE_SOURCE_COMMIT: 9459bf0f64705fb744f7cc1e810be0c0a6f02b3b
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-5-3/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Neon Grid 5.3 constrained climbing triangulation', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/neon-grid-5-3/',
            status: '5.3 owner playtest only; no production release or Stage 3'
          }, null, 2));
          JS

      - name: Check out pinned Neon Service Tunnel review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 92025b5f241cae7ac208c977f74b24396ce6909b
          path: neon-grid-tunnel-preview
          lfs: true

      - name: Verify and build Neon Service Tunnel review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: neon-grid-tunnel-preview
        env:
          VITE_SOURCE_COMMIT: 92025b5f241cae7ac208c977f74b24396ce6909b
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-tunnel/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Neon Grid Stage 3 Task 5 Service Tunnel', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/neon-grid-tunnel/',
            status: 'Task 5 owner review only; no production release or further shortcut approval'
          }, null, 2));
          JS

      - name: Check out pinned Billboard runtime for PR validation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: b942c912510ec86312a9d0cd393d71d2eb478ea8
          path: neon-grid-billboard-runtime
          lfs: true

      - name: Validate the exact Billboard runtime before preview publication
        if: github.event_name == 'pull_request'
        working-directory: neon-grid-billboard-runtime
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "b942c912510ec86312a9d0cd393d71d2eb478ea8"
          npm ci
          # Retained native mobile fixture needs the same runner allowance as Dive fbff249.
          npm run typecheck
          npm run lint
          npm run test:ci -- --testTimeout=15000
          npm run build
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-billboard/

      - name: Check out pinned Billboard visual review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: b942c912510ec86312a9d0cd393d71d2eb478ea8
          path: neon-grid-billboard-preview

      - name: Build Billboard visual review with existing runtime assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: neon-grid-billboard-preview
        env:
          VITE_SOURCE_COMMIT: b942c912510ec86312a9d0cd393d71d2eb478ea8
        run: |
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, shutil
          for path in Path('public').rglob('*'):
              if not path.is_file() or path.stat().st_size > 1024:
                  continue
              data = path.read_bytes()
              if not data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  continue
              fields = dict(line.split(' ', 1) for line in data.decode().splitlines())
              source = Path('..')/path
              asset = source.read_bytes()
              assert len(asset) == int(fields['size']), str(path)
              assert hashlib.sha256(asset).hexdigest() == fields['oid'].split(':', 1)[1], str(path)
              shutil.copyfile(source, path)
          PYTHON
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-billboard/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Neon Grid Stage 3 Task 6 Billboard entrance/exit aperture visuals', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/neon-grid-billboard/',
            status: 'Entrance/exit aperture visual retest; smooth exit and remainder review preserved; owner visual acceptance pending; no production release'
          }, null, 2));
          JS

      - name: Check out pinned Dive runtime for PR validation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: b49d9876f8c6ce87956f8b91675c3c8180e56b55
          path: neon-grid-dive-runtime
          lfs: true

      - name: Validate the exact Dive runtime before preview publication
        if: github.event_name == 'pull_request'
        working-directory: neon-grid-dive-runtime
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "b49d9876f8c6ce87956f8b91675c3c8180e56b55"
          npm ci
          npm run validate
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-dive/

      - name: Check out pinned Dive visual review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: b49d9876f8c6ce87956f8b91675c3c8180e56b55
          path: neon-grid-dive-preview

      - name: Build Dive visual review with existing runtime assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: neon-grid-dive-preview
        env:
          VITE_SOURCE_COMMIT: b49d9876f8c6ce87956f8b91675c3c8180e56b55
        run: |
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, shutil
          for path in Path('public').rglob('*'):
              if not path.is_file() or path.stat().st_size > 1024:
                  continue
              data = path.read_bytes()
              if not data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  continue
              fields = dict(line.split(' ', 1) for line in data.decode().splitlines())
              source = Path('..')/path
              asset = source.read_bytes()
              assert len(asset) == int(fields['size']), str(path)
              assert hashlib.sha256(asset).hexdigest() == fields['oid'].split(':', 1)[1], str(path)
              shutil.copyfile(source, path)
          PYTHON
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-dive/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Neon Grid Stage 3 Task 7 Waterfall Dive', source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/neon-grid-dive/',
            status: 'Task 7 owner dive feel/fairness review; accepted tunnel/billboard and production preserved; no balance or production release'
          }, null, 2));
          JS

      - name: Check out pinned Task 8 runtime for PR validation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: 4935cbd97c92ea4acb391f71b5bbaef65591b4d3
          path: neon-grid-task8-runtime
          lfs: true

      - name: Validate exact Task 8 runtime before preview publication
        if: github.event_name == 'pull_request'
        working-directory: neon-grid-task8-runtime
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "4935cbd97c92ea4acb391f71b5bbaef65591b4d3"
          npm ci
          npm run validate
          git diff --check
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-task8/

      - name: Check out pinned Task 8 visual review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          ref: 4935cbd97c92ea4acb391f71b5bbaef65591b4d3
          path: neon-grid-task8-preview

      - name: Build Task 8 visual review with existing runtime assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: neon-grid-task8-preview
        env:
          VITE_SOURCE_COMMIT: 4935cbd97c92ea4acb391f71b5bbaef65591b4d3
        run: |
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, shutil
          for path in Path('public').rglob('*'):
              if not path.is_file() or path.stat().st_size > 1024:
                  continue
              data = path.read_bytes()
              if not data.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  continue
              fields = dict(line.split(' ', 1) for line in data.decode().splitlines())
              source = Path('..')/path
              asset = source.read_bytes()
              assert len(asset) == int(fields['size']), str(path)
              assert hashlib.sha256(asset).hexdigest() == fields['oid'].split(':', 1)[1], str(path)
              shutil.copyfile(source, path)
          PYTHON
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/neon-grid-task8/
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            feature: 'Neon Grid Stage 4 Task 8 Falls Run representative stretch',
            source: process.env.VITE_SOURCE_COMMIT,
            base: '/manacondas-minigame-mayhem/previews/neon-grid-task8/',
            status: 'Task 8 owner visual review only; Falls Run 0.70-0.85; no Task 9, gameplay, balance, AI-rate or production release authority'
          }, null, 2));
          JS

      - name: Assemble the current game and isolated previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' -print -quit)"
          mkdir -p site-root/previews/race-hud-results
          cp -a dist/. site-root/
          cp -a feature-preview/dist/. site-root/previews/race-hud-results/
          test -f site-root/index.html
          test -f site-root/previews/race-hud-results/index.html
          mkdir -p site-root/previews/archer
          cp -a archer-preview/dist/. site-root/previews/archer/
          test -f site-root/previews/archer/index.html
          mkdir -p site-root/previews/motion-blur
          cp -a motion-blur-preview/dist/. site-root/previews/motion-blur/
          test -f site-root/previews/motion-blur/index.html
          mkdir -p site-root/previews/terrain-materials
          cp -a terrain-preview/dist/. site-root/previews/terrain-materials/
          test -f site-root/previews/terrain-materials/index.html
          mkdir -p site-root/previews/lunarcrystal
          cp -a lunarcrystal-preview/dist/. site-root/previews/lunarcrystal/
          test -f site-root/previews/lunarcrystal/index.html
          test -f site-root/previews/lunarcrystal/review-build.json
          mkdir -p site-root/previews/shadow-polish
          cp -a shadow-preview/dist/. site-root/previews/shadow-polish/
          test -f site-root/previews/shadow-polish/index.html
          test -f site-root/previews/shadow-polish/review-build.json

          mkdir -p site-root/previews/neon-grid
          cp -a neon-grid-preview/dist/. site-root/previews/neon-grid/
          test -f site-root/previews/neon-grid/index.html
          test -f site-root/previews/neon-grid/review-build.json

          mkdir -p site-root/previews/neon-grid-5-3
          cp -a neon-grid-5-3-preview/dist/. site-root/previews/neon-grid-5-3/
          test -f site-root/previews/neon-grid-5-3/review-build.json

          mkdir -p site-root/previews/neon-grid-tunnel
          cp -a neon-grid-tunnel-preview/dist/. site-root/previews/neon-grid-tunnel/
          test -f site-root/previews/neon-grid-tunnel/index.html
          test -f site-root/previews/neon-grid-tunnel/review-build.json

          mkdir -p site-root/previews/neon-grid-billboard
          cp -a neon-grid-billboard-preview/dist/. site-root/previews/neon-grid-billboard/
          test -f site-root/previews/neon-grid-billboard/index.html
          test -f site-root/previews/neon-grid-billboard/review-build.json

          mkdir -p site-root/previews/neon-grid-dive
          cp -a neon-grid-dive-preview/dist/. site-root/previews/neon-grid-dive/
          test -f site-root/previews/neon-grid-dive/index.html
          test -f site-root/previews/neon-grid-dive/review-build.json

          mkdir -p site-root/previews/neon-grid-task8
          cp -a neon-grid-task8-preview/dist/. site-root/previews/neon-grid-task8/
          test -f site-root/previews/neon-grid-task8/index.html
          test -f site-root/previews/neon-grid-task8/review-build.json

      - name: Record exact delivery hashes and verify production preservation before publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, urllib.request
          root = Path('site-root')
          paths = [root/'index.html', *sorted((root/'assets').glob('*.js')), *sorted((root/'assets').glob('*.css'))]
          preview = root/'previews/neon-grid-5-3'
          paths += [preview/'index.html', preview/'review-build.json', *sorted((preview/'assets').glob('*.js')), *sorted((preview/'assets').glob('*.css'))]
          tunnel = root/'previews/neon-grid-tunnel'
          paths += [tunnel/'index.html', tunnel/'review-build.json', *sorted((tunnel/'assets').glob('*.js')), *sorted((tunnel/'assets').glob('*.css'))]
          billboard = root/'previews/neon-grid-billboard'
          paths += [billboard/'index.html', billboard/'review-build.json', *sorted((billboard/'assets').glob('*.js')), *sorted((billboard/'assets').glob('*.css'))]
          paths += [billboard/'assets/track/neon-grid/billboard'/name for name in ['paprika-v1.webp', 'arin-v1.webp', 'raven-v1.webp']]
          dive = root/'previews/neon-grid-dive'
          paths += [dive/'index.html', dive/'review-build.json', *sorted((dive/'assets').glob('*.js')), *sorted((dive/'assets').glob('*.css'))]
          paths += [dive/'assets/track/neon-grid/billboard'/name for name in ['paprika-v1.webp', 'arin-v1.webp', 'raven-v1.webp']]
          task8 = root/'previews/neon-grid-task8'
          paths += [task8/'index.html', task8/'review-build.json', *sorted((task8/'assets').glob('*.js')), *sorted((task8/'assets').glob('*.css'))]
          paths += [task8/'assets/track/neon-grid/billboard'/name for name in ['paprika-v1.webp', 'arin-v1.webp', 'raven-v1.webp']]
          report = []
          for path in paths:
              relative = str(path.relative_to(root))
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              url = 'https://manaconda33.github.io/manacondas-minigame-mayhem/' + relative
              if not relative.startswith(('previews/neon-grid-dive/', 'previews/neon-grid-task8/')):
                  with urllib.request.urlopen(url, timeout=45) as response:
                      assert response.status == 200
                      assert hashlib.sha256(response.read()).hexdigest() == sha, 'Production bytes differ: ' + relative
              report.append(dict(path=relative, url=url, sha256=sha, bytes=len(data)))
          Path('delivery-expected.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PYTHON

      - name: Upload delivery hash evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-task8-delivery-hashes
          path: delivery-expected.json

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-root

  spillway-render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact waterfall runtime
        uses: actions/checkout@v5
        with:
          ref: b49d9876f8c6ce87956f8b91675c3c8180e56b55
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install exact runtime dependencies
        run: npm ci
      - name: Render the pinned waterfall spillway and verify draw-call budget
        if: github.event_name == 'pull_request'
        env:
          WATERFALL_PLAYWRIGHT: /tmp/waterfall-webgl
        run: |
          npm install --prefix /tmp/waterfall-webgl --no-package-lock playwright@1.58.2
          export WATERFALL_CHROME="$(command -v google-chrome)"
          npm run dev -- --host 127.0.0.1 > /tmp/waterfall-vite.log 2>&1 &
          spillway_server_pid=$!
          trap 'kill "$spillway_server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/manacondas-minigame-mayhem/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/diagnostics/waterfall-render.mjs /tmp/waterfall-render
          node tools/diagnostics/neon-residual.mjs /tmp/waterfall-render/repair-matrix.json --matrix
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const reports = JSON.parse(readFileSync('/tmp/waterfall-render/repair-matrix.json')).reports;
          if (reports.length !== 18 || reports.some(r => r.summary.airSteps !== 0 || r.summary.maxNativeLoss > 1.83)) throw new Error('Residual repair matrix failed');
          JS

      - name: Upload waterfall rendered evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: waterfall-spillway-render
          path: /tmp/waterfall-render/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Download exact delivery hashes
        uses: actions/download-artifact@v4
        with:
          name: neon-grid-dive-delivery-hashes

      - name: Verify live preview and unchanged production bytes
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, time, urllib.request
          report = json.load(open('delivery-expected.json'))
          for attempt in range(12):
              try:
                  for item in report:
                      request = urllib.request.Request(item['url'] + '?delivery=task8-4935cbd97c92ea4acb391f71b5bbaef65591b4d3', headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                          assert response.status == 200
                          assert len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
                          if item['path'].endswith('review-build.json'):
                              expected_source = '4935cbd97c92ea4acb391f71b5bbaef65591b4d3' if item['path'].startswith('previews/neon-grid-task8/') else 'b49d9876f8c6ce87956f8b91675c3c8180e56b55' if item['path'].startswith('previews/neon-grid-dive/') else 'b942c912510ec86312a9d0cd393d71d2eb478ea8' if item['path'].startswith('previews/neon-grid-billboard/') else '92025b5f241cae7ac208c977f74b24396ce6909b' if item['path'].startswith('previews/neon-grid-tunnel/') else '9459bf0f64705fb744f7cc1e810be0c0a6f02b3b'
                              assert json.loads(data)['source'] == expected_source
                          item['httpStatus'] = response.status
                  break
              except Exception as error:
                  print('Delivery attempt', attempt + 1, str(error), flush=True)
                  if attempt == 11:
                      raise
                  time.sleep(10)
          print(json.dumps(report, indent=2))
          open('delivery-verified.json', 'w').write(json.dumps(report, indent=2))
          PYTHON

      - name: Upload verified delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-task8-delivery-verified
          path: delivery-verified.json
