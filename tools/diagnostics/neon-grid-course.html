<!doctype html>
<html>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080f1d; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
  <canvas></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { KartTimeTrial } from '../../src/game/KartTimeTrial.ts';
    import { ChaseCamera } from '../../src/game/camera/ChaseCamera.ts';
    import { characterById } from '../../src/characters/manifest.ts';

    const params = new URLSearchParams(location.search);
    const quality = ['low', 'medium', 'high'].includes(params.get('quality'))
      ? params.get('quality')
      : 'medium';
    const g = await KartTimeTrial.create({
      canvas: document.querySelector('canvas'),
      character: characterById('aa-09'),
      trackId: 'neon-grid',
      graphicsQuality: quality,
      motionBlur: false,
      mobileSession: false,
      onHud() {},
      onFinish() {},
    });
    window.game = g;
    window.THREE = THREE;
    window.inspectRenderedPixel = (x, y) => {
      const camera = g.camera;
      camera.updateMatrixWorld(true);
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(
        (x / window.innerWidth) * 2 - 1,
        -((y / window.innerHeight) * 2 - 1),
      ), camera);
      return raycaster.intersectObjects(g.scene.children, true).slice(0, 8).map((hit) => {
        const materials = Array.isArray(hit.object.material)
          ? hit.object.material
          : [hit.object.material];
        const geometry = hit.object.geometry;
        const geometryData = geometry?.userData ?? {};
        const position = geometry?.getAttribute('position');
        const vertexColor = geometry?.getAttribute('color');
        const face = hit.face;
        const faceColors = face && vertexColor
          ? [face.a, face.b, face.c].map((index) => [
            vertexColor.getX(index), vertexColor.getY(index), vertexColor.getZ(index),
          ])
          : [];
        const floorIndexStart = geometryData.floorIndexStart ?? 0;
        const floorIndexCount = geometryData.floorIndexCount ?? 0;
        return {
          name: hit.object.name || hit.object.type,
          type: hit.object.type,
          distance: hit.distance,
          point: hit.point.toArray(),
          faceIndex: hit.faceIndex,
          instanceId: hit.instanceId ?? null,
          materials: materials.map((material) => ({
            color: material?.color?.getHexString?.() ?? null,
            emissive: material?.emissive?.getHexString?.() ?? null,
            transparent: material?.transparent ?? null,
            opacity: material?.opacity ?? null,
          })),
          geometry: {
            floorTriangleCount: geometryData.floorTriangleCount ?? null,
            floorIndexStart,
            floorIndexCount,
            isCityFloorFace: hit.faceIndex !== null &&
              hit.faceIndex * 3 >= floorIndexStart &&
              hit.faceIndex * 3 < floorIndexStart + floorIndexCount,
            terracedCityGround: geometryData.terracedCityGround ?? null,
            progressRange: geometryData.progressRange ?? null,
            faceColors,
            faceVertices: face && position
              ? [face.a, face.b, face.c].map((index) => [
                position.getX(index), position.getY(index), position.getZ(index),
              ])
              : [],
          },
        };
      });
    };

    const sector = ['undercity', 'falls-extension', 'course'].includes(params.get('sector')) ? params.get('sector') : 'skyline';
    const requestedProgress = Number(params.get('progress'));
    let progress = sector === 'undercity'
      ? (Number.isFinite(requestedProgress) && requestedProgress >= 0.247 && requestedProgress <= 0.46
        ? requestedProgress : 0.355)
      : sector === 'falls-extension'
        ? (Number.isFinite(requestedProgress) && ((requestedProgress >= 0.47 && requestedProgress <= 0.68) || (requestedProgress >= 0.87 && requestedProgress <= 0.99)) ? requestedProgress : 0.57)
        : sector === 'course'
        ? (Number.isFinite(requestedProgress) && requestedProgress >= 0 && requestedProgress <= 1 ? requestedProgress : 0.355)
        : 0.16;
    let tunnelFraction = Number(params.get('tunnelFraction'));
    let inTunnel = sector === 'course' && params.has('tunnelFraction') &&
      Number.isFinite(tunnelFraction) && tunnelFraction >= 0 && tunnelFraction <= 1;
    let p = inTunnel ? g.track.serviceTunnel.curve.getPointAt(tunnelFraction) : g.track.curve.getPointAt(progress);
    let tangent = (inTunnel ? g.track.serviceTunnel.curve.getTangentAt(tunnelFraction) :
      g.track.curve.getTangentAt(progress)).setY(0).normalize();
    let right = new THREE.Vector3(tangent.z, 0, -tangent.x).normalize();
    const stageAtProgress = (nextProgress, useTunnel = false) => {
      progress = THREE.MathUtils.euclideanModulo(nextProgress, 1);
      inTunnel = useTunnel;
      if (!useTunnel) tunnelFraction = Number.NaN;
      p = inTunnel
        ? g.track.serviceTunnel.curve.getPointAt(tunnelFraction)
        : g.track.curve.getPointAt(progress);
      tangent = (inTunnel
        ? g.track.serviceTunnel.curve.getTangentAt(tunnelFraction)
        : g.track.curve.getTangentAt(progress)).setY(0).normalize();
      right = new THREE.Vector3(tangent.z, 0, -tangent.x).normalize();
      g.kart.respawn(p.clone().add(new THREE.Vector3(0, 1.1, 0)), Math.atan2(tangent.x, tangent.z));
      g.opponents.forEach((o, i) => {
        const q = g.track.curve.getPointAt(THREE.MathUtils.euclideanModulo(
          progress - 0.004 - i * 0.0015, 1,
        ));
        q.addScaledVector(right, ((i % 3) - 1) * 1.6);
        q.y += 1.1;
        o.controller.respawn(q, Math.atan2(tangent.x, tangent.z));
      });
      for (let i = 0; i < 12; i++) g.updateVisuals(1 / 60);
      stagedKartPosition.copy(p).add(new THREE.Vector3(0, 1.1, 0));
      return progress;
    };
    let stagedKartPosition = p.clone().add(new THREE.Vector3(0, 1.1, 0));
    window.stageCourseAtProgress = (nextProgress) => stageAtProgress(nextProgress, false);
    window.stageBillboardGapAtFraction = (requestedFraction) => {
      const fraction = THREE.MathUtils.clamp(Number(requestedFraction), 0, 1);
      const gap = g.track.billboardGap;
      progress = (gap.entry.progress[0] + gap.entry.progress[1]) * 0.5;
      inTunnel = false;
      tunnelFraction = Number.NaN;
      p = gap.curve.getPointAt(fraction);
      tangent = gap.curve.getTangentAt(fraction).setY(0).normalize();
      right = new THREE.Vector3(tangent.z, 0, -tangent.x).normalize();
      g.kart.respawn(p.clone().add(new THREE.Vector3(0, 1.1, 0)), Math.atan2(tangent.x, tangent.z));
      stagedKartPosition.copy(p).add(new THREE.Vector3(0, 1.1, 0));
      for (let i = 0; i < 12; i++) g.updateVisuals(1 / 60);
      return { fraction, position: p.toArray(), tangent: tangent.toArray() };
    };
    stageAtProgress(progress, inTunnel);
    for (let i = 0; i < 120; i++) g.updateVisuals(1 / 60);

    // T9.5 owner camouflage validation must use the *actual* in-game chase
    // camera. The older fixture invented a 10m/28m rear look direction and
    // placed its camera inside solid geometry at the Dive mouth. This made
    // both the rear screenshot and its draw-call reading misleading.
    const diagnosticChase = new ChaseCamera(g.camera, window.innerWidth < 900);
    const placeCamera = (view) => {
      diagnosticChase.update(stagedKartPosition, tangent, view === 'rear', 3, p.y,
        inTunnel ? p.y + g.track.serviceTunnel.headroom - 0.35 : Number.POSITIVE_INFINITY);
    };

    // Actual ChaseCamera line-of-sight evidence: project sampled alternate-road
    // points into this camera's viewport, then raycast toward them through the
    // opaque wallside screen. This complements structural lateral ray tests.
    const currentShortcutSightline = (view) => {
      if (inTunnel || view !== 'chase' || progress > 0.46155) return null;
      const billboard = progress < 0.22;
      const shortcut = billboard ? g.track.billboardGap : g.track.serviceTunnel;
      const screen = g.trackScene.getObjectByName(
        billboard ? 'skyline-deck-fascia' : 'undercity-wallside-sightline-screens',
      );
      if (!screen) return { shortcut: shortcut.id, error: 'missing-screen' };
      g.camera.updateMatrixWorld(true);
      g.trackScene.updateMatrixWorld(true);
      const caster = new THREE.Raycaster();
      const inView = [];
      const samples = billboard
        ? [0.12, 0.22, 0.32, 0.42, 0.52, 0.62, 0.72, 0.82, 0.92]
        : [0.01, 0.03, 0.06, 0.09, 0.12, 0.15, 0.18, 0.22, 0.28, 0.32, 0.42, 0.52, 0.72, 0.92];
      let interiorTargetsEvaluated = 0;
      let interiorTargetsInView = 0;
      let interiorExposed = 0;
      let entranceTargetsInView = 0;
      for (const fraction of samples) {
        const target = shortcut.curve.getPointAt(fraction).add(new THREE.Vector3(0, 0.65, 0));
        const projected = target.clone().project(g.camera);
        // The junction apron intentionally belongs to BOTH legal roads. A
        // scenery occluder across it would hide the actual entrance or road.
        const main = g.track.projectMain(target);
        const mainEdgeMargin = main.lateralDistance - g.track.halfWidthAt(main.progress);
        const sharedMouth = !billboard && (
          g.track.serviceTunnel.junctionContains(target) || mainEdgeMargin <= 0.1
        );
        const interior = billboard || !sharedMouth;
        if (interior) interiorTargetsEvaluated++;
        const inViewport = Math.abs(projected.x) <= 1 && Math.abs(projected.y) <= 1 &&
          projected.z >= -1 && projected.z <= 1;
        if (!inViewport) continue;
        const ray = target.clone().sub(g.camera.position);
        caster.set(g.camera.position, ray.clone().normalize());
        caster.far = ray.length();
        const intercept = caster.intersectObject(screen, false)[0];
        const occluded = Boolean(intercept);
        if (interior) {
          interiorTargetsInView++;
          if (!occluded) interiorExposed++;
        } else {
          entranceTargetsInView++;
        }
        inView.push({
          fraction, interior, sharedMouth, mainEdgeMargin,
          occluded, distance: ray.length(),
          targetWorld: target.toArray(), targetNdc: projected.toArray(),
          blockerDistance: intercept?.distance ?? null,
        });
      }
      return {
        shortcut: shortcut.id,
        cameraWorld: g.camera.position.toArray(),
        viewportTargets: inView.length,
        blockedTargets: inView.filter((sample) => sample.occluded).length,
        interiorTargetsEvaluated, interiorTargetsInView, interiorExposed,
        entranceTargetsInView, samples: inView,
      };
    };

    // Use the actual race camera, actual approved texture on the instanced
    // image plane, and depth-tested fascia visibility. Decorative instance
    // counts cannot satisfy this contract.
    const sponsorArtworkSightline = () => {
      if (progress > 0.22 || inTunnel) return null;
      g.camera.updateMatrixWorld(true);
      g.trackScene.updateMatrixWorld(true);
      const fascia = g.trackScene.getObjectByName('skyline-deck-fascia');
      const raycaster = new THREE.Raycaster();
      const samples = [];
      const visibleMeshes = [];
      const collectVisibleMeshes = (object, parentVisible = true) => {
        const visible = parentVisible && object.visible;
        if (visible && (object.isMesh || object.isInstancedMesh)) visibleMeshes.push(object);
        for (const child of object.children) collectVisibleMeshes(child, visible);
      };
      collectVisibleMeshes(g.scene);
      const faceCoordinates = [-0.4, 0, 0.4];
      for (const name of ['skyline-ad-manaconda-racing', 'skyline-ad-taco-bell-live-mas']) {
        const art = g.trackScene.getObjectByName(name);
        if (!art || !fascia) return { error: 'missing art or fascia', samples };
        const map = art.material.map;
        for (let index = 3; index < 7; index++) {
          const matrix = new THREE.Matrix4();
          art.getMatrixAt(index, matrix);
          const faceSamples = [];
          for (const v of faceCoordinates) {
            for (const u of faceCoordinates) {
              const world = new THREE.Vector3(u * 4, v * 2, 0)
                .applyMatrix4(matrix)
                .applyMatrix4(art.matrixWorld);
              const ndc = world.clone().project(g.camera);
              const inViewport = Math.abs(ndc.x) <= 1 && Math.abs(ndc.y) <= 1 &&
                ndc.z >= -1 && ndc.z <= 1;
              const toward = world.clone().sub(g.camera.position);
              raycaster.set(g.camera.position, toward.clone().normalize());
              raycaster.far = toward.length() + 0.3;
              const intersections = raycaster.intersectObjects(visibleMeshes, false);
              const artHit = intersections.find((hit) =>
                hit.object === art && hit.instanceId === index);
              const blocker = intersections.find((hit) =>
                hit.object !== art && hit.distance < (artHit?.distance ?? Infinity) - 0.02);
              faceSamples.push({
                u, v, world: world.toArray(), ndc: ndc.toArray(), inViewport,
                faceHit: Boolean(artHit),
                visibleArtwork: inViewport && Boolean(artHit) && !blocker,
                blocker: blocker?.object.name ?? null,
              });
            }
          }
          const inView = faceSamples.filter((sample) => sample.inViewport);
          const visibleCount = faceSamples.filter((sample) => sample.visibleArtwork).length;
          const visibleFraction = inView.length > 0 ? visibleCount / inView.length : 0;
          samples.push({
            name, index, inViewport: inView.length > 0,
            imageLoaded: (map?.image?.width ?? 0) > 0,
            faceHit: inView.every((sample) => sample.faceHit),
            visibleArtwork: inView.length > 0 && visibleFraction >= 0.67 &&
              Boolean((map?.image?.width ?? 0) > 0) && art.material.opacity > 0,
            visibleFraction, areaSamplesInViewport: inView.length,
            areaSamplesVisible: visibleCount, faceSamples,
          });
        }
      }
      return {
        samples,
        inViewport: samples.filter((p) => p.inViewport).length,
        readable: samples.filter((p) => p.visibleArtwork).length,
      };
    };

    const undercitySnapshot = () => ({
      windows: g.trackScene.getObjectByName('undercity-city-windows')?.count ?? 0,
      buildings: g.trackScene.getObjectByName('undercity-city-buildings')?.count ?? 0,
      pipes: g.trackScene.getObjectByName('undercity-pipes')?.count ?? 0,
      utilityBoxes: g.trackScene.getObjectByName('undercity-utility-clutter')?.userData.boxCount ?? 0,
      workLights: g.trackScene.getObjectByName('undercity-work-lights')?.count ?? 0,
      serviceBays: g.trackScene.getObjectByName('undercity-service-bays')?.count ?? 0,
      nightshiftAds: g.trackScene.getObjectByName('undercity-ad-nightshift-noodles')?.count ?? 0,
      voltlineAds: g.trackScene.getObjectByName('undercity-ad-voltline-industrial')?.count ?? 0,
      wet: Boolean(g.trackScene.getObjectByName('undercity-wet-asphalt')),
    });

    const skylineSnapshot = () => ({
      windows: g.trackScene.getObjectByName('skyline-city-windows')?.count ?? 0,
      pylons: g.trackScene.getObjectByName('skyline-pylons')?.count ?? 0,
      braces: g.trackScene.getObjectByName('skyline-cross-braces')?.count ?? 0,
      proceduralSigns: g.trackScene.getObjectByName('skyline-procedural-signage')?.count ?? 0,
      manacondaAds: g.trackScene.getObjectByName('skyline-ad-manaconda-racing')?.count ?? 0,
      tacoBellAds: g.trackScene.getObjectByName('skyline-ad-taco-bell-live-mas')?.count ?? 0,
      maskBillboards: Math.max(0, (g.trackScene.getObjectByName('skyline-ad-manaconda-racing')?.count ?? 0) - 3) +
        Math.max(0, (g.trackScene.getObjectByName('skyline-ad-taco-bell-live-mas')?.count ?? 0) - 3),
      raisedBillboardPosts: g.trackScene.getObjectByName('skyline-mask-roadside-billboard-supports')?.count ?? 0,
      facadeMountedBillboards:
        g.trackScene.getObjectByName('skyline-mask-roadside-billboard-supports')?.userData.wallMountedProgress?.length ?? 0,
      wet: Boolean(g.trackScene.getObjectByName('skyline-wet-asphalt')),
    });

    g.renderer.info.autoReset = false;
    const tunnelKartSightline = () => {
      if (!inTunnel) return null;
      g.camera.updateMatrixWorld(true);
      g.trackScene.updateMatrixWorld(true);
      const blockers = ['skyline-deck-fascia', 'undercity-service-bays',
        'undercity-wallside-sightline-screens', 'service-tunnel-roof',
        'service-tunnel-left-wall', 'service-tunnel-right-wall']
        .map((name) => g.trackScene.getObjectByName(name)).filter(Boolean);
      const caster = new THREE.Raycaster();
      const rays = [0.15, 0.65, 1.15].map((height) => {
        const target = stagedKartPosition.clone().add(new THREE.Vector3(0, height, 0));
        const ray = target.clone().sub(g.camera.position);
        caster.set(g.camera.position, ray.clone().normalize());
        caster.far = ray.length() - 0.02;
        const hit = caster.intersectObjects(blockers, false)[0];
        return { height, blocker: hit?.object.name ?? null, camera: g.camera.position.toArray(), target: target.toArray() };
      });
      // Distinct road-ahead visibility: the owner reported a dark wall across
      // the actual turn-in. Kart-only rays cannot detect it.
      const forward = tunnelFraction + (window.__t95CurrentView === 'rear' ? -0.035 : 0.035);
      const aheadPoint = g.track.serviceTunnel.curve.getPointAt(
        THREE.MathUtils.clamp(forward, 0, 1),
      ).add(new THREE.Vector3(0, 0.65, 0));
      const sight = aheadPoint.clone().sub(g.camera.position);
      caster.set(g.camera.position, sight.clone().normalize());
      caster.far = Math.max(0, sight.length() - 0.02);
      const aheadHit = caster.intersectObjects(blockers, false)[0];
      return {
        fraction: tunnelFraction, rays,
        blocked: rays.filter((ray) => ray.blocker !== null),
        roadAhead: { blocker: aheadHit?.object.name ?? null,
          camera: g.camera.position.toArray(), target: aheadPoint.toArray() },
      };
    };

    window.renderFrame = (skylineVisible = true, view = 'chase') => {
      g.trackScene.skyline.group.visible = skylineVisible;
      g.trackScene.billboard.update(4);
      g.trackScene.dive.update(4);
      g.trackScene.fallsRun.update(4);
      g.trackScene.skyline.update(4);
      g.trackScene.undercity.update(4);
      g.trackScene.fallsRunExtension.update(4);
      g.updateVisuals(1 / 60);
      placeCamera(view);
      window.__t95CurrentView = view;
      g.renderer.info.reset();
      g.bloom.render(g.scene, g.camera);
      g.motionBlur.render(false);
      const size = g.renderer.getDrawingBufferSize(new THREE.Vector2());
      return {
        calls: g.renderer.info.render.calls,
        triangles: g.renderer.info.render.triangles,
        geometries: g.renderer.info.memory.geometries,
        textures: g.renderer.info.memory.textures,
        width: size.x,
        height: size.y,
        pixelRatio: g.renderer.getPixelRatio(),
        racers: g.opponents.length + 1,
        quality,
        view,
        skylineVisible,
        skyline: skylineSnapshot(),
        undercity: undercitySnapshot(),
        fallsExtension: fallsExtensionSnapshot(),
        actualCameraShortcutSightline: currentShortcutSightline(view),
        sponsorArtworkSightline: sponsorArtworkSightline(),
        tunnelKartSightline: tunnelKartSightline(),
      };
    };

    window.renderUndercityFrame = (undercityVisible = true, view = 'chase') => {
      g.trackScene.undercity.group.visible = undercityVisible;
      g.trackScene.billboard.update(4);
      g.trackScene.dive.update(4);
      g.trackScene.fallsRun.update(4);
      g.trackScene.skyline.update(4);
      g.trackScene.undercity.update(4);
      g.updateVisuals(1 / 60);
      placeCamera(view);
      g.renderer.info.reset();
      g.bloom.render(g.scene, g.camera);
      g.motionBlur.render(false);
      const size = g.renderer.getDrawingBufferSize(new THREE.Vector2());
      return {
        calls: g.renderer.info.render.calls,
        triangles: g.renderer.info.render.triangles,
        geometries: g.renderer.info.memory.geometries,
        textures: g.renderer.info.memory.textures,
        width: size.x,
        height: size.y,
        pixelRatio: g.renderer.getPixelRatio(),
        racers: g.opponents.length + 1,
        quality,
        view,
        sector,
        undercityVisible,
        skyline: skylineSnapshot(),
        undercity: undercitySnapshot(),
      };
    };

    const fallsExtensionSnapshot = () => ({
      windows: g.trackScene.getObjectByName('falls-run-extension-city-windows')?.count ?? 0,
      towers: g.trackScene.getObjectByName('falls-run-extension-city-towers')?.count ?? 0,
      pylons: g.trackScene.getObjectByName('falls-run-extension-supported-pylons')?.count ?? 0,
      footings: g.trackScene.getObjectByName('falls-run-extension-pylon-footings')?.count ?? 0,
      waterfalls: g.trackScene.getObjectByName('falls-run-extension-ambient-waterfalls')?.count ?? 0,
      mist: g.trackScene.getObjectByName('falls-run-extension-ambient-mist')?.count ?? 0,
      wet: Boolean(g.trackScene.getObjectByName('falls-run-extension-wet-asphalt')),
    });

    window.renderFallsExtensionFrame = (visible = true, view = 'chase') => {
      g.trackScene.fallsRunExtension.group.visible = visible;
      g.trackScene.fallsRunExtension.update(4);
      g.updateVisuals(1 / 60);
      placeCamera(view);
      g.renderer.info.reset();
      g.bloom.render(g.scene, g.camera);
      g.motionBlur.render(false);
      const size = g.renderer.getDrawingBufferSize(new THREE.Vector2());
      return {
        calls: g.renderer.info.render.calls, triangles: g.renderer.info.render.triangles,
        geometries: g.renderer.info.memory.geometries, textures: g.renderer.info.memory.textures,
        width: size.x, height: size.y, pixelRatio: g.renderer.getPixelRatio(),
        racers: g.opponents.length + 1, quality, view, sector, progress,
        extensionVisible: visible, fallsExtension: fallsExtensionSnapshot(),
      };
    };

    // Debug-only per-owner A/B cost: same real camera and renderer, no scene
    // creation or gameplay changes. Every temporarily hidden group is restored.
    window.profileOwnerCalls = (view = 'rear') => {
      const owners = [
        ['skyline', g.trackScene.skyline.group],
        ['undercity', g.trackScene.undercity.group],
        ['fallsRun', g.trackScene.fallsRun.group],
        ['fallsExtension', g.trackScene.fallsRunExtension.group],
        ['billboard', g.trackScene.billboard.group],
        ['dive', g.trackScene.dive.group],
      ];
      placeCamera(view);
      const renderStats = () => {
        g.renderer.info.reset();
        g.bloom.render(g.scene, g.camera);
        g.motionBlur.render(false);
        return {
          calls: g.renderer.info.render.calls,
          triangles: g.renderer.info.render.triangles,
        };
      };
      const full = renderStats();
      const costs = owners.map(([name, group]) => {
        const visible = group.visible;
        try {
          group.visible = false;
          const without = renderStats();
          return {
            name,
            callsSaved: full.calls - without.calls,
            trianglesSaved: full.triangles - without.triangles,
          };
        } finally {
          group.visible = visible;
        }
      });
      renderStats();
      return { full, costs };
    };

    window.measureFrames = async (count = 240, warmup = 45) => {
      g.trackScene.skyline.group.visible = true;
      g.trackScene.undercity.group.visible = true;
      g.trackScene.fallsRunExtension.group.visible = true;
      placeCamera('chase');
      const samples = [];
      let previous = performance.now();
      for (let i = 0; i < count + warmup; i++) {
        await new Promise((resolve) => requestAnimationFrame(resolve));
        const now = performance.now();
        const frameMs = now - previous;
        previous = now;
        const raceTime = i / 60;
        g.trackScene.billboard.update(raceTime);
        g.trackScene.dive.update(raceTime);
        g.trackScene.fallsRun.update(raceTime);
        g.trackScene.fallsRunExtension.update(raceTime);
        g.trackScene.skyline.update(raceTime);
        g.trackScene.undercity.update(raceTime);
        g.updateVisuals(1 / 60);
        g.renderer.info.reset();
        g.bloom.render(g.scene, g.camera);
        g.motionBlur.render(false);
        if (i >= warmup && Number.isFinite(frameMs) && frameMs > 0) samples.push(frameMs);
      }
      const sorted = [...samples].sort((a, b) => a - b);
      const fps = sorted.map((ms) => 1000 / ms).sort((a, b) => a - b);
      const median = (values) => {
        const center = Math.floor(values.length / 2);
        return values.length % 2
          ? values[center]
          : (values[center - 1] + values[center]) / 2;
      };
      return {
        scoredFrames: sorted.length,
        medianFrameMs: median(sorted),
        p95FrameMs: sorted[Math.ceil(sorted.length * 0.95) - 1],
        maxFrameMs: sorted.at(-1),
        medianFps: median(fps),
        over50msFrames: sorted.filter((ms) => ms > 50).length,
      };
    };

    window.renderFrame(true, 'chase');
    window.ready = true;
  </script>
</html>
