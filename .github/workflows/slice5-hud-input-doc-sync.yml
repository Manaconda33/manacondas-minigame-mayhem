name: Slice 5 docs sync

on:
  push:
    branches:
      - feature/slice-5-item-hud-input
    paths:
      - .github/workflows/slice5-hud-input-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slice-5-item-hud-input
      - name: Apply guarded documentation edits
        run: python3 tools/sync-slice5-hud-input-docs.py
      - name: Verify patch
        run: git diff --check
      - name: Commit and remove temporary helpers
        run: |
          rm .github/workflows/slice5-hud-input-doc-sync.yml
          rm tools/sync-slice5-hud-input-docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/IMPLEMENTATION-STATUS.md docs/TESTING.md .github/workflows/slice5-hud-input-doc-sync.yml tools/sync-slice5-hud-input-docs.py
          git commit -m "Document Slice 5 roulette HUD input checkpoint"
          git push origin HEAD:feature/slice-5-item-hud-input
