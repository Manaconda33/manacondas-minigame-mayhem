name: Materialize Slice 6 asphalt textures

on:
  push:
    branches:
      - slice6/circuit-alpha-pbr
    paths:
      - .github/workflows/materialize-slice6-asphalt.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: slice6/circuit-alpha-pbr

      - name: Download approved 1K CC0 Asphalt Track maps
        shell: bash
        run: |
          set -euo pipefail
          root="public/assets/track/materials/asphalt-track"
          mkdir -p "$root"
          curl --fail --location --retry 3 --retry-delay 2             "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/asphalt_track/asphalt_track_diff_1k.jpg"             --output "$root/asphalt_track_diff_1k.jpg"
          curl --fail --location --retry 3 --retry-delay 2             "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/asphalt_track/asphalt_track_nor_gl_1k.jpg"             --output "$root/asphalt_track_nor_gl_1k.jpg"
          curl --fail --location --retry 3 --retry-delay 2             "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/asphalt_track/asphalt_track_rough_1k.jpg"             --output "$root/asphalt_track_rough_1k.jpg"

          file "$root"/*.jpg
          for texture in "$root"/*.jpg; do
            file "$texture" | grep -Eq "1024 ?x ?1024"
          done
          (
            cd "$root"
            sha256sum asphalt_track_diff_1k.jpg asphalt_track_nor_gl_1k.jpg asphalt_track_rough_1k.jpg               > SOURCE-SHA256SUMS.txt
          )

      - name: Commit materialized runtime maps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/track/materials/asphalt-track
          git diff --cached --stat
          git commit -m "Materialize 1K CC0 Circuit Alpha asphalt maps"
          git push origin HEAD:slice6/circuit-alpha-pbr
