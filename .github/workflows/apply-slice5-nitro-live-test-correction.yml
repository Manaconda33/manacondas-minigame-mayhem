name: Apply Slice 5 Nitro live-test correction

on:
  push:
    branches: [feature/slice-5-nitro-live-test-harness-vfx]
    paths:
      - .github/workflows/apply-slice5-nitro-live-test-correction.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: feature/slice-5-nitro-live-test-harness-vfx

      - name: Guard branch base
        run: |
          git fetch origin main --depth=1
          test "$(git merge-base HEAD origin/main)" = "5f41f8fe68e361e451d12c195d2842f05de56ebf"
          git lfs fsck

      - name: Create bounded correction files
        run: |
          cat > src/game/items/ItemTestMode.ts <<'EOF'
          import { ITEM_IDS, type ItemId } from './itemDefinitions';

          const ITEM_ID_SET = new Set<string>(ITEM_IDS);

          export function forcedItemFromSearch(search: string): ItemId | null {
            const value = new URLSearchParams(search).get('testItem');
            return value !== null && ITEM_ID_SET.has(value) ? (value as ItemId) : null;
          }

          export function forcedItemForRacer(forcedItem: ItemId | null, racerId: string): ItemId | null {
            return racerId === 'player' ? forcedItem : null;
          }
          EOF

          cat > src/game/items/NitroSurgeVisual.ts <<'EOF'
          import * as THREE from 'three';

          function additiveMaterial(color: number, opacity: number): THREE.MeshBasicMaterial {
            return new THREE.MeshBasicMaterial({
              color,
              transparent: true,
              opacity,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              toneMapped: false,
            });
          }

          export class NitroSurgeVisual {
            public readonly group = new THREE.Group();
            private readonly flames: THREE.Mesh[] = [];
            private readonly wakeRing: THREE.Mesh;

            public constructor() {
              this.group.name = 'NitroSurgeVisual';
              this.group.visible = false;

              for (const x of [-0.48, 0.48]) {
                const outer = new THREE.Mesh(
                  new THREE.ConeGeometry(0.2, 1.05, 10),
                  additiveMaterial(0x43d9ff, 0.82),
                );
                outer.rotation.x = -Math.PI / 2;
                outer.position.set(x, 0.08, -1.52);

                const core = new THREE.Mesh(
                  new THREE.ConeGeometry(0.095, 0.72, 8),
                  additiveMaterial(0xfff2a8, 0.95),
                );
                core.rotation.x = -Math.PI / 2;
                core.position.set(x, 0.08, -1.43);

                this.flames.push(outer, core);
                this.group.add(outer, core);
              }

              this.wakeRing = new THREE.Mesh(
                new THREE.TorusGeometry(0.82, 0.045, 6, 28),
                additiveMaterial(0x79ebff, 0.68),
              );
              this.wakeRing.position.set(0, 0.12, -1.98);
              this.group.add(this.wakeRing);

              const glow = new THREE.PointLight(0x4fdcff, 2.2, 5.2, 2);
              glow.position.set(0, 0.22, -1.15);
              this.group.add(glow);
            }

            public update(active: boolean, elapsedSeconds: number): void {
              this.group.visible = active;
              if (!active) return;

              const flamePulse = 0.92 + Math.sin(elapsedSeconds * 34) * 0.12;
              for (const flame of this.flames) flame.scale.y = flamePulse;

              const ringPulse = 0.94 + Math.sin(elapsedSeconds * 22) * 0.08;
              this.wakeRing.scale.setScalar(ringPulse);
              this.wakeRing.rotation.z = elapsedSeconds * 2.8;
            }

            public dispose(): void {
              this.group.traverse((object) => {
                if (!(object instanceof THREE.Mesh)) return;
                object.geometry.dispose();
                const materials = Array.isArray(object.material) ? object.material : [object.material];
                for (const material of materials) material.dispose();
              });
              this.group.clear();
              this.group.visible = false;
            }
          }
          EOF

          cat > tests/item-test-mode.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { forcedItemForRacer, forcedItemFromSearch } from '../src/game/items/ItemTestMode';

          describe('Slice 5 live item-test mode', () => {
            it('accepts any governed item id from testItem', () => {
              expect(forcedItemFromSearch('?testItem=nitro-surge')).toBe('nitro-surge');
              expect(forcedItemFromSearch('?foo=1&testItem=kinetic-disc')).toBe('kinetic-disc');
              expect(forcedItemFromSearch('?testItem=prismatic-invincibility')).toBe(
                'prismatic-invincibility',
              );
            });

            it('leaves normal gameplay untouched when testItem is absent or invalid', () => {
              expect(forcedItemFromSearch('')).toBeNull();
              expect(forcedItemFromSearch('?foo=nitro-surge')).toBeNull();
              expect(forcedItemFromSearch('?testItem=not-a-real-item')).toBeNull();
            });

            it('forces only the player inventory', () => {
              expect(forcedItemForRacer('nitro-surge', 'player')).toBe('nitro-surge');
              expect(forcedItemForRacer('nitro-surge', 'ai-1')).toBeNull();
              expect(forcedItemForRacer(null, 'player')).toBeNull();
            });
          });
          EOF

          cat > tests/nitro-surge-visual.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { NitroSurgeVisual } from '../src/game/items/NitroSurgeVisual';

          describe('NitroSurgeVisual', () => {
            it('is hidden by default and visible only while Nitro is active', () => {
              const visual = new NitroSurgeVisual();
              expect(visual.group.visible).toBe(false);

              visual.update(true, 0.1);
              expect(visual.group.visible).toBe(true);

              visual.update(false, 0.2);
              expect(visual.group.visible).toBe(false);
              visual.dispose();
            });

            it('animates its procedural exhaust while active and cleans up resources', () => {
              const visual = new NitroSurgeVisual();
              visual.update(true, 0);
              const firstScale = visual.group.children[0]?.scale.y;
              visual.update(true, 0.05);
              const secondScale = visual.group.children[0]?.scale.y;

              expect(firstScale).toBeDefined();
              expect(secondScale).toBeDefined();
              expect(secondScale).not.toBe(firstScale);
              expect(visual.group.children.length).toBeGreaterThanOrEqual(6);

              visual.dispose();
              expect(visual.group.children).toHaveLength(0);
              expect(visual.group.visible).toBe(false);
            });
          });
          EOF

      - name: Patch runtime, HUD, styles, and continuity docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/game/KartTimeTrial.ts',
              "import { selectItem } from './items/ItemSelector';\nimport { RacerEffects } from './items/RacerEffects';",
              "import { selectItem } from './items/ItemSelector';\nimport { forcedItemForRacer, forcedItemFromSearch } from './items/ItemTestMode';\nimport { NitroSurgeVisual } from './items/NitroSurgeVisual';\nimport { RacerEffects } from './items/RacerEffects';"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "import type { RaceRank } from './items/itemDefinitions';",
              "import { ITEM_DEFINITIONS, type RaceRank } from './items/itemDefinitions';"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "  item: ItemHudSnapshot;\n}",
              "  item: ItemHudSnapshot;\n  testModeItemLabel: string | null;\n}"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "  private readonly itemSystem = new ItemSystem();\n  private readonly racerEffects = new RacerEffects();\n  private lastApexSelectionTime = Number.NEGATIVE_INFINITY;",
              "  private readonly itemSystem = new ItemSystem();\n  private readonly racerEffects = new RacerEffects();\n  private readonly forcedTestItem = forcedItemFromSearch(window.location.search);\n  private readonly nitroSurgeVisual = new NitroSurgeVisual();\n  private lastApexSelectionTime = Number.NEGATIVE_INFINITY;"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "    this.itemBoxes = new ItemBoxSystem(this.track);\n    this.scene.add(this.itemBoxes.group);",
              "    this.itemBoxes = new ItemBoxSystem(this.track);\n    this.scene.add(this.itemBoxes.group);\n    this.kartMesh.add(this.nitroSurgeVisual.group);"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "    this.itemSystem.dispose();\n    this.racerEffects.dispose();\n    this.renderer.dispose();",
              "    this.itemSystem.dispose();\n    this.racerEffects.dispose();\n    this.nitroSurgeVisual.dispose();\n    this.renderer.dispose();"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "      const apexAvailable = this.elapsed - this.lastApexSelectionTime >= 18;\n      const itemId = selectItem({ rank, distanceBehindLeaderMeters, apexAvailable });\n      if (!this.itemSystem.acquire(racerId, itemId)) return false;\n      if (itemId === 'apex-missile') this.lastApexSelectionTime = this.elapsed;\n      return true;",
              "      const forcedItem = forcedItemForRacer(this.forcedTestItem, racerId);\n      const apexAvailable = this.elapsed - this.lastApexSelectionTime >= 18;\n      const itemId =\n        forcedItem ?? selectItem({ rank, distanceBehindLeaderMeters, apexAvailable });\n      if (!this.itemSystem.acquire(racerId, itemId)) return false;\n      if (forcedItem === null && itemId === 'apex-missile') this.lastApexSelectionTime = this.elapsed;\n      return true;"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "    this.lastToneTier = feedback.driftTier;\n    this.updatePlayerDriverSprite();",
              "    this.lastToneTier = feedback.driftTier;\n    this.nitroSurgeVisual.update(\n      this.racerEffects.remainingSeconds('player', 'nitro-surge') > 0,\n      this.elapsed,\n    );\n    this.updatePlayerDriverSprite();"
          )
          replace_once(
              'src/game/KartTimeTrial.ts',
              "      item: this.itemSystem.hudSnapshot('player'),\n      minimap: {",
              "      item: this.itemSystem.hudSnapshot('player'),\n      testModeItemLabel:\n        this.forcedTestItem === null ? null : ITEM_DEFINITIONS[this.forcedTestItem].displayName,\n      minimap: {"
          )

          replace_once(
              'src/app/mountAppShell.ts',
              "        <div id=\"countdown\" class=\"countdown\">3</div>\n        <div id=\"loading\"",
              "        <div id=\"countdown\" class=\"countdown\">3</div>\n        <div id=\"item-test-mode\" class=\"item-test-mode\" hidden></div>\n        <div id=\"loading\""
          )
          replace_once(
              'src/app/mountAppShell.ts',
              "      updateRaceMinimap(minimap, state.minimap);\n      updateItemHud(itemHud, state.item);\n      const driftPanel = getElement('#drift-panel');",
              "      updateRaceMinimap(minimap, state.minimap);\n      updateItemHud(itemHud, state.item);\n      const testMode = getElement('#item-test-mode');\n      testMode.hidden = state.testModeItemLabel === null;\n      testMode.textContent =\n        state.testModeItemLabel === null\n          ? ''\n          : `TEST MODE · FORCED ${state.testModeItemLabel.toUpperCase()}`;\n      const driftPanel = getElement('#drift-panel');"
          )

          replace_once(
              'src/style.css',
              ".game-help {\n  position: absolute;",
              ".item-test-mode {\n  position: absolute;\n  top: 9.4rem;\n  right: 1rem;\n  z-index: 5;\n  max-width: 13rem;\n  padding: 0.45rem 0.6rem;\n  border: 1px solid rgb(121 235 255 / 55%);\n  border-radius: 0.55rem;\n  color: #dffaff;\n  background: rgb(5 25 34 / 82%);\n  box-shadow: 0 0 1.25rem rgb(67 217 255 / 22%);\n  font-size: 0.58rem;\n  font-weight: 900;\n  letter-spacing: 0.08em;\n  line-height: 1.35;\n  text-align: right;\n  text-transform: uppercase;\n  pointer-events: none;\n}\n.game-help {\n  position: absolute;"
          )
          replace_once(
              'src/style.css',
              ".game-shell.is-finished .drift-panel,\n.game-shell.is-finished .game-help,",
              ".game-shell.is-finished .drift-panel,\n.game-shell.is-finished .item-test-mode,\n.game-shell.is-finished .game-help,"
          )

          replace_once(
              'README.md',
              "Slice 3 Character Selection & Avatar Ingestion is complete and live accepted. The competitive Grand Prix systems defined for Slice 4 were completed earlier because of a documented sequencing error and remain retained. Slice 5 foundation, visible item boxes, roulette, held-item HUD, and desktop/mobile ITEM input are merged, deployed, and product-owner accepted. The current approval-gated feature branch adds the first real item-effect checkpoint: a generic RacerEffects temporary-boost boundary plus Nitro Surge activation, governed 1.18x speed cap, strong acceleration, off-road speed-penalty override, pause-safe expiry, successful charge consumption, and inventory-slot release. All other item effects, projectiles, hazards, Rocket autopilot, and AI tactical item use remain later Slice 5 work.",
              "Slice 3 Character Selection & Avatar Ingestion is complete and live accepted. The competitive Grand Prix systems defined for Slice 4 were completed earlier because of a documented sequencing error and remain retained. Slice 5 foundation, visible item boxes, roulette, held-item HUD, desktop/mobile ITEM input, and the RacerEffects + Nitro Surge implementation are merged and deployed. Nitro Surge live acceptance is paused for a small approval-gated correction that adds a reusable player-only `testItem=<item-id>` acceptance harness and an in-world procedural Nitro activation tell. All other item effects, projectiles, hazards, Rocket autopilot, and AI tactical item use remain later Slice 5 work."
          )

          replace_once(
              'docs/IMPLEMENTATION-STATUS.md',
              "**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - RACER EFFECTS FOUNDATION + NITRO SURGE IMPLEMENTED ON FEATURE BRANCH / MANNY REVIEW PENDING**",
              "**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - NITRO SURGE MERGED / LIVE ACCEPTANCE CORRECTION FOR FORCED-ITEM HARNESS + VFX IN REVIEW**"
          )
          old_gate = "Validation run **34012300286** passed Git LFS verification, `npm ci`, strict typecheck, zero-warning lint, **23 Vitest files / 127 tests**, **90.43% overall statement coverage**, **93.26% `game/items` statement coverage**, 100% coverage for `RacerEffects.ts`, existing three-lap AI integration, the ten-minute numeric soak, branding/runtime-asset checks, `git diff --check`, and the production Vite build. Earlier guarded validation runs exposed only synthetic controller-test ground-boundary mistakes; those fixtures were corrected without weakening any product assertion or quality gate.\n\n**Approval gate:** this RacerEffects + Nitro Surge feature must be reviewed through its pull request and authoritative PR CI before merge. Do not merge, deploy, or begin another item effect without Manny approval. Projectiles/hazards, hostile racer effects, Nitro Overdrive, Hyper-Drive Rocket autopilot, Prismatic Invincibility, and AI tactical item use remain incomplete. Slice 6 remains locked."
          new_gate = "Validation run **34012300286** passed Git LFS verification, `npm ci`, strict typecheck, zero-warning lint, **23 Vitest files / 127 tests**, **90.43% overall statement coverage**, **93.26% `game/items` statement coverage**, 100% coverage for `RacerEffects.ts`, existing three-lap AI integration, the ten-minute numeric soak, branding/runtime-asset checks, `git diff --check`, and the production Vite build. Earlier guarded validation runs exposed only synthetic controller-test ground-boundary mistakes; those fixtures were corrected without weakening any product assertion or quality gate.\n\nManny approved PR #100, which squash-merged to `main` at **`5f41f8fe68e361e451d12c195d2842f05de56ebf`**. Post-merge CI / Pages run **34012662528** passed LFS verification, dependency installation, typecheck, zero-warning lint, all tests, production build, Pages artifact upload, and deployment. Pages artifact **9982946836** has digest `sha256:b46ea5e917f8488e799fee67945f737e98e4a4b10d6915353b2a13fd7908115c`.\n\nBefore live acceptance, Manny identified two practical acceptance gaps and approved a corrective checkpoint: force the item under test through a reusable player-only URL parameter so manual item verification does not depend on lottery timing, and add an in-world Nitro Surge visual tell. Branch `feature/slice-5-nitro-live-test-harness-vfx` implements only those corrections plus continuity updates. Normal URLs continue using the governed selector; AI inventories are never forced.\n\n**Approval gate:** validate and review the forced-item harness + Nitro VFX correction before merge. After its approved deployment, rerun Nitro Surge desktop/mobile acceptance using the deterministic test URL. Do not begin another item effect until Nitro Surge is live accepted and recorded. Slice 6 remains locked."
          replace_once('docs/IMPLEMENTATION-STATUS.md', old_gate, new_gate)
          replace_once(
              'docs/IMPLEMENTATION-STATUS.md',
              "Remaining approval work for this checkpoint is PR review/CI, approved merge/Pages deployment, then deployed desktop/mobile product-owner acceptance.",
              "PR #100 is merged and deployed. Remaining approval work is the corrective forced-item/VFX PR, its Pages deployment, then deployed desktop/mobile product-owner acceptance of Nitro Surge."
          )

          testing = Path('docs/TESTING.md').read_text()
          testing = testing.replace(
              "- Nitro Surge tuning remains configuration data at approximately 1.2 seconds and 1.18x normal speed cap;",
              "- the player-only `testItem=<item-id>` acceptance override accepts only the fifteen governed IDs, ignores invalid/missing values, and never forces AI inventories;\n- normal URLs without `testItem` continue through the governed position/gap selector unchanged;\n- the Nitro Surge procedural rear exhaust/energy visual is hidden outside the effect, visible while the `nitro-surge` RacerEffects state is active, and releases its Three.js resources on disposal;\n- Nitro Surge tuning remains configuration data at approximately 1.2 seconds and 1.18x normal speed cap;",
              1,
          )
          testing = testing.replace(
              "1. Collect boxes until Nitro Surge is selected; confirm the existing approximately 0.85-second roulette behavior is unchanged.",
              "Use `https://manaconda33.github.io/manacondas-minigame-mayhem/?testItem=nitro-surge` for the Nitro acceptance pass. The test-mode badge must identify Nitro Surge, every player pickup must resolve to Nitro Surge, and AI pickups must remain normal. Also load the normal URL once to confirm the production selector is not forced.\n\n1. Collect a player item box in forced Nitro test mode; confirm roulette remains approximately 0.85 seconds and resolves to Nitro Surge every time.",
              1,
          )
          testing = testing.replace(
              "4. Confirm the race status reports `NITRO SURGE ACTIVE` during the effect.",
              "4. Confirm the race status reports `NITRO SURGE ACTIVE` and the kart shows a clear rear exhaust/energy Nitro tell for the same active interval.",
              1,
          )
          Path('docs/TESTING.md').write_text(testing)
          PY

      - name: Format and verify bounded diff
        run: |
          npm ci
          npm run format
          git diff --check
          test ! -e .github/workflows/sync-slice5-nitro-docs.yml

      - name: Validate repository
        run: npm run validate

      - name: Remove temporary workflow and commit correction
        run: |
          rm .github/workflows/apply-slice5-nitro-live-test-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Add deterministic item test mode and Nitro VFX"
          git push origin HEAD:feature/slice-5-nitro-live-test-harness-vfx
