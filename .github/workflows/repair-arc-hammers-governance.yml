name: Repair Arc Hammers Governance Docs

on:
  push:
    branches: [feature/arc-hammers-gameplay]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'Repair Arc Hammers testing doc' && github.event.head_commit.message != 'Remove temporary governance repair workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arc-hammers-gameplay
          fetch-depth: 0
          lfs: false

      - name: Restore clean TESTING source and apply Arc Hammers evidence
        run: |
          git fetch origin main
          git show origin/main:docs/TESTING.md > /tmp/TESTING.md
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/TESTING.md').read_text()
          old = '''## Slice 5 Kinetic Arc Hammers - approved governance contract; gameplay/assets held

PRD amendment 2.16, ADR-077, and `docs/SLICE-5-ARC-HAMMERS-SCOPE.md` define the approved future validation contract. **Manny explicitly did not authorize Arc Hammers gameplay implementation or asset/presentation development.** Therefore no Hammer runtime route, model, VFX/audio implementation, fixture, or gameplay test is deployed by this governance checkpoint.

When gameplay is separately authorized later, automated validation must cover the exact approved values and boundaries: five charges; 0.35-second commit-only cadence; forward/backward input; 36 m/s horizontal launch, 11 m/s upward velocity, 24 m/s^2 gravity and 0.20x capped planar inheritance; 0.36 m radius; 0.18-second owner arming; one genuine supporting-surface bounce with 0.78 tangential retention / 0.55 normal restitution; 0.75-second post-bounce and 2.25-second hard lifetime; first-wall and second-terrain-contact destruction; 0.85-second standard hit spin; later self-hit; immunity/Prismatic absorption; Shockwave <=5 m pre-movement clearing; chronological collision ordering; shared-capacity rollback; pause/lifecycle cleanup; race-authority preservation; repeated-use soak; and full accepted-item/race regressions. Helper-only trajectories are insufficient: the real dispatcher, capacity, Circuit Alpha surface query, RacerEffects and runtime camera/contact path must be exercised.

Future primary deployed review route, only after separately authorized gameplay publication: `?testItem=arc-hammers`. Future optional diagnostics are `?testItem=shockwave&testArcHammerCounter=shockwave` and the Prismatic protected/expired `testArcHammerCounter=prismatic` routes defined in the scope. They must never be treated as live or distributed as playable Hammer tests before that later deployment.
'''
          new = '''## Slice 5 Kinetic Arc Hammers - implementation authorized; local validation complete

PRD amendment 2.16, ADR-077, ADR-078, and `docs/SLICE-5-ARC-HAMMERS-SCOPE.md` define the authorized bounded contract. Manny explicitly authorized Arc Hammers gameplay and original model/VFX/audio/presentation development on 2026-09-16. Publication, deployment, rendered desktop/mobile review, and live acceptance remain separate gates.

Automated validation covers the approved values and boundaries: five charges; 0.35-second commit-only cadence; forward/backward input; 36 m/s horizontal launch, 11 m/s upward velocity, 24 m/s^2 gravity and 0.20x capped planar inheritance; 0.36 m radius; 0.18-second owner arming; one genuine supporting-surface bounce with 0.78 tangential retention / 0.55 normal restitution; 0.75-second post-bounce and 2.25-second hard lifetime; first-wall and second-terrain-contact destruction; 0.85-second standard hit spin; later self-hit; immunity/Prismatic absorption; Shockwave <=5 m pre-movement clearing; chronological collision ordering; shared-capacity rollback; pause/lifecycle cleanup; race-authority preservation; repeated-use soak; and accepted-item/race regressions. Helper-only trajectories are insufficient: the real dispatcher, capacity, Circuit Alpha surface query, RacerEffects and runtime camera/contact path must be exercised.

Primary review route: `?testItem=arc-hammers`. Optional diagnostics are `?testItem=shockwave&testArcHammerCounter=shockwave` and the Prismatic protected/expired `testArcHammerCounter=prismatic` routes defined in the scope. They may be exercised after approved deployment, but no diagnostic PASS may be inferred from a miss, interception, wall/terrain expiry, recovery, or unsuitable geometry.

Current implementation evidence: `tests/arc-hammers.test.ts` covers configuration/launch math, governed counter-route parsing, five-charge cadence/rollback, ballistic motion, supporting-surface bounce/cues, racer hit/immunity, owner arming, Shockwave pre-movement clearing, presentation cleanup and the shared capacity boundary. Full local `npm run validate` passed with 49 test files / 441 tests, 81.99% statement coverage, 77.11% branch coverage, 86.56% function coverage and 83.49% line coverage, plus strict typecheck, zero-warning lint, branding/runtime-asset checks and production build. Hosted CI and rendered live acceptance remain publication gates.
'''
          assert old in text
          text = text.replace(old, new, 1)
          assert 'Warning: truncated output' not in text
          assert text.count('## Slice 5 Kinetic Arc Hammers - implementation authorized; local validation complete') == 1
          Path('docs/TESTING.md').write_text(text)
          PY

          ! grep -q 'Warning: truncated output' docs/TESTING.md
          test "$(grep -c '^## Slice 5 Kinetic Arc Hammers - implementation authorized; local validation complete$' docs/TESTING.md)" -eq 1
          git diff --numstat origin/main -- docs/TESTING.md

      - name: Commit repaired TESTING doc
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TESTING.md
          git commit -m 'Repair Arc Hammers testing doc'
          git push origin HEAD:feature/arc-hammers-gameplay
