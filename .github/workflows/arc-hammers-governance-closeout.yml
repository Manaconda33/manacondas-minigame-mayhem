name: Arc Hammers Governance Closeout

on:
  push:
    branches:
      - docs/arc-hammers-governance-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: "github.event.head_commit.message != 'Record Arc Hammers governance publication'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: docs/arc-hammers-governance-closeout
          fetch-depth: 0
          lfs: false

      - name: Reconcile remaining governance records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          merge = 'ba7e20ab69666ce04ba253a147c93b1ae985db8f'
          post = '35124948452'
          pr_ci = '35124762217'

          p = Path('docs/DECISIONS.md')
          s = p.read_text()
          old = '- **Status:** Approved by Manny; governance publication checkpoint in progress.'
          new = f'- **Status:** Governance published through PR #142 at `{merge}`; post-merge validation and GitHub Pages `{post}` passed. Gameplay and asset/presentation development remain NOT AUTHORIZED.'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/SLICE-5-ARC-HAMMERS-SCOPE.md')
          s = p.read_text()
          replacements = [
              (
                  '**Status: SCOPE APPROVED BY MANNY ON SEPTEMBER 16, 2026. GOVERNANCE PUBLICATION IS IN PROGRESS. GAMEPLAY IMPLEMENTATION AND ASSET DEVELOPMENT ARE EXPLICITLY NOT AUTHORIZED.**',
                  f'**Status: SCOPE APPROVED AND GOVERNANCE PUBLISHED. PR #142 MERGED AT `{merge}`; POST-MERGE VALIDATION/PAGES `{post}` PASSED. GAMEPLAY IMPLEMENTATION AND ASSET/PRESENTATION DEVELOPMENT REMAIN EXPLICITLY NOT AUTHORIZED.**',
              ),
              (
                  'The next permitted work is governance publication only: synchronize the canonical PRD, decision log, item-system checklist, testing/status records, and Word approval artifact, then validate and publish that documentation checkpoint. Gameplay requires a separate later authorization after the governance gate is fully cleared.',
                  'The governance publication gate is now cleared through PR #142 and post-merge validation/Pages. No further Hammer work is authorized by that publication. Gameplay and asset/presentation development require a separate later Manny authorization.',
              ),
              (
                  'Continue from `main` `da6e7e178d30ed5e2d03103dd1bbe18ba120b97d`, after Rebounding Arc Blade live acceptance reconciliation and successful post-merge validation/Pages run `35121093818`.',
                  f'Governance is published on `main` at `{merge}` after Rebounding Arc Blade live acceptance. Post-merge validation and GitHub Pages run `{post}` passed.',
              ),
              (
                  '**Status:** Approved by Manny on September 16, 2026; canonical decision-log publication pending.',
                  f'**Status:** Governance published through PR #142 at `{merge}`; post-merge validation/Pages `{post}` passed. Gameplay and asset/presentation development remain NOT AUTHORIZED.',
              ),
              (
                  '2. **Governance publication:** **IN PROGRESS / NOT YET CLEARED.** Synchronize canonical `docs/PRD.md`, `docs/DECISIONS.md`, `docs/SLICE-5-ITEM-SYSTEM-DESIGN.md`, `docs/TESTING.md`, `docs/IMPLEMENTATION-STATUS.md`, and the Word PRD approval artifact required by PRD §31.3; validate, hosted CI, merge and Pages deployment.',
                  f'2. **Governance publication:** **COMPLETE.** PR #142 squash-merged at `{merge}` after clean-head hosted CI `{pr_ci}` passed; post-merge validation and GitHub Pages `{post}` passed. Markdown governance and the 52-page Word PRD approval artifact are synchronized.',
              ),
          ]
          for old, new in replacements:
              assert old in s, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/DECISIONS.md\ndocs/SLICE-5-ARC-HAMMERS-SCOPE.md'

      - name: Commit reconciled records
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/SLICE-5-ARC-HAMMERS-SCOPE.md
          git commit -m 'Record Arc Hammers governance publication'
          git push origin HEAD:docs/arc-hammers-governance-closeout
