name: Candidate B AI Execution Experiment

on:
  push:
    branches: [experiment/candidate-b-ai-execution]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out execution-assist branch
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS assets
        run: git lfs fsck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate execution-assist experiment
        run: npm run validate
