name: Arc Hammers Governance Synchronization

on:
  push:
    branches: [proposal/slice-5-arc-hammers-scope]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.head_commit.message != 'Publish approved Arc Hammers governance docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          ref: proposal/slice-5-arc-hammers-scope
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Generate approved governance documents
        run: |
          sed -i 's/a4d14894488433286d616181e24a3e7a61ad40394d3f59af93c5f54e0a688703/0e8a52fe715e86ab7df9331b675ff57f3ac66a77337049ccc87005f437f10ed3/' tools/governance/sync_arc_hammers_governance.py
          python tools/governance/sync_arc_hammers_governance.py

      - name: Verify governance-only diff
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(README\.md|docs/(PRD\.md|DECISIONS\.md|IMPLEMENTATION-STATUS\.md|TESTING\.md|SLICE-5-ITEM-SYSTEM-DESIGN\.md|Manacondas_Minigame_Mayhem_PRD_v1\.1\.docx))$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Unexpected non-governance changes:"
            echo "$forbidden"
            exit 1
          fi

      - name: Commit synchronized governance set
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/PRD.md docs/DECISIONS.md docs/IMPLEMENTATION-STATUS.md docs/TESTING.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/Manacondas_Minigame_Mayhem_PRD_v1.1.docx
          git commit -m 'Publish approved Arc Hammers governance docs'
          git push origin HEAD:proposal/slice-5-arc-hammers-scope
