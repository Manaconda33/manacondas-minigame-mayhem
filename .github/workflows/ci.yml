name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS runtime assets
        run: git lfs fsck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Check out pinned Race Results preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: 312184c5dc394e4437c3760fd8fd686688ad9698
          path: feature-preview
          lfs: true

      - name: Verify preview assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git -C feature-preview lfs fsck

      - name: Build Race Results at its preview URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: feature-preview
        run: |
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/race-hud-results/

      - name: Assemble the current game and isolated preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f dist/assets/index-Dt74Qa1M.js
          test -f dist/assets/index-612kuw8p.css
          mkdir -p site-root/previews/race-hud-results
          cp -a dist/. site-root/
          cp -a feature-preview/dist/. site-root/previews/race-hud-results/
          test -f site-root/index.html
          test -f site-root/previews/race-hud-results/index.html

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
