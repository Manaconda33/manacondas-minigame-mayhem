name: Shockwave governance recorder

on:
  push:
    branches:
      - docs/slice-5-shockwave-governance

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/slice-5-shockwave-governance
          fetch-depth: 0
      - name: Record approved Shockwave governance
        run: python tools/shockwave_governance_recorder.py
      - name: Normalize text endings
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "README.md",
              "docs/PRD.md",
              "docs/DECISIONS.md",
              "docs/IMPLEMENTATION-STATUS.md",
              "docs/TESTING.md",
              "docs/SLICE-5-ITEM-SYSTEM-DESIGN.md",
              "docs/SLICE-5-SHOCKWAVE-SCOPE.md",
          ):
              path = Path(name)
              if path.exists():
                  path.write_text(path.read_text().rstrip() + "\n")
          PY
      - name: Commit governance checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record approved Shockwave governance"
          git push origin HEAD:docs/slice-5-shockwave-governance
