name: Shockwave final integration validation

on:
  push:
    branches:
      - feature/slice-5-shockwave

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/slice-5-shockwave
          fetch-depth: 0
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Refresh same-step Shockwave target snapshots
        run: python tools/shockwave_finalize.py
      - name: Format source change
        run: npx prettier --write src/game/KartTimeTrial.ts
      - name: Validate gameplay tree
        run: |
          git diff --check
          git lfs fsck
          npm run validate
          npx prettier --check src/game/KartTimeTrial.ts
      - name: Commit validated gameplay tree
        id: gameplay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/KartTimeTrial.ts
          git diff --cached --check
          git commit -m "Refresh Shockwave same-step target snapshots"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record validation evidence and remove temporary tooling
        env:
          CODE_SHA: ${{ steps.gameplay.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python tools/shockwave_finalize.py record "$CODE_SHA" "$RUN_ID"
          rm .github/workflows/shockwave-finalize.yml tools/shockwave_finalize.py
          npx prettier --write docs/IMPLEMENTATION-STATUS.md
          git diff --check
          npx prettier --check docs/IMPLEMENTATION-STATUS.md
      - name: Commit continuity evidence and push
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Record validated Shockwave gameplay checkpoint"
          git push origin HEAD:feature/slice-5-shockwave
