name: Arc Hammers Governance Export

on:
  push:
    branches: [proposal/slice-5-arc-hammers-scope]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Package governance source files
        uses: actions/upload-artifact@v4
        with:
          name: arc-hammers-governance-source
          if-no-files-found: error
          retention-days: 1
          path: |
            README.md
            docs/PRD.md
            docs/DECISIONS.md
            docs/IMPLEMENTATION-STATUS.md
            docs/TESTING.md
            docs/SLICE-5-ITEM-SYSTEM-DESIGN.md
            docs/SLICE-5-ARC-HAMMERS-SCOPE.md
            docs/Manacondas_Minigame_Mayhem_PRD_v1.1.docx
