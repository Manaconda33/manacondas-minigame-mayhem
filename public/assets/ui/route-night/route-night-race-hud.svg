<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hud-panel-fill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121d38" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#0b1227" stop-opacity=".92"/>
      <stop offset="1" stop-color="#070b1a" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="hud-gold-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe5a0"/>
      <stop offset="1" stop-color="#f3c85c"/>
    </linearGradient>
    <linearGradient id="hud-cyan-fill" x1="0" x2="1">
      <stop offset="0" stop-color="#b5f5ff"/>
      <stop offset="1" stop-color="#78e8fa"/>
    </linearGradient>
    <filter id="hud-glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hud-glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

