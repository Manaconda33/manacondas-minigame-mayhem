name: Arc Hammers Acceptance Closeout

on:
  push:
    branches: [docs/arc-hammers-live-acceptance]
    paths:
      - '.github/workflows/arc-hammers-acceptance-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/arc-hammers-live-acceptance
          fetch-depth: 0
          lfs: false
      - name: Apply live-acceptance reconciliation
        run: python .github/tmp/arc-hammers-acceptance-closeout.py
      - name: Validate and commit
        run: |
          git diff --check
          ! grep -R -n 'Warning: truncated output' README.md docs/DECISIONS.md docs/IMPLEMENTATION-STATUS.md docs/SLICE-5-ARC-HAMMERS-SCOPE.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/TESTING.md
          git config user.name 'Manaconda33'
          git config user.email 'manny.a.martinez33@gmail.com'
          git add README.md docs/DECISIONS.md docs/IMPLEMENTATION-STATUS.md docs/SLICE-5-ARC-HAMMERS-SCOPE.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/TESTING.md
          git commit -m 'Record Arc Hammers live acceptance'
          git push origin HEAD:docs/arc-hammers-live-acceptance
