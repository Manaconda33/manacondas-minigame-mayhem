name: Validate Kinetic Disc checkpoint

on:
  push:
    branches:
      - feature/slice-5-kinetic-disc-guardrails-spinout

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify LFS and diff
        run: |
          git lfs fsck
          git diff --check
      - name: Install from lockfile
        run: npm ci
      - name: Full repository gate
        run: npm run validate
