name: Arc Hammers Publication Closeout

on:
  push:
    branches:
      - docs/arc-hammers-publication-closeout
    paths:
      - .github/workflows/arc-hammers-publication-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/arc-hammers-publication-closeout
          fetch-depth: 0
          lfs: false
      - name: Reconcile publication records
        run: python .github/tmp/arc-hammers-publication-closeout.py
      - name: Commit publication records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/DECISIONS.md docs/IMPLEMENTATION-STATUS.md docs/SLICE-5-ARC-HAMMERS-SCOPE.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/TESTING.md
          git commit -m 'Record Arc Hammers gameplay publication'
          git push origin HEAD:docs/arc-hammers-publication-closeout
