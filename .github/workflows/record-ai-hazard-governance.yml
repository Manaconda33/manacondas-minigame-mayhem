name: Record AI hazard-response governance

on:
  push:
    branches:
      - "docs/slice-5-ai-hazard-response-scope"

permissions:
  contents: write

jobs:
  govern-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          ref: docs/slice-5-ai-hazard-response-scope
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record approved governance
        run: python .github/scripts/govern-ai-hazard.py

      - name: Normalize markdown EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("docs/DECISIONS.md", "docs/TESTING.md"):
              p = Path(name)
              p.write_text(p.read_text().rstrip() + "\n")
          PY

      - name: Install from lockfile
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Verify LFS and diff hygiene
        run: |
          git lfs fsck
          git diff --check

      - name: Commit governance checkpoint
        run: |
          rm .github/workflows/record-ai-hazard-governance.yml
          rm .github/scripts/govern-ai-hazard.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Govern approved AI hazard-response scope"
          git push origin HEAD:docs/slice-5-ai-hazard-response-scope
