name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify Git LFS runtime assets
        run: git lfs fsck

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Restore installed dependencies
        id: validate-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install from lockfile
        if: steps.validate-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Upload production build for Pages assembly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 1

  preview-plan:
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.toolchain.outputs.value }}
    steps:
      - name: Check out current tree for toolchain fingerprint
        uses: actions/checkout@v5

      - name: Fingerprint preview build toolchain
        id: toolchain
        run: |
          value="$(sha256sum package.json package-lock.json vite.config.ts | sha256sum | cut -d' ' -f1)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  preview-build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: preview-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - id: neon-grid
            embed_source: true
            sha: e441ab73ed0a5c3a2d75663de7a89a57606689b8
            base: /manacondas-minigame-mayhem/previews/neon-grid/
            marker_type: feature
            marker_name: 'Neon Grid Circuit 02 main-route blockout'
            status: 'Stage 2 review only; no tokens or shortcuts; production acceptance pending'
          - id: neon-grid-5-3
            embed_source: true
            sha: 9459bf0f64705fb744f7cc1e810be0c0a6f02b3b
            base: /manacondas-minigame-mayhem/previews/neon-grid-5-3/
            marker_type: feature
            marker_name: 'Neon Grid 5.3 constrained climbing triangulation'
            status: '5.3 owner playtest only; no production release or Stage 3'
          - id: neon-grid-tunnel
            embed_source: true
            sha: 92025b5f241cae7ac208c977f74b24396ce6909b
            base: /manacondas-minigame-mayhem/previews/neon-grid-tunnel/
            marker_type: feature
            marker_name: 'Neon Grid Stage 3 Task 5 Service Tunnel'
            status: 'Task 5 owner review only; no production release or further shortcut approval'
          - id: neon-grid-billboard
            embed_source: true
            sha: b942c912510ec86312a9d0cd393d71d2eb478ea8
            base: /manacondas-minigame-mayhem/previews/neon-grid-billboard/
            marker_type: feature
            marker_name: 'Neon Grid Stage 3 Task 6 Billboard entrance/exit aperture visuals'
            status: 'Entrance/exit aperture visual retest; smooth exit and remainder review preserved; owner visual acceptance pending; no production release'
          - id: neon-grid-dive
            embed_source: true
            sha: b49d9876f8c6ce87956f8b91675c3c8180e56b55
            base: /manacondas-minigame-mayhem/previews/neon-grid-dive/
            marker_type: feature
            marker_name: 'Neon Grid Stage 3 Task 7 Waterfall Dive'
            status: 'Task 7 owner dive feel/fairness review; accepted tunnel/billboard and production preserved; no balance or production release'
          - id: neon-grid-far300
            embed_source: true
            sha: 01fb6c26d1b25f536d46323ebfc71fc30239d125
            base: /manacondas-minigame-mayhem/previews/neon-grid-far300/
            marker_type: feature
            marker_name: 'Neon Grid temporary 300m camera far-plane stopgap'
            status: 'Owner visual/playability review only; Task 8 preserved; no production/runtime adoption authority'

    steps:
      - name: Restore immutable preview build
        id: preview-cache
        uses: actions/cache@v4
        with:
          path: preview-output/${{ matrix.id }}
          key: preview-dist-v1-${{ matrix.id }}-${{ matrix.sha }}-${{ needs.preview-plan.outputs.toolchain }}

      - name: Check out pinned preview source
        if: steps.preview-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          path: preview-src
          lfs: true

      - name: Verify pinned preview source
        if: steps.preview-cache.outputs.cache-hit != 'true'
        working-directory: preview-src
        env:
          VITE_SOURCE_COMMIT: ${{ matrix.sha }}
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"

      - name: Set up Node.js
        if: steps.preview-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Restore installed preview dependencies
        if: steps.preview-cache.outputs.cache-hit != 'true'
        id: preview-deps
        uses: actions/cache@v4
        with:
          path: preview-src/node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('preview-src/package-lock.json') }}

      - name: Install preview dependencies
        if: steps.preview-cache.outputs.cache-hit != 'true' && steps.preview-deps.outputs.cache-hit != 'true'
        working-directory: preview-src
        run: npm ci

      - name: Build pinned preview without source marker
        if: steps.preview-cache.outputs.cache-hit != 'true' && matrix.embed_source == false
        working-directory: preview-src
        env:
          PREVIEW_BASE: ${{ matrix.base }}
        run: npm run build -- --base "$PREVIEW_BASE"

      - name: Build pinned preview with source marker
        if: steps.preview-cache.outputs.cache-hit != 'true' && matrix.embed_source == true
        working-directory: preview-src
        env:
          PREVIEW_BASE: ${{ matrix.base }}
          VITE_SOURCE_COMMIT: ${{ matrix.sha }}
        run: npm run build -- --base "$PREVIEW_BASE"

      - name: Write preview review marker
        if: steps.preview-cache.outputs.cache-hit != 'true' && matrix.marker_type != ''
        working-directory: preview-src
        env:
          MARKER_TYPE: ${{ matrix.marker_type }}
          MARKER_NAME: ${{ matrix.marker_name }}
          VITE_SOURCE_COMMIT: ${{ matrix.sha }}
          PREVIEW_BASE: ${{ matrix.base }}
          REVIEW_STATUS: ${{ matrix.status }}
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            [process.env.MARKER_TYPE]: process.env.MARKER_NAME,
            source: process.env.VITE_SOURCE_COMMIT,
            base: process.env.PREVIEW_BASE,
            status: process.env.REVIEW_STATUS
          }, null, 2));
          JS

      - name: Stage immutable preview output
        if: steps.preview-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "preview-output/${{ matrix.id }}"
          cp -a preview-src/dist/. "preview-output/${{ matrix.id }}/"

      - name: Verify preview output contract
        env:
          OUTPUT: preview-output/${{ matrix.id }}
          EXPECTED_SOURCE: ${{ matrix.sha }}
          EXPECTED_BASE: ${{ matrix.base }}
          MARKER_TYPE: ${{ matrix.marker_type }}
        run: |
          test -f "$OUTPUT/index.html"
          if [ -n "$MARKER_TYPE" ]; then
            test -f "$OUTPUT/review-build.json"
            node --input-type=module -e "import { readFileSync } from 'node:fs'; const body = JSON.parse(readFileSync(process.env.OUTPUT + '/review-build.json', 'utf8')); if (body.source !== process.env.EXPECTED_SOURCE) throw new Error('preview source marker mismatch'); if (body.base !== process.env.EXPECTED_BASE) throw new Error('preview base marker mismatch');"
          fi

  pinned-runtime-validation:
    if: github.event_name == 'pull_request'
    needs: preview-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: billboard
            sha: b942c912510ec86312a9d0cd393d71d2eb478ea8
            base: /manacondas-minigame-mayhem/previews/neon-grid-billboard/
          - id: dive
            sha: b49d9876f8c6ce87956f8b91675c3c8180e56b55
            base: /manacondas-minigame-mayhem/previews/neon-grid-dive/
          - id: far300
            sha: 01fb6c26d1b25f536d46323ebfc71fc30239d125
            base: /manacondas-minigame-mayhem/previews/neon-grid-far300/

    steps:
      - name: Restore successful pinned-runtime validation
        id: validation-cache
        uses: actions/cache@v4
        with:
          path: validation-cache/${{ matrix.id }}
          key: pinned-runtime-validation-v1-${{ matrix.id }}-${{ matrix.sha }}-${{ needs.preview-plan.outputs.toolchain }}

      - name: Check out pinned runtime
        if: steps.validation-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          path: runtime-src
          lfs: true

      - name: Set up Node.js
        if: steps.validation-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime-src/package-lock.json

      - name: Restore installed pinned-runtime dependencies
        if: steps.validation-cache.outputs.cache-hit != 'true'
        id: runtime-deps
        uses: actions/cache@v4
        with:
          path: runtime-src/node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('runtime-src/package-lock.json') }}

      - name: Install pinned-runtime dependencies
        if: steps.validation-cache.outputs.cache-hit != 'true' && steps.runtime-deps.outputs.cache-hit != 'true'
        working-directory: runtime-src
        run: npm ci

      - name: Validate exact pinned runtime
        if: steps.validation-cache.outputs.cache-hit != 'true'
        working-directory: runtime-src
        env:
          PIN_ID: ${{ matrix.id }}
          PIN_SHA: ${{ matrix.sha }}
          PREVIEW_BASE: ${{ matrix.base }}
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$PIN_SHA"
          case "$PIN_ID" in
            billboard)
              # Retained native mobile fixture needs the same runner allowance as Dive fbff249.
              npm run typecheck
              npm run lint
              npm run test:ci -- --testTimeout=15000
              npm run build
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            dive)
              npm run validate
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            far300)
              npm run validate
              git diff --check
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            *)
              echo "Unknown pinned runtime: $PIN_ID" >&2
              exit 1
              ;;
          esac
          mkdir -p "../validation-cache/$PIN_ID"
          printf '%s\n' "$PIN_SHA" > "../validation-cache/$PIN_ID/passed"

      - name: Verify pinned-runtime validation marker
        run: test -f "validation-cache/${{ matrix.id }}/passed"

  assemble:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, preview-plan, preview-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Restore Neon Grid preview
        uses: actions/cache/restore@v4
        with:
          path: preview-output/neon-grid
          key: preview-dist-v1-neon-grid-e441ab73ed0a5c3a2d75663de7a89a57606689b8-${{ needs.preview-plan.outputs.toolchain }}
          fail-on-cache-miss: true

      - name: Restore Neon Grid 5.3 preview
        uses: actions/cache/restore@v4
        with:
          path: preview-output/neon-grid-5-3
          key: preview-dist-v1-neon-grid-5-3-9459bf0f64705fb744f7cc1e810be0c0a6f02b3b-${{ needs.preview-plan.outputs.toolchain }}
          fail-on-cache-miss: true

      - name: Restore Neon Service Tunnel preview
        uses: actions/cache/restore@v4
        with:
          path: preview-output/neon-grid-tunnel
          key: preview-dist-v1-neon-grid-tunnel-92025b5f241cae7ac208c977f74b24396ce6909b-${{ needs.preview-plan.outputs.toolchain }}
          fail-on-cache-miss: true

      - name: Restore Billboard preview
        uses: actions/cache/restore@v4
        with:
          path: preview-output/neon-grid-billboard
          key: preview-dist-v1-neon-grid-billboard-b942c912510ec86312a9d0cd393d71d2eb478ea8-${{ needs.preview-plan.outputs.toolchain }}
          fail-on-cache-miss: true

      - name: Restore Dive preview
        uses: actions/cache/restore@v4
        with:
          path: preview-output/neon-grid-dive
          key: preview-dist-v1-neon-grid-dive-b49d9876f8c6ce87956f8b91675c3c8180e56b55-${{ needs.preview-plan.outputs.toolchain }}
          fail-on-cache-miss: true

      - name: Restore Neon Grid 300m stopgap preview
        uses: actions/cache/restore@v4
        with:
          path: preview-output/neon-grid-far300
          key: preview-dist-v1-neon-grid-far300-01fb6c26d1b25f536d46323ebfc71fc30239d125-${{ needs.preview-plan.outputs.toolchain }}
          fail-on-cache-miss: true

      - name: Assemble the current game and isolated previews
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' -print -quit)"
          cp -a dist/. site-root/


          mkdir -p site-root/previews/neon-grid
          cp -a preview-output/neon-grid/. site-root/previews/neon-grid/
          test -f site-root/previews/neon-grid/index.html
          test -f site-root/previews/neon-grid/review-build.json

          mkdir -p site-root/previews/neon-grid-5-3
          cp -a preview-output/neon-grid-5-3/. site-root/previews/neon-grid-5-3/
          test -f site-root/previews/neon-grid-5-3/review-build.json

          mkdir -p site-root/previews/neon-grid-tunnel
          cp -a preview-output/neon-grid-tunnel/. site-root/previews/neon-grid-tunnel/
          test -f site-root/previews/neon-grid-tunnel/index.html
          test -f site-root/previews/neon-grid-tunnel/review-build.json

          mkdir -p site-root/previews/neon-grid-billboard
          cp -a preview-output/neon-grid-billboard/. site-root/previews/neon-grid-billboard/
          test -f site-root/previews/neon-grid-billboard/index.html
          test -f site-root/previews/neon-grid-billboard/review-build.json

          mkdir -p site-root/previews/neon-grid-dive
          cp -a preview-output/neon-grid-dive/. site-root/previews/neon-grid-dive/
          test -f site-root/previews/neon-grid-dive/index.html
          test -f site-root/previews/neon-grid-dive/review-build.json

          mkdir -p site-root/previews/neon-grid-far300
          cp -a preview-output/neon-grid-far300/. site-root/previews/neon-grid-far300/
          test -f site-root/previews/neon-grid-far300/index.html
          test -f site-root/previews/neon-grid-far300/review-build.json

      - name: Record exact delivery hashes and verify production preservation before publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, urllib.request
          root = Path('site-root')
          paths = [root/'index.html', *sorted((root/'assets').glob('*.js')), *sorted((root/'assets').glob('*.css'))]
          preview = root/'previews/neon-grid-5-3'
          paths += [preview/'index.html', preview/'review-build.json', *sorted((preview/'assets').glob('*.js')), *sorted((preview/'assets').glob('*.css'))]
          tunnel = root/'previews/neon-grid-tunnel'
          paths += [tunnel/'index.html', tunnel/'review-build.json', *sorted((tunnel/'assets').glob('*.js')), *sorted((tunnel/'assets').glob('*.css'))]
          billboard = root/'previews/neon-grid-billboard'
          paths += [billboard/'index.html', billboard/'review-build.json', *sorted((billboard/'assets').glob('*.js')), *sorted((billboard/'assets').glob('*.css'))]
          paths += [billboard/'assets/track/neon-grid/billboard'/name for name in ['paprika-v1.webp', 'arin-v1.webp', 'raven-v1.webp']]
          dive = root/'previews/neon-grid-dive'
          paths += [dive/'index.html', dive/'review-build.json', *sorted((dive/'assets').glob('*.js')), *sorted((dive/'assets').glob('*.css'))]
          paths += [dive/'assets/track/neon-grid/billboard'/name for name in ['paprika-v1.webp', 'arin-v1.webp', 'raven-v1.webp']]
          far300 = root/'previews/neon-grid-far300'
          paths += [far300/'index.html', far300/'review-build.json', *sorted((far300/'assets').glob('*.js')), *sorted((far300/'assets').glob('*.css'))]
          report = []
          for path in paths:
              relative = str(path.relative_to(root))
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              url = 'https://manaconda33.github.io/manacondas-minigame-mayhem/' + relative
              if not relative.startswith(('previews/neon-grid-dive/', 'previews/neon-grid-far300/')):
                  with urllib.request.urlopen(url, timeout=45) as response:
                      assert response.status == 200
                      assert hashlib.sha256(response.read()).hexdigest() == sha, 'Production bytes differ: ' + relative
              report.append(dict(path=relative, url=url, sha256=sha, bytes=len(data)))
          Path('delivery-expected.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PYTHON

      - name: Upload delivery hash evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-dive-delivery-hashes
          path: delivery-expected.json

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-root

  spillway-render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact waterfall runtime
        uses: actions/checkout@v5
        with:
          ref: b49d9876f8c6ce87956f8b91675c3c8180e56b55
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Restore installed spillway dependencies
        id: spillway-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install exact runtime dependencies
        if: steps.spillway-deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Render the pinned waterfall spillway and verify draw-call budget
        if: github.event_name == 'pull_request'
        env:
          WATERFALL_PLAYWRIGHT: /tmp/waterfall-webgl
        run: |
          npm install --prefix /tmp/waterfall-webgl --no-package-lock playwright@1.58.2
          export WATERFALL_CHROME="$(command -v google-chrome)"
          npm run dev -- --host 127.0.0.1 > /tmp/waterfall-vite.log 2>&1 &
          spillway_server_pid=$!
          trap 'kill "$spillway_server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/manacondas-minigame-mayhem/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/diagnostics/waterfall-render.mjs /tmp/waterfall-render
          node tools/diagnostics/neon-residual.mjs /tmp/waterfall-render/repair-matrix.json --matrix
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const reports = JSON.parse(readFileSync('/tmp/waterfall-render/repair-matrix.json')).reports;
          if (reports.length !== 18 || reports.some(r => r.summary.airSteps !== 0 || r.summary.maxNativeLoss > 1.83)) throw new Error('Residual repair matrix failed');
          JS

      - name: Upload waterfall rendered evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: waterfall-spillway-render
          path: /tmp/waterfall-render/

  task8-falls-run-render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Task 8 candidate
        uses: actions/checkout@v5
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci
      - name: Render Falls Run and verify Task 8 render-readiness gates
        env:
          FALLS_RUN_PLAYWRIGHT: /tmp/falls-run-webgl
          VITE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          git lfs fsck
          npm install --prefix /tmp/falls-run-webgl --no-package-lock playwright@1.58.2
          export FALLS_RUN_CHROME="$(command -v google-chrome)"
          npm run dev -- --host 127.0.0.1 > /tmp/falls-run-vite.log 2>&1 &
          falls_run_server_pid=$!
          trap 'kill "$falls_run_server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/manacondas-minigame-mayhem/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/diagnostics/falls-run-render.mjs /tmp/falls-run-render
      - name: Upload Task 8 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task8-falls-run-render
          path: /tmp/falls-run-render/


  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Download exact delivery hashes
        uses: actions/download-artifact@v4
        with:
          name: neon-grid-dive-delivery-hashes

      - name: Verify live preview and unchanged production bytes
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, time, urllib.request
          report = json.load(open('delivery-expected.json'))
          for attempt in range(12):
              try:
                  for item in report:
                      request = urllib.request.Request(item['url'] + '?delivery=dive-b49d9876f8c6ce87956f8b91675c3c8180e56b55', headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                          assert response.status == 200
                          assert len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
                          if item['path'].endswith('review-build.json'):
                              expected_source = '01fb6c26d1b25f536d46323ebfc71fc30239d125' if item['path'].startswith('previews/neon-grid-far300/') else 'b49d9876f8c6ce87956f8b91675c3c8180e56b55' if item['path'].startswith('previews/neon-grid-dive/') else 'b942c912510ec86312a9d0cd393d71d2eb478ea8' if item['path'].startswith('previews/neon-grid-billboard/') else '92025b5f241cae7ac208c977f74b24396ce6909b' if item['path'].startswith('previews/neon-grid-tunnel/') else '9459bf0f64705fb744f7cc1e810be0c0a6f02b3b'
                              assert json.loads(data)['source'] == expected_source
                          item['httpStatus'] = response.status
                  break
              except Exception as error:
                  print('Delivery attempt', attempt + 1, str(error), flush=True)
                  if attempt == 11:
                      raise
                  time.sleep(10)
          print(json.dumps(report, indent=2))
          open('delivery-verified.json', 'w').write(json.dumps(report, indent=2))
          PYTHON

      - name: Upload verified delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-dive-delivery-verified
          path: delivery-verified.json
