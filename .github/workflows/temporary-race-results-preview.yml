name: Temporary Race Results preview

on:
  push:
    branches:
      - feature/slice6-race-hud-minimap-results-podium

permissions:
  contents: read

concurrency:
  group: temporary-race-results-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the current main checkpoint
        uses: actions/checkout@v4
        with:
          ref: 7e8a9ea8901bef6ea4dd785780c4cc8295225ead
          path: main-checkpoint
          lfs: true

      - name: Guard against replacing a newer main checkpoint
        working-directory: main-checkpoint
        run: |
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "7e8a9ea8901bef6ea4dd785780c4cc8295225ead"

      - name: Check out the feature revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: feature-checkpoint
          lfs: true

      - name: Verify materialized assets
        run: |
          git -C main-checkpoint lfs fsck
          git -C feature-checkpoint lfs fsck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build current main at the usual URL
        working-directory: main-checkpoint
        run: |
          npm ci
          npm run build

      - name: Build the feature at its isolated preview URL
        working-directory: feature-checkpoint
        run: |
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/race-hud-results/

      - name: Assemble main and feature without changing the main route
        run: |
          mkdir -p site-root/previews/race-hud-results
          cp -a main-checkpoint/dist/. site-root/
          cp -a feature-checkpoint/dist/. site-root/previews/race-hud-results/
          test -f site-root/index.html
          test -f site-root/previews/race-hud-results/index.html

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://manaconda33.github.io/manacondas-minigame-mayhem/previews/race-hud-results/
    steps:
      - name: Publish temporary branch preview beside main
        uses: actions/deploy-pages@v4
