name: Clean Nitro tuning design diff

on:
  push:
    branches: [feature/slice-5-nitro-surge-tuning]
    paths:
      - .github/workflows/clean-nitro-design-diff.yml

permissions:
  contents: write

jobs:
  clean-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: feature/slice-5-nitro-surge-tuning
          fetch-depth: 4

      - name: Restore design formatting and keep only approved edits
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "d732c989f87e2e76688590214c666843b58bad4b"
          git show origin/main:docs/SLICE-5-ITEM-SYSTEM-DESIGN.md > /tmp/design.md
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/design.md')
          text = p.read_text()
          replacements = [
              (
                  "- Nitro Surge speed-cap target: approximately 1.18x normal cap for the PRD's approximately 1.2-second effect.",
                  '- Nitro Surge target: approximately 2.4-second effect, 1.18x normal speed cap, and 1.50x acceleration authority under PRD amendment 2.3.',
              ),
              (
                  '- [ ] Nitro Surge applies its approximately 1.2-second boost and off-road override.',
                  '- [ ] Nitro Surge applies its approximately 2.4-second boost, 1.50x acceleration authority, 1.18x speed cap, and off-road override.',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'design anchor mismatch: {old}')
              text = text.replace(old, new, 1)
          Path('docs/SLICE-5-ITEM-SYSTEM-DESIGN.md').write_text(text)
          PY
          git diff --check

      - name: Revalidate clean diff
        run: |
          npm ci
          npm run validate

      - name: Record final tuning validation
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('docs/IMPLEMENTATION-STATUS.md')
          text = p.read_text()
          old = 'Tuning validation run **34028687379** passed the full repository gate before publication review.'
          new = old + f" Clean-diff validation run **{os.environ['GITHUB_RUN_ID']}** repeated the full repository gate after removing unrelated markdown formatting churn."
          if text.count(old) != 1:
              raise SystemExit('status tuning validation anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit clean checkpoint
        run: |
          rm -f .github/workflows/clean-nitro-design-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Keep Nitro tuning diff bounded"
          git push origin HEAD:feature/slice-5-nitro-surge-tuning
