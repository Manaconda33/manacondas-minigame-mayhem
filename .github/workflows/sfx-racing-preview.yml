name: SFX racing review preview

on:
  push:
    branches: [review/slice6-sfx-integration]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sfx-racing-review-pages
  cancel-in-progress: true

env:
  PRODUCTION_COMMIT: f4fc103c24e346252f93407637278cccdbd81eb8

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Guard the approved production baseline
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PRODUCTION_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and build the audio review
        run: |
          git lfs fsck
          npm ci
          npm run validate
          npm run build -- --base /manacondas-minigame-mayhem/previews/sfx-racing/
      - name: Check out unchanged production
        uses: actions/checkout@v4
        with:
          ref: f4fc103c24e346252f93407637278cccdbd81eb8
          path: production
          lfs: true
      - name: Build unchanged production
        working-directory: production
        run: |
          git lfs fsck
          npm ci
          npm run build
      - name: Check out existing Results preview
        uses: actions/checkout@v4
        with:
          ref: 9aceba5de4c5d184772d3467f47463b26a633df0
          path: results-preview
          lfs: true
      - name: Build existing Results preview
        working-directory: results-preview
        run: |
          git lfs fsck
          npm ci
          npm run build -- --base /manacondas-minigame-mayhem/previews/race-hud-results/
      - name: Assemble review subtree alongside unchanged production
        run: |
          mkdir -p site-root/previews/sfx-racing site-root/previews/race-hud-results
          cp -a production/dist/. site-root/
          cp -a results-preview/dist/. site-root/previews/race-hud-results/
          cp -a dist/. site-root/previews/sfx-racing/
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("site-root/previews/sfx-racing/review-build.json", JSON.stringify({reviewCommit:process.env.GITHUB_SHA,productionCommit:process.env.PRODUCTION_COMMIT,resultsPreviewCommit:"9aceba5de4c5d184772d3467f47463b26a633df0"})+"\n")'
          test -f site-root/index.html
          test -f site-root/previews/sfx-racing/index.html
          diff -q production/dist/index.html site-root/index.html
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PRODUCTION_COMMIT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-root
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard main immediately before deployment
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PRODUCTION_COMMIT"
      - name: Publish the isolated listening preview
        id: deployment
        uses: actions/deploy-pages@v4
