name: Record Blast Orb live acceptance

on:
  push:
    branches:
      - docs/blast-orb-live-acceptance
    paths:
      - .github/workflows/record-blast-orb-acceptance.yml

permissions:
  contents: write

jobs:
  record-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4
        with:
          ref: docs/blast-orb-live-acceptance
          fetch-depth: 1
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record acceptance
        run: python .github/scripts/record_blast_acceptance.py
      - name: Check diff
        run: git diff --check
      - name: Install from lockfile
        run: npm ci
      - name: Validate repository
        run: npm run validate
      - name: Verify LFS runtime assets
        run: git lfs fsck
      - name: Commit acceptance record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record Timed Blast Orb live acceptance"
          git push origin HEAD:docs/blast-orb-live-acceptance
