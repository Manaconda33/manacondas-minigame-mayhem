name: Record Slice 5 HUD live acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/record-slice5-hud-live-acceptance.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record accepted checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/IMPLEMENTATION-STATUS.md')
          text = path.read_text()

          old_title = '**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - ROULETTE / HELD-ITEM HUD / DESKTOP-MOBILE ITEM INPUT IMPLEMENTED ON FEATURE BRANCH / MANNY REVIEW PENDING**'
          new_title = '**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - ROULETTE / HELD-ITEM HUD / DESKTOP-MOBILE ITEM INPUT LIVE ACCEPTED / NEXT ITEM-EFFECT INCREMENT AWAITING MANNY APPROVAL**'
          if text.count(old_title) != 1:
              raise SystemExit(f'Expected one old Slice 5 title, found {text.count(old_title)}')
          text = text.replace(old_title, new_title, 1)

          old_paragraph = "Manny approved the next bounded increment on 2026-09-05. Branch `feature/slice-5-item-hud-input`, verified at `3aa22859c60d6f1f829ca586ccd5c7ad161ab8ea` before documentation synchronization, implements only roulette presentation, the held-item HUD, and desktop/mobile ITEM input. It does **not** implement item effects, projectile/hazard systems, Rocket autopilot, counters, or AI tactical item use.\n\n**Approval gate:** this feature branch must be reviewed through its pull request and final PR CI before merge. Do not merge or begin item-effect implementation without Manny approval. After an approved merge/deployment, perform live desktop/mobile acceptance of roulette timing, HUD readability, charge display, and forward/backward input registration before the next Slice 5 increment."
          new_paragraph = "Manny approved PR #99 on 2026-09-05. The bounded roulette / held-item HUD / desktop-mobile ITEM input checkpoint squash-merged to `main` at `574d979f1ad59ebdce386525fdb483f821254457`. Post-merge CI / Pages run `34011338953` passed LFS verification, dependency installation, typecheck, zero-warning lint, all tests, production build, Pages artifact upload, and deployment. Pages artifact `9982552507` has digest `sha256:945f3588b045b1a8b0a0a10fe41d356ba8812a0b945593ae714f148f3279d1c9`.\n\nManny then completed the deployed desktop/mobile acceptance matrix and reported **all eight checks passed**: roulette timing, pause freeze, held-item HUD readability, multi-charge display, desktop forward input, desktop backward input, mobile ITEM layout/direction, and the one-slot no-consumption contract. This checkpoint is therefore **LIVE ACCEPTED**.\n\n**Approval gate:** do not begin actual item-effect implementation until Manny approves the next bounded Slice 5 increment. Item effects, projectiles/hazards, counters, Hyper-Drive Rocket autopilot, and AI tactical item use remain incomplete. Slice 6 remains locked."
          if text.count(old_paragraph) != 1:
              raise SystemExit(f'Expected one prior checkpoint paragraph, found {text.count(old_paragraph)}')
          text = text.replace(old_paragraph, new_paragraph, 1)

          marker = 'The known large `KartTimeTrial` production chunk warning remains non-blocking at approximately 3.52 MB minified / 1.27 MB gzip and is not introduced as a Slice 5 functional defect.\n\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one chunk-warning marker, found {text.count(marker)}')
          acceptance = '''### Product-owner live acceptance — PASSED\n\nDeployed checkpoint: `574d979f1ad59ebdce386525fdb483f821254457`\n\n- roulette starts on pickup and resolves at approximately 0.85 seconds — PASS\n- pausing during roulette freezes roulette progression until resume — PASS\n- held-item glyph/name presentation is readable — PASS\n- governed multi-charge counts display correctly — PASS\n- Left Shift and E register forward desktop ITEM intent — PASS\n- S / Down + ITEM registers backward desktop intent — PASS\n- mobile ITEM control layout and forward/backward direction input — PASS\n- held items remain unconsumed and continue blocking a second pickup before effects exist — PASS\n\nNo defect was reported in this checkpoint. The deliberate no-fire/no-consumption behavior remains correct until the actual effect dispatcher is implemented.\n\n'''
          text = text.replace(marker, marker + acceptance, 1)

          path.write_text(text)
          PY
      - name: Verify documentation patch
        run: git diff --check
      - name: Commit acceptance record and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/record-slice5-hud-live-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION-STATUS.md .github/workflows/record-slice5-hud-live-acceptance.yml
          git commit -m "Record Slice 5 HUD input live acceptance"
          git push origin HEAD:main
