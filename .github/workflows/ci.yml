name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    needs: preview-plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          lfs: false

      - name: Require successful preview plan
        if: always()
        env:
          PREVIEW_PLAN_RESULT: ${{ needs.preview-plan.result }}
        run: node tools/ci/require-successful-preview-plan.mjs

      - name: Verify Git LFS runtime assets
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        run: git lfs pull && git lfs fsck

      - name: Report docs-only fast path
        if: github.event_name == 'pull_request' && needs.preview-plan.result == 'success' && needs.preview-plan.outputs.docs_only == 'true'
        env:
          CHANGE_REASON: ${{ needs.preview-plan.outputs.docs_reason }}
          CHANGE_COUNT: ${{ needs.preview-plan.outputs.changed_count }}
        run: |
          {
            echo '### Documentation-only fast path: PASS'
            echo
            echo "Classified $CHANGE_COUNT changed file record(s): $CHANGE_REASON."
            echo 'Ran `git diff --check` on the allowlisted documentation paths.'
            echo 'Intentionally not run: Git LFS verification, typecheck, lint, application tests, production build, pinned-runtime validation, spillway render, and immutable preview builds.'
            echo 'This result does not claim that the runtime suite was executed. Any uncertain or non-allowlisted change uses full validation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Restore installed dependencies
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        id: validate-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install from lockfile
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true') && steps.validate-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Typecheck
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        run: npm run typecheck

      - name: Lint
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        run: npm run lint

      - name: Test
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        run: npm run test:ci

      - name: Production build
        if: needs.preview-plan.result == 'success' && (github.event_name != 'pull_request' || needs.preview-plan.outputs.docs_only != 'true')
        run: npm run build

      - name: Upload production build for Pages assembly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 1

  preview-plan:
    runs-on: ubuntu-latest
    outputs:
      toolchain: ${{ steps.toolchain.outputs.value }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
      validation_contract: ${{ steps.validation-contract.outputs.contract_sha256 }}
      validation_workflow_blob: ${{ steps.validation-contract.outputs.workflow_blob }}
      validation_lock_sha256: ${{ steps.validation-contract.outputs.lock_sha256 }}
    steps:
      - name: Check out current tree for toolchain fingerprint
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check out trusted target-branch CI helpers
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-ci
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js for CI planning scripts
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Classify pull-request changes conservatively
        id: classify
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f trusted-ci/tools/ci/pr-change-classifier.mjs ]; then
            node trusted-ci/tools/ci/pr-change-classifier.mjs
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'reason=trusted classifier is not present on the target branch' >> "$GITHUB_OUTPUT"
            echo 'changed_count=0' >> "$GITHUB_OUTPUT"
            echo 'No trusted target-branch classifier is available; full validation required.'
          fi

      - name: Check documentation-only diff
        if: github.event_name == 'pull_request' && steps.classify.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" -- README.md docs/design/ docs/superpowers/plans/

      - name: Fingerprint validation contract
        id: validation-contract
        run: |
          if [ -f trusted-ci/tools/ci/validation-input-fingerprint.mjs ]; then
            node trusted-ci/tools/ci/validation-input-fingerprint.mjs
          else
            node tools/ci/validation-input-fingerprint.mjs
          fi

      - name: Fingerprint preview build toolchain
        id: toolchain
        run: |
          value="$(sha256sum package.json package-lock.json vite.config.ts | sha256sum | cut -d' ' -f1)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  preview-build:
    name: preview-build (${{ matrix.id }})
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: preview-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - id: neon-grid
            embed_source: true
            sha: e441ab73ed0a5c3a2d75663de7a89a57606689b8
