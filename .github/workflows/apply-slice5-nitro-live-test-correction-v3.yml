name: Apply Slice 5 Nitro live-test correction v3

on:
  push:
    branches: [feature/slice-5-nitro-live-test-harness-vfx]
    paths:
      - .github/workflows/apply-slice5-nitro-live-test-correction-v3.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: feature/slice-5-nitro-live-test-harness-vfx
          fetch-depth: 4

      - name: Guard current main
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "5f41f8fe68e361e451d12c195d2842f05de56ebf"
          git lfs fsck

      - name: Apply approved source and test correction
        run: |
          cat > src/game/items/ItemTestMode.ts <<'EOF'
          import { ITEM_IDS, type ItemId } from './itemDefinitions';

          const ITEM_ID_SET = new Set<string>(ITEM_IDS);

          export function forcedItemFromSearch(search: string): ItemId | null {
            const value = new URLSearchParams(search).get('testItem');
            return value !== null && ITEM_ID_SET.has(value) ? (value as ItemId) : null;
          }

          export function forcedItemForRacer(forcedItem: ItemId | null, racerId: string): ItemId | null {
            return racerId === 'player' ? forcedItem : null;
          }
          EOF

          cat > src/game/items/NitroSurgeVisual.ts <<'EOF'
          import * as THREE from 'three';

          function additiveMaterial(color: number, opacity: number): THREE.MeshBasicMaterial {
            return new THREE.MeshBasicMaterial({
              color,
              transparent: true,
              opacity,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              toneMapped: false,
            });
          }

          export class NitroSurgeVisual {
            public readonly group = new THREE.Group();
            private readonly flames: THREE.Mesh[] = [];
            private readonly geometries: THREE.BufferGeometry[] = [];
            private readonly materials: THREE.Material[] = [];
            private readonly wakeRing: THREE.Mesh;

            public constructor() {
              this.group.name = 'NitroSurgeVisual';
              this.group.visible = false;
              for (const x of [-0.48, 0.48]) {
                const outerGeometry = new THREE.ConeGeometry(0.2, 1.05, 10);
                const outerMaterial = additiveMaterial(0x43d9ff, 0.82);
                const outer = new THREE.Mesh(outerGeometry, outerMaterial);
                outer.rotation.x = -Math.PI / 2;
                outer.position.set(x, 0.08, -1.52);

                const coreGeometry = new THREE.ConeGeometry(0.095, 0.72, 8);
                const coreMaterial = additiveMaterial(0xfff2a8, 0.95);
                const core = new THREE.Mesh(coreGeometry, coreMaterial);
                core.rotation.x = -Math.PI / 2;
                core.position.set(x, 0.08, -1.43);

                this.geometries.push(outerGeometry, coreGeometry);
                this.materials.push(outerMaterial, coreMaterial);
                this.flames.push(outer, core);
                this.group.add(outer, core);
              }

              const ringGeometry = new THREE.TorusGeometry(0.82, 0.045, 6, 28);
              const ringMaterial = additiveMaterial(0x79ebff, 0.68);
              this.wakeRing = new THREE.Mesh(ringGeometry, ringMaterial);
              this.wakeRing.position.set(0, 0.12, -1.98);
              this.geometries.push(ringGeometry);
              this.materials.push(ringMaterial);
              this.group.add(this.wakeRing);

              const glow = new THREE.PointLight(0x4fdcff, 2.2, 5.2, 2);
              glow.position.set(0, 0.22, -1.15);
              this.group.add(glow);
            }

            public update(active: boolean, elapsedSeconds: number): void {
              this.group.visible = active;
              if (!active) return;
              const flamePulse = 0.92 + Math.sin(elapsedSeconds * 34) * 0.12;
              for (const flame of this.flames) flame.scale.y = flamePulse;
              const ringPulse = 0.94 + Math.sin(elapsedSeconds * 22) * 0.08;
              this.wakeRing.scale.setScalar(ringPulse);
              this.wakeRing.rotation.z = elapsedSeconds * 2.8;
            }

            public dispose(): void {
              for (const geometry of this.geometries) geometry.dispose();
              for (const material of this.materials) material.dispose();
              this.group.clear();
              this.group.visible = false;
            }
          }
          EOF

          cat > tests/item-test-mode.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { ITEM_IDS } from '../src/game/items/itemDefinitions';
          import { forcedItemForRacer, forcedItemFromSearch } from '../src/game/items/ItemTestMode';

          describe('Slice 5 live item-test mode', () => {
            it('accepts every governed item id', () => {
              for (const itemId of ITEM_IDS) {
                expect(forcedItemFromSearch(`?testItem=${itemId}`)).toBe(itemId);
              }
            });
            it('ignores missing or invalid overrides', () => {
              expect(forcedItemFromSearch('')).toBeNull();
              expect(forcedItemFromSearch('?foo=nitro-surge')).toBeNull();
              expect(forcedItemFromSearch('?testItem=not-a-real-item')).toBeNull();
            });
            it('forces only the player inventory', () => {
              expect(forcedItemForRacer('nitro-surge', 'player')).toBe('nitro-surge');
              expect(forcedItemForRacer('nitro-surge', 'ai-1')).toBeNull();
              expect(forcedItemForRacer(null, 'player')).toBeNull();
            });
          });
          EOF

          cat > tests/nitro-surge-visual.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { NitroSurgeVisual } from '../src/game/items/NitroSurgeVisual';

          describe('NitroSurgeVisual', () => {
            it('tracks the active effect, animates, and cleans up', () => {
              const visual = new NitroSurgeVisual();
              expect(visual.group.visible).toBe(false);
              visual.update(true, 0.1);
              expect(visual.group.visible).toBe(true);
              const firstScale = visual.group.children[0]?.scale.y;
              visual.update(true, 0.15);
              expect(visual.group.children[0]?.scale.y).not.toBe(firstScale);
              visual.update(false, 0.2);
              expect(visual.group.visible).toBe(false);
              expect(visual.group.children.length).toBeGreaterThanOrEqual(6);
              visual.dispose();
              expect(visual.group.children).toHaveLength(0);
            });
          });
          EOF

          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path); text = p.read_text(); count = text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1))

          k = 'src/game/KartTimeTrial.ts'
          one(k, "import { selectItem } from './items/ItemSelector';\nimport { RacerEffects } from './items/RacerEffects';", "import { selectItem } from './items/ItemSelector';\nimport { forcedItemForRacer, forcedItemFromSearch } from './items/ItemTestMode';\nimport { NitroSurgeVisual } from './items/NitroSurgeVisual';\nimport { RacerEffects } from './items/RacerEffects';")
          one(k, "import type { RaceRank } from './items/itemDefinitions';", "import { ITEM_DEFINITIONS, type RaceRank } from './items/itemDefinitions';")
          one(k, "  item: ItemHudSnapshot;\n}", "  item: ItemHudSnapshot;\n  testModeItemLabel: string | null;\n}")
          one(k, "  private readonly itemSystem = new ItemSystem();\n  private readonly racerEffects = new RacerEffects();\n  private lastApexSelectionTime = Number.NEGATIVE_INFINITY;", "  private readonly itemSystem = new ItemSystem();\n  private readonly racerEffects = new RacerEffects();\n  private readonly forcedTestItem = forcedItemFromSearch(window.location.search);\n  private readonly nitroSurgeVisual = new NitroSurgeVisual();\n  private lastApexSelectionTime = Number.NEGATIVE_INFINITY;")
          one(k, "    this.itemBoxes = new ItemBoxSystem(this.track);\n    this.scene.add(this.itemBoxes.group);", "    this.itemBoxes = new ItemBoxSystem(this.track);\n    this.scene.add(this.itemBoxes.group);\n    this.kartMesh.add(this.nitroSurgeVisual.group);")
          one(k, "    this.itemSystem.dispose();\n    this.racerEffects.dispose();\n    this.renderer.dispose();", "    this.itemSystem.dispose();\n    this.racerEffects.dispose();\n    this.nitroSurgeVisual.dispose();\n    this.renderer.dispose();")
          one(k, "      const apexAvailable = this.elapsed - this.lastApexSelectionTime >= 18;\n      const itemId = selectItem({ rank, distanceBehindLeaderMeters, apexAvailable });\n      if (!this.itemSystem.acquire(racerId, itemId)) return false;\n      if (itemId === 'apex-missile') this.lastApexSelectionTime = this.elapsed;", "      const forcedItem = forcedItemForRacer(this.forcedTestItem, racerId);\n      const apexAvailable = this.elapsed - this.lastApexSelectionTime >= 18;\n      const itemId = forcedItem ?? selectItem({ rank, distanceBehindLeaderMeters, apexAvailable });\n      if (!this.itemSystem.acquire(racerId, itemId)) return false;\n      if (forcedItem === null && itemId === 'apex-missile') this.lastApexSelectionTime = this.elapsed;")
          one(k, "    this.lastToneTier = feedback.driftTier;\n    this.updatePlayerDriverSprite();", "    this.lastToneTier = feedback.driftTier;\n    this.nitroSurgeVisual.update(this.racerEffects.remainingSeconds('player', 'nitro-surge') > 0, this.elapsed);\n    this.updatePlayerDriverSprite();")
          one(k, "      item: this.itemSystem.hudSnapshot('player'),\n      minimap: {", "      item: this.itemSystem.hudSnapshot('player'),\n      testModeItemLabel: this.forcedTestItem === null ? null : ITEM_DEFINITIONS[this.forcedTestItem].displayName,\n      minimap: {")

          m = 'src/app/mountAppShell.ts'
          one(m, "        <div id=\"countdown\" class=\"countdown\">3</div>\n        <div id=\"loading\"", "        <div id=\"countdown\" class=\"countdown\">3</div>\n        <div id=\"item-test-mode\" class=\"item-test-mode\" hidden></div>\n        <div id=\"loading\"")
          one(m, "      updateRaceMinimap(minimap, state.minimap);\n      updateItemHud(itemHud, state.item);\n      const driftPanel", "      updateRaceMinimap(minimap, state.minimap);\n      updateItemHud(itemHud, state.item);\n      const testMode = getElement('#item-test-mode');\n      testMode.hidden = state.testModeItemLabel === null;\n      testMode.textContent = state.testModeItemLabel === null ? '' : `TEST MODE · FORCED ${state.testModeItemLabel.toUpperCase()}`;\n      const driftPanel")

          s = 'src/style.css'
          one(s, ".game-help {\n  position: absolute;", ".item-test-mode {\n  position: absolute;\n  top: 9.4rem;\n  right: 1rem;\n  z-index: 5;\n  max-width: 13rem;\n  padding: 0.45rem 0.6rem;\n  border: 1px solid rgb(121 235 255 / 55%);\n  border-radius: 0.55rem;\n  color: #dffaff;\n  background: rgb(5 25 34 / 82%);\n  box-shadow: 0 0 1.25rem rgb(67 217 255 / 22%);\n  font-size: 0.58rem;\n  font-weight: 900;\n  letter-spacing: 0.08em;\n  line-height: 1.35;\n  text-align: right;\n  text-transform: uppercase;\n  pointer-events: none;\n}\n.game-help {\n  position: absolute;")
          one(s, ".game-shell.is-finished .drift-panel,\n.game-shell.is-finished .game-help,", ".game-shell.is-finished .drift-panel,\n.game-shell.is-finished .item-test-mode,\n.game-shell.is-finished .game-help,")

          r = 'README.md'
          one(r, "Slice 3 Character Selection & Avatar Ingestion is complete and live accepted. The competitive Grand Prix systems defined for Slice 4 were completed earlier because of a documented sequencing error and remain retained. Slice 5 foundation, visible item boxes, roulette, held-item HUD, and desktop/mobile ITEM input are merged, deployed, and product-owner accepted. The current approval-gated feature branch adds the first real item-effect checkpoint: a generic RacerEffects temporary-boost boundary plus Nitro Surge activation, governed 1.18x speed cap, strong acceleration, off-road speed-penalty override, pause-safe expiry, successful charge consumption, and inventory-slot release. All other item effects, projectiles, hazards, Rocket autopilot, and AI tactical item use remain later Slice 5 work.", "Slice 3 Character Selection & Avatar Ingestion is complete and live accepted. The competitive Grand Prix systems defined for Slice 4 were completed earlier because of a documented sequencing error and remain retained. Slice 5 foundation, visible item boxes, roulette, held-item HUD, desktop/mobile ITEM input, and RacerEffects + Nitro Surge are merged and deployed. Nitro Surge live acceptance is paused for a small approval-gated correction adding a reusable player-only `testItem=<item-id>` acceptance harness and an in-world procedural Nitro activation tell. All other item effects, projectiles, hazards, Rocket autopilot, and AI tactical item use remain later Slice 5 work.")

          st = 'docs/IMPLEMENTATION-STATUS.md'
          one(st, "**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - RACER EFFECTS FOUNDATION + NITRO SURGE IMPLEMENTED ON FEATURE BRANCH / MANNY REVIEW PENDING**", "**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - NITRO SURGE MERGED / FORCED-ITEM LIVE HARNESS + NITRO VFX CORRECTION IN REVIEW**")
          text = Path(st).read_text()
          anchor = "Validation run **34012300286** passed Git LFS verification, `npm ci`, strict typecheck, zero-warning lint, **23 Vitest files / 127 tests**, **90.43% overall statement coverage**, **93.26% `game/items` statement coverage**, 100% coverage for `RacerEffects.ts`, existing three-lap AI integration, the ten-minute numeric soak, branding/runtime-asset checks, `git diff --check`, and the production Vite build. Earlier guarded validation runs exposed only synthetic controller-test ground-boundary mistakes; those fixtures were corrected without weakening any product assertion or quality gate.\n"
          insert = anchor + "\nManny approved PR #100, which squash-merged to `main` at **`5f41f8fe68e361e451d12c195d2842f05de56ebf`**. Post-merge CI / Pages run **34012662528** passed validation and deployment. Pages artifact **9982946836** has digest `sha256:b46ea5e917f8488e799fee67945f737e98e4a4b10d6915353b2a13fd7908115c`. Before live acceptance, Manny approved a corrective checkpoint adding a reusable player-only forced-item URL harness and a visible Nitro Surge activation tell.\n"
          if text.count(anchor) != 1: raise SystemExit('status evidence anchor mismatch')
          text = text.replace(anchor, insert, 1)
          old_gate = "**Approval gate:** this RacerEffects + Nitro Surge feature must be reviewed through its pull request and authoritative PR CI before merge. Do not merge, deploy, or begin another item effect without Manny approval. Projectiles/hazards, hostile racer effects, Nitro Overdrive, Hyper-Drive Rocket autopilot, Prismatic Invincibility, and AI tactical item use remain incomplete. Slice 6 remains locked."
          new_gate = "**Approval gate:** validate and review the player-only forced-item harness + Nitro VFX correction before merge. After approved deployment, rerun Nitro Surge desktop/mobile acceptance using the deterministic test URL. Do not begin another item effect until Nitro Surge is live accepted and recorded. Slice 6 remains locked."
          if text.count(old_gate) != 1: raise SystemExit('status gate mismatch')
          text = text.replace(old_gate, new_gate, 1)
          text = text.replace("Remaining approval work for this checkpoint is PR review/CI, approved merge/Pages deployment, then deployed desktop/mobile product-owner acceptance.", "PR #100 is merged and deployed. Remaining approval work is the corrective forced-item/VFX PR, its deployment, then Nitro Surge desktop/mobile product-owner acceptance.", 1)
          Path(st).write_text(text)

          t = Path('docs/TESTING.md').read_text()
          t = t.replace("- Nitro Surge tuning remains configuration data at approximately 1.2 seconds and 1.18x normal speed cap;", "- the player-only `testItem=<item-id>` acceptance override accepts only the fifteen governed IDs, ignores invalid/missing values, and never forces AI inventories;\n- normal URLs without `testItem` continue through the governed position/gap selector unchanged;\n- the Nitro Surge procedural rear exhaust/energy visual is hidden outside the effect, visible while the `nitro-surge` RacerEffects state is active, and releases its Three.js resources on disposal;\n- Nitro Surge tuning remains configuration data at approximately 1.2 seconds and 1.18x normal speed cap;", 1)
          t = t.replace("1. Collect boxes until Nitro Surge is selected; confirm the existing approximately 0.85-second roulette behavior is unchanged.", "Use `https://manaconda33.github.io/manacondas-minigame-mayhem/?testItem=nitro-surge` for the Nitro acceptance pass. The test-mode badge must identify Nitro Surge, every player pickup must resolve to Nitro Surge, and AI pickups remain normal. Load the normal URL once to confirm production selection is not forced.\n\n1. Collect a player box in forced Nitro test mode; confirm roulette remains approximately 0.85 seconds and resolves to Nitro Surge every time.", 1)
          t = t.replace("4. Confirm the race status reports `NITRO SURGE ACTIVE` during the effect.", "4. Confirm the race status reports `NITRO SURGE ACTIVE` and the kart shows a clear rear exhaust/energy Nitro tell for the same active interval.", 1)
          Path('docs/TESTING.md').write_text(t)
          PY

      - name: Install, format changed files, and validate
        run: |
          npm ci
          npx prettier --write README.md docs/IMPLEMENTATION-STATUS.md docs/TESTING.md src/app/mountAppShell.ts src/style.css src/game/KartTimeTrial.ts src/game/items/ItemTestMode.ts src/game/items/NitroSurgeVisual.ts tests/item-test-mode.test.ts tests/nitro-surge-visual.test.ts
          git diff --check
          npm run validate

      - name: Record validation evidence
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('docs/IMPLEMENTATION-STATUS.md')
          text = p.read_text()
          anchor = "Before live acceptance, Manny approved a corrective checkpoint adding a reusable player-only forced-item URL harness and a visible Nitro Surge activation tell."
          evidence = anchor + f" Correction validation run **{os.environ['GITHUB_RUN_ID']}** passed the full repository gate with 25 Vitest files / 131 tests, including all fifteen forced-item IDs, player-only isolation, Nitro VFX lifecycle, existing AI integration, runtime-asset verification, and the production build."
          if text.count(anchor) != 1: raise SystemExit('validation evidence anchor mismatch')
          p.write_text(text.replace(anchor, evidence, 1))
          PY
          npx prettier --write docs/IMPLEMENTATION-STATUS.md
          git diff --check

      - name: Commit clean checkpoint
        run: |
          rm -f .github/workflows/apply-slice5-nitro-live-test-correction.yml
          rm -f .github/workflows/apply-slice5-nitro-live-test-correction-v2.yml
          rm -f .github/workflows/apply-slice5-nitro-live-test-correction-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Add deterministic item test mode and Nitro VFX"
          git push origin HEAD:feature/slice-5-nitro-live-test-harness-vfx
