    steps:
      - name: Report documentation-only preview-build skip
        if: github.event_name == 'pull_request' && needs.preview-plan.result == 'success' && needs.preview-plan.outputs.docs_only == 'true'
        env:
          PREVIEW_ID: ${{ matrix.id }}
        run: echo "Immutable preview $PREVIEW_ID was intentionally not rebuilt because this pull request changes only allowlisted documentation." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore immutable preview build
        id: preview-cache
        if: github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: preview-output/${{ matrix.id }}
          key: preview-dist-v1-${{ matrix.id }}-${{ matrix.sha }}-${{ needs.preview-plan.outputs.toolchain }}

      - name: Check out pinned preview source
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          path: preview-src
          lfs: true

      - name: Verify pinned preview source
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true'
        working-directory: preview-src
        env:
          VITE_SOURCE_COMMIT: ${{ matrix.sha }}
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$VITE_SOURCE_COMMIT"

      - name: Set up Node.js
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Restore installed preview dependencies
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true'
        id: preview-deps
        uses: actions/cache@v4
        with:
          path: preview-src/node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('preview-src/package-lock.json') }}

      - name: Install preview dependencies
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true' && steps.preview-deps.outputs.cache-hit != 'true'
        working-directory: preview-src
        run: npm ci

      - name: Validate exact pinned Task A review runtime
        if: matrix.id == 'neon-grid-task-a-001' && (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true'
        working-directory: preview-src
        run: |
          npm run lint
          npm run test:ci -- --maxWorkers=1 --testTimeout=15000
          node tools/verify-task9-skyline-assets.mjs
          node tools/verify-task9-undercity-assets.mjs

      - name: Build pinned preview without source marker
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true' && matrix.embed_source == false
        working-directory: preview-src
        env:
          PREVIEW_BASE: ${{ matrix.base }}
        run: npm run build -- --base "$PREVIEW_BASE"

      - name: Build pinned preview with source marker
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true' && matrix.embed_source == true
        working-directory: preview-src
        env:
          PREVIEW_BASE: ${{ matrix.base }}
          VITE_SOURCE_COMMIT: ${{ matrix.sha }}
        run: npm run build -- --base "$PREVIEW_BASE"

      - name: Write preview review marker
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true' && matrix.marker_type != ''
        working-directory: preview-src
        env:
          MARKER_TYPE: ${{ matrix.marker_type }}
          MARKER_NAME: ${{ matrix.marker_name }}
          VITE_SOURCE_COMMIT: ${{ matrix.sha }}
          PREVIEW_BASE: ${{ matrix.base }}
          REVIEW_STATUS: ${{ matrix.status }}
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/review-build.json', JSON.stringify({
            [process.env.MARKER_TYPE]: process.env.MARKER_NAME,
            source: process.env.VITE_SOURCE_COMMIT,
            base: process.env.PREVIEW_BASE,
            status: process.env.REVIEW_STATUS
          }, null, 2));
          JS

      - name: Stage immutable preview output
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.preview-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "preview-output/${{ matrix.id }}"
          cp -a preview-src/dist/. "preview-output/${{ matrix.id }}/"

      - name: Verify preview output contract
        if: github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true'
        env:
          OUTPUT: preview-output/${{ matrix.id }}
          EXPECTED_SOURCE: ${{ matrix.sha }}
          EXPECTED_BASE: ${{ matrix.base }}
          MARKER_TYPE: ${{ matrix.marker_type }}
        run: |
          test -f "$OUTPUT/index.html"
          if [ -n "$MARKER_TYPE" ]; then
            test -f "$OUTPUT/review-build.json"
            node --input-type=module -e "import { readFileSync } from 'node:fs'; const body = JSON.parse(readFileSync(process.env.OUTPUT + '/review-build.json', 'utf8')); if (body.source !== process.env.EXPECTED_SOURCE) throw new Error('preview source marker mismatch'); if (body.base !== process.env.EXPECTED_BASE) throw new Error('preview base marker mismatch');"
          fi

  pinned-runtime-validation:
    name: pinned-runtime-validation (${{ matrix.id }})
    if: always() && github.event_name == 'pull_request'
    needs: preview-plan
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: billboard
            sha: b942c912510ec86312a9d0cd393d71d2eb478ea8
            tree: 76213c1dff2b434861bf6364ec7c8c9cb003908b
            lock_sha256: f3d6916ffe64fd38ecdbe26c82392512750638433c7127eef31b85a32d9993f1
            lfs_inventory_sha256: 234d0e7336e2d824e9af54f107a2628ce544b42a2260bafb2d32d8e807c765bc
            base: /manacondas-minigame-mayhem/previews/neon-grid-billboard/
          - id: dive
            sha: b49d9876f8c6ce87956f8b91675c3c8180e56b55
            tree: 095bc5185ab5790efed5681dc228442b771b683c
            lock_sha256: f3d6916ffe64fd38ecdbe26c82392512750638433c7127eef31b85a32d9993f1
            lfs_inventory_sha256: 234d0e7336e2d824e9af54f107a2628ce544b42a2260bafb2d32d8e807c765bc
            base: /manacondas-minigame-mayhem/previews/neon-grid-dive/
          - id: far300
            sha: ce6a64cf36b1f110af028536d3ff9c7a306ccbdb
            tree: c3193b2f1c67635504b5fd410e81e9b5d92ccf4e
            lock_sha256: f3d6916ffe64fd38ecdbe26c82392512750638433c7127eef31b85a32d9993f1
            lfs_inventory_sha256: 234d0e7336e2d824e9af54f107a2628ce544b42a2260bafb2d32d8e807c765bc
