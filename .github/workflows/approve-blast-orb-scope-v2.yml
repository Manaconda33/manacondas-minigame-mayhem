name: Apply Blast Orb scope governance

on:
  push:
    branches:
      - docs/slice-5-blast-orb-scope
    paths:
      - .github/workflows/approve-blast-orb-scope-v2.yml

permissions:
  contents: write

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/slice-5-blast-orb-scope
          fetch-depth: 1
      - name: Apply approved governance
        run: python tools/apply-blast-governance.py
      - name: Commit governed scope and remove temporary automation
        shell: bash
        run: |
          rm .github/workflows/approve-blast-orb-scope.yml
          rm .github/workflows/approve-blast-orb-scope-v2.yml
          rm tools/apply-blast-governance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows tools/apply-blast-governance.py
          git diff --cached --check
          git commit -m "Record approved Blast Orb scope governance"
          git push origin HEAD:docs/slice-5-blast-orb-scope
