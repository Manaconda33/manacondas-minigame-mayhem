name: Candidate B handling wiring patch

on:
  push:
    branches:
      - experiment/balance-candidate-b

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/balance-candidate-b
          fetch-depth: 1

      - name: Wire character Handling into production AI and remove bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/KartTimeTrial.ts')
          text = path.read_text()
          old = """          tuning.maxSpeed,\n        ),\n        characterMaxSpeed: tuning.maxSpeed,"""
          new = """          tuning.maxSpeed,\n          stats.handling,\n        ),\n        characterMaxSpeed: tuning.maxSpeed,"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one production AiDriver wiring site, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/candidate-b-wire-handling.yml
          git diff --check

      - name: Commit bounded experiment patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/KartTimeTrial.ts
          git commit -m "Wire Candidate B Handling into production AI"
          git push origin HEAD:experiment/balance-candidate-b
