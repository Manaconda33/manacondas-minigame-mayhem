            base: /manacondas-minigame-mayhem/previews/neon-grid-abyss-fog-004/

    steps:
      - name: Report documentation-only pinned-validation skip
        if: github.event_name == 'pull_request' && needs.preview-plan.result == 'success' && needs.preview-plan.outputs.docs_only == 'true'
        env:
          PIN_ID: ${{ matrix.id }}
        run: echo "Pinned runtime $PIN_ID was intentionally not revalidated because this pull request changes only allowlisted documentation; trusted evidence remains scoped to the immutable source and validation contract." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out current CI contract
        if: github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: ci-src
          fetch-depth: 1

      - name: Set up validation Node.js
        if: github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci-src/package-lock.json

      - name: Look up trusted pinned-runtime evidence
        id: validation-evidence
        if: github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true'
        working-directory: ci-src
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIN_ID: ${{ matrix.id }}
          PIN_SHA: ${{ matrix.sha }}
          PIN_TREE_SHA: ${{ matrix.tree }}
          PIN_LOCK_SHA256: ${{ matrix.lock_sha256 }}
          PIN_LFS_INVENTORY_SHA256: ${{ matrix.lfs_inventory_sha256 }}
          PREVIEW_BASE: ${{ matrix.base }}
          VALIDATION_CONTRACT_SHA256: ${{ needs.preview-plan.outputs.validation_contract }}
          VALIDATION_WORKFLOW_BLOB: ${{ needs.preview-plan.outputs.validation_workflow_blob }}
          VALIDATION_LOCK_SHA256: ${{ needs.preview-plan.outputs.validation_lock_sha256 }}
        run: |
          if [ -f tools/ci/restore-pinned-validation-evidence.mjs ]; then
            node tools/ci/restore-pinned-validation-evidence.mjs
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo 'reason=trusted evidence verifier is not present on the target branch' >> "$GITHUB_OUTPUT"
            echo 'Trusted evidence verifier unavailable; exact pinned runtime will run full validation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out pinned runtime
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.validation-evidence.outputs.reuse != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          path: runtime-src
          lfs: true

      - name: Set up Node.js
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.validation-evidence.outputs.reuse != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime-src/package-lock.json

      - name: Restore installed pinned-runtime dependencies
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.validation-evidence.outputs.reuse != 'true'
        id: runtime-deps
        uses: actions/cache@v4
        with:
          path: runtime-src/node_modules
          key: node-modules-v1-${{ runner.os }}-node22-${{ hashFiles('runtime-src/package-lock.json') }}

      - name: Install pinned-runtime dependencies
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.validation-evidence.outputs.reuse != 'true' && steps.runtime-deps.outputs.cache-hit != 'true'
        working-directory: runtime-src
        run: npm ci

      - name: run full validation on miss (exact pinned runtime)
        if: (github.event_name != 'pull_request' || needs.preview-plan.result != 'success' || needs.preview-plan.outputs.docs_only != 'true') && steps.validation-evidence.outputs.reuse != 'true'
        working-directory: runtime-src
        env:
          PIN_ID: ${{ matrix.id }}
          PIN_SHA: ${{ matrix.sha }}
          PIN_TREE_SHA: ${{ matrix.tree }}
          PIN_LOCK_SHA256: ${{ matrix.lock_sha256 }}
          PIN_LFS_INVENTORY_SHA256: ${{ matrix.lfs_inventory_sha256 }}
          PREVIEW_BASE: ${{ matrix.base }}
        run: |
          git lfs fsck
          test "$(git rev-parse HEAD)" = "$PIN_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PIN_TREE_SHA"
          echo "$PIN_LOCK_SHA256  package-lock.json" | sha256sum --check
          test "$(git lfs ls-files -l | sed -E 's/^([0-9a-f]{64}) [*+-] /\1 /' | sha256sum | cut -d' ' -f1)" = "$PIN_LFS_INVENTORY_SHA256"
          case "$PIN_ID" in
            billboard)
              # Retained native mobile fixture needs the same runner allowance as Dive fbff249.
              npm run typecheck
              npm run lint
              npm run test:ci -- --testTimeout=15000
              npm run build
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            dive)
              npm run validate
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            far300)
              # Keep the full validation phases while allowing the CPU-heavy render tests the same CI timeout as Billboard.
              npm run typecheck
              npm run lint
              npm run test:ci -- --testTimeout=15000
              npm run build
              git diff --check
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            abyss-fog-004)
              npm run typecheck
              npm run lint
              npm run test:ci -- --maxWorkers=1 --testTimeout=15000
              npm run build
              npm run build -- --base "$PREVIEW_BASE"
              ;;
            *)
              echo "Unknown pinned runtime: $PIN_ID" >&2
              exit 1
              ;;
          esac

