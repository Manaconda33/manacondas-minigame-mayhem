name: Materialize SFX review v1
on:
  push:
    branches: [review/slice6-sfx-assets-v1]
    paths: [.github/workflows/materialize-sfx-review-v1.yml]
permissions:
  contents: write
concurrency:
  group: materialize-sfx-review-v1
  cancel-in-progress: false
jobs:
  materialize:
    if: github.ref == 'refs/heads/review/slice6-sfx-assets-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install pinned authoring dependencies
        run: python -m pip install -r assets/audio/sfx-review-v1/requirements.txt
      - name: Regenerate only the named review WAVs and verify all committed object IDs
        run: |
          cp assets/audio/sfx-review-v1/manifest.json /tmp/expected-sfx-manifest.json
          python assets/audio/sfx-review-v1/create_sfx.py
          cp /tmp/expected-sfx-manifest.json assets/audio/sfx-review-v1/manifest.json
          python assets/audio/sfx-review-v1/verify_sfx.py
          git add -- assets/audio/sfx-review-v1/wav
          git diff --cached --exit-code
      - name: Upload the exact verified review objects
        run: |
          python - <<'PY'
          import json, subprocess
          manifest = json.load(open('assets/audio/sfx-review-v1/manifest.json'))
          oids = [c['sha256'] for c in manifest['cues']]
          subprocess.run(['git', 'lfs', 'push', '--object-id', 'origin', *oids], check=True)
          PY
      - name: Fetch back from GitHub after deleting the local object cache
        run: |
          rm -rf .git/lfs/objects
          git lfs fetch origin review/slice6-sfx-assets-v1
          git lfs checkout
          git lfs fsck
          python assets/audio/sfx-review-v1/verify_sfx.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean-install full project validation
        run: |
          npm ci
          npm run validate
      - name: Preserve review package as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: minigame-mayhem-sfx-review-v1
          path: assets/audio/sfx-review-v1/
          retention-days: 30
