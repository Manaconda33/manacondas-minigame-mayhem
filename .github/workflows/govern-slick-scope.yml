name: Record approved Slick Trap governance

on:
  push:
    branches:
      - docs/slice-5-slick-trap-scope
    paths:
      - .github/workflows/govern-slick-scope.yml

permissions:
  contents: write

jobs:
  govern-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          ref: docs/slice-5-slick-trap-scope
          fetch-depth: 1
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Record approved governance
        run: |
          python tools/govern_slick_scope.py
          rm tools/govern_slick_scope.py .github/workflows/govern-slick-scope.yml
          git diff --check

      - name: Install from lockfile
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Verify LFS runtime assets
        run: git lfs fsck

      - name: Commit governance checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRD.md docs/DECISIONS.md docs/IMPLEMENTATION-STATUS.md docs/SLICE-5-ITEM-SYSTEM-DESIGN.md docs/SLICE-5-SLICK-TRAP-SCOPE.md docs/TESTING.md tools/govern_slick_scope.py .github/workflows/govern-slick-scope.yml
          git commit -m "Govern approved Slick Trap scope"
          git push origin HEAD:docs/slice-5-slick-trap-scope
