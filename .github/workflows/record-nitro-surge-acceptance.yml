name: Record Nitro Surge live acceptance

on:
  push:
    branches:
      - docs/nitro-surge-live-acceptance
    paths:
      - .github/workflows/record-nitro-surge-acceptance.yml

permissions:
  contents: write

jobs:
  record-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: docs/nitro-surge-live-acceptance
          fetch-depth: 2

      - name: Guard accepted deployed base
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "6c1099ea7cda655e3776a371dccbfa34e9e2de5b"
          git lfs fsck

      - name: Record product-owner acceptance
        run: |
          python - <<'PY'
          from pathlib import Path

          status = Path('docs/IMPLEMENTATION-STATUS.md')
          text = status.read_text()

          replacements = [
              (
                  '**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - NITRO SURGE LIVE TUNING CORRECTION IN REVIEW**',
                  '**Slice 5 - Item Boxes, Weapons & Position-Based Distribution - NITRO SURGE LIVE ACCEPTED / NEXT ITEM INCREMENT AWAITING APPROVAL**',
              ),
              (
                  '**Approval gate:** validate and review the approved Nitro Surge live-tuning correction before merge. After approved deployment, rerun the focused Nitro feel/duration/VFX-expiry acceptance using the deterministic test URL. Do not begin another item effect until Nitro Surge is live accepted and recorded. Slice 6 remains locked.',
                  '**Approval gate:** Nitro Surge is live accepted. Do not begin the next item-effect increment until Manny explicitly approves it. Slice 6 remains locked.',
              ),
              (
                  'Remaining Slice 5 work includes all fifteen item effect implementations, projectiles, hazards, buffs/debuffs and counters, Hyper-Drive Rocket autopilot, AI tactical item use and hazard response, performance/cap evidence, cleanup/soak evidence, and final full-slice live acceptance.',
                  'Remaining Slice 5 work includes the other fourteen item effect implementations, projectiles, hazards, buffs/debuffs and counters, Hyper-Drive Rocket autopilot, AI tactical item use and hazard response, performance/cap evidence, cleanup/soak evidence, and final full-slice live acceptance.',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'status anchor mismatch: {old[:90]}')
              text = text.replace(old, new, 1)

          anchor = 'PR #101 is merged and deployed. The deterministic Nitro acceptance pass succeeded on checks 1-5 and 7-12; acceleration worked but felt insufficiently significant, and the 1.2-second duration felt too short. Manny approved a bounded tuning correction to 2.4 seconds and 1.50x acceleration while keeping the 1.18x speed cap and all other Nitro behavior unchanged. Tuning validation run **34028687379** passed the full repository gate before publication review. Clean-diff validation run **34028763753** repeated the full repository gate after removing unrelated markdown formatting churn.'
          addition = anchor + '\n\nPR #102 squash-merged to `main` at **`6c1099ea7cda655e3776a371dccbfa34e9e2de5b`**. Post-merge CI / Pages run **34029597094** passed validation and deployment. Pages artifact **9988166295** has digest `sha256:bae1a207a8c5c337be391d1a485bed4271ab7c9702d383993e9a4a864aa8b508`. Manny then reran the focused deterministic Nitro Surge acceptance and reported **all four checks passed**: 1.50x acceleration feels clearly significant, approximately 2.4 seconds feels appropriate, VFX/HUD remain synchronized through clean expiry, and the normal URL retains unforced governed item selection. **Nitro Surge is LIVE ACCEPTED as of 2026-09-06.**'
          if text.count(anchor) != 1:
              raise SystemExit('Nitro acceptance evidence anchor mismatch')
          text = text.replace(anchor, addition, 1)
          status.write_text(text)

          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          start = text.find('## ADR-064: Tune Nitro Surge after deterministic live acceptance')
          if start < 0:
              raise SystemExit('ADR-064 not found')
          section = text[start:]
          if section.count('- **Status:** Approved for implementation') < 1:
              raise SystemExit('ADR-064 status anchor missing')
          section = section.replace('- **Status:** Approved for implementation', '- **Status:** Live accepted / closed', 1)
          old_acceptance = '- **Acceptance:** After validation, PR review, merge, and deployment, rerun only the focused Nitro duration/acceleration/VFX-expiry feel checks plus a normal-URL isolation sanity check. Nitro Surge is not live accepted until Manny approves that deployed retest.'
          new_acceptance = '- **Acceptance:** PR #102 merged at `6c1099ea7cda655e3776a371dccbfa34e9e2de5b`; main CI / Pages run `34029597094` passed and deployed artifact `9988166295` (`sha256:bae1a207a8c5c337be391d1a485bed4271ab7c9702d383993e9a4a864aa8b508`). Manny reran the four focused deployed checks and reported all pass: 1.50x acceleration feel, approximately 2.4-second duration, synchronized VFX/HUD expiry, and normal-URL selector isolation. Nitro Surge is live accepted.'
          if section.count(old_acceptance) != 1:
              raise SystemExit('ADR-064 acceptance anchor mismatch')
          section = section.replace(old_acceptance, new_acceptance, 1)
          decisions.write_text(text[:start] + section)
          PY

      - name: Validate documentation checkpoint
        run: |
          npm ci
          npx prettier --write docs/IMPLEMENTATION-STATUS.md docs/DECISIONS.md
          git diff --check
          npm run validate

      - name: Commit clean acceptance checkpoint
        run: |
          rm -f .github/workflows/record-nitro-surge-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record Nitro Surge live acceptance"
          git push origin HEAD:docs/nitro-surge-live-acceptance
