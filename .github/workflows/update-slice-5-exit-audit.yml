name: Update Slice 5 exit evidence audit

on:
  push:
    branches:
      - docs/slice-5-exit-evidence-audit

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/slice-5-exit-evidence-audit
      - name: Reconcile evidence-backed exit criteria
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/SLICE-5-ITEM-SYSTEM-DESIGN.md')
          text = path.read_text()

          replacements = {
              '- [ ] All fifteen PRD item IDs exist in one typed registry.': '- [x] All fifteen PRD item IDs exist in one typed registry.',
              '- [ ] The eight rank tables remain exactly as approved and each totals 100%.': '- [x] The eight rank tables remain exactly as approved and each totals 100%.',
              '- [ ] Dynamic gap weighting obeys the 1.00-1.35 PRD bound.': '- [x] Dynamic gap weighting obeys the 1.00-1.35 PRD bound.',
              '- [ ] Runtime restrictions filter impossible items before selection and renormalize remaining weights.': '- [x] Runtime restrictions filter impossible items before selection and renormalize remaining weights.',
              '- [ ] One-slot inventory works and an occupied racer cannot consume another box.': '- [x] One-slot inventory works and an occupied racer cannot consume another box.',
              '- [ ] Roulette lasts approximately 0.85 seconds and freezes under pause.': '- [x] Roulette lasts approximately 0.85 seconds and freezes under pause.',
              '- [ ] Multi-charge item counts display correctly.': '- [x] Multi-charge item counts display correctly.',
              '- [ ] Item boxes pop on successful collection, immediately stop being collectible, disappear from the field, then fade back before becoming collectible at approximately 4.5 seconds.': '- [x] Item boxes pop on successful collection, immediately stop being collectible, disappear from the field, then fade back before becoming collectible at approximately 4.5 seconds.',
              '- [ ] Four eight-box rows exist at the approved approximate lap-progress locations and remain in the legal race corridor.': '- [x] Four eight-box rows exist at the approved approximate lap-progress locations and remain in the legal race corridor.',
              '- [ ] Apex respects one-active-global and 18-second restrictions, then attacks whoever is currently first at terminal lock.': '- [x] Apex respects one-active-global and 18-second restrictions, then attacks whoever is currently first at terminal lock.',
              '- [ ] Left Shift and E both use the held item.': '- [x] Left Shift and E both use the held item.',
              '- [ ] S/Down + item performs backward-capable deployment where supported.': '- [x] S/Down + item performs backward-capable deployment where supported.',
              '- [ ] Mobile Brake/Reverse + ITEM requests backward deployment where supported.': '- [x] Mobile Brake/Reverse + ITEM requests backward deployment where supported.',
              '- [ ] HUD shows roulette, held item, and correct remaining charge count.': '- [x] HUD shows roulette, held item, and correct remaining charge count.',
              '- [ ] Seeker/Apex targeting derives from validated race progress rather than visual proximity alone.': '- [x] Seeker/Apex targeting derives from validated race progress rather than visual proximity alone.',
              '- [ ] Finished racers cannot obtain new items.': '- [x] Finished racers cannot obtain new items.',
              '- [ ] Existing AI steering, lane, speed-stat authority, recovery, and bounded rubber-band tests remain passing.': '- [x] Existing AI steering, lane, speed-stat authority, recovery, and bounded rubber-band tests remain passing.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected unchecked criterion: {old}')
              text = text.replace(old, new, 1)

          heading = '# Slice 5 exit checklist\n'
          note = (
              '# Slice 5 exit checklist\n\n'
              '> Evidence reconciliation, 2026-09-07: checkmarks below reflect only requirements already supported by merged code/tests and recorded deployed product-owner acceptance through PR #112. The seeded 100,000-selection-per-rank requirement remains open until a reproducible hosted CI test/report is committed and passes. Broad all-item interaction, AI-policy, pause/lifecycle, soak/performance, and final-publication gates remain open until their full Slice 5 scope is implemented and evidenced.\n'
          )
          if heading not in text:
              raise SystemExit('Slice 5 exit checklist heading missing')
          text = text.replace(heading, note, 1)

          # Guard against accidentally closing the next planned evidence gate or broad future gates.
          required_open = [
              '- [ ] At least 100,000 seeded simulated selections per rank are recorded; expected deviation is within approximately 0.5 percentage points for common items or a documented goodness-of-fit test passes.',
              '- [ ] Mobile `ITEM` control works and passes simultaneous-input testing.',
              '- [ ] AI acquires and uses items according to tactical circumstances.',
              '- [ ] AI recognizes Slicks and Blast Orbs as hazards.',
              '- [ ] Pause freezes roulette, projectile, hazard, buff/debuff, arming, fuse, global cooldown, and item-window timers.',
              '- [ ] Repeated-use soak leaves no immortal item objects, colliders, listeners, timers, VFX, or stale audio emitters.',
              '- [ ] Slice-specific probability report is committed or referenced from implementation status.',
          ]
          for criterion in required_open:
              if criterion not in text:
                  raise SystemExit(f'Future gate was changed unexpectedly: {criterion}')

          path.write_text(text)
          PY
          git diff --check
      - name: Remove temporary updater and commit audit
        run: |
          rm .github/workflows/update-slice-5-exit-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SLICE-5-ITEM-SYSTEM-DESIGN.md .github/workflows/update-slice-5-exit-audit.yml
          git commit -m "Reconcile Slice 5 exit evidence"
          git push origin HEAD:docs/slice-5-exit-evidence-audit
