name: Apply approved Kinetic Disc checkpoint

on:
  push:
    branches:
      - feature/slice-5-kinetic-disc-guardrails-spinout
    paths:
      - .github/workflows/apply-kinetic-disc-increment.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved branch
        uses: actions/checkout@v4
        with:
          ref: feature/slice-5-kinetic-disc-guardrails-spinout
          lfs: true
          fetch-depth: 8

      - name: Guard accepted base
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "87cd7f197c9de9609e71a2f87118791ff3965790"
          git merge-base --is-ancestor 87cd7f197c9de9609e71a2f87118791ff3965790 HEAD
          git lfs fsck

      - name: Apply approved implementation
        env:
          PATCH_B64: "PLACEHOLDER"
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/apply_kinetic.py
          python /tmp/apply_kinetic.py
          rm -f /tmp/apply_kinetic.py

      - name: Validate checkpoint
        run: |
          npm ci
          npx prettier --write src/game/items/itemDefinitions.ts src/game/items/RacerEffects.ts src/game/items/ItemEffectDispatcher.ts src/game/items/ProjectileSystem.ts src/game/track/GuardrailSystem.ts src/game/track/createTrackScene.ts src/game/camera/SpinoutCameraAnchor.ts src/game/physics/KartController.ts src/game/KartTimeTrial.ts tests/guardrail-system.test.ts tests/projectile-system.test.ts tests/racer-effects.test.ts tests/kart-controller.test.ts tests/chase-camera.test.ts tests/driver-sprite-state.test.ts tests/track-scene.test.ts
          git diff --check
          npm run validate

      - name: Record validation and commit clean checkpoint
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('docs/IMPLEMENTATION-STATUS.md')
          text = p.read_text()
          anchor = '**Publication gate:** full repository validation, clean diff review, pull-request CI, then Manny approval before merge/deployment.'
          if text.count(anchor) != 1:
              raise SystemExit('status validation anchor mismatch')
          text = text.replace(anchor, f'Validation run **{os.environ["GITHUB_RUN_ID"]}** passed the full repository gate before publication review.\n\n' + anchor, 1)
          p.write_text(text)
          PY
          rm -f .github/workflows/apply-kinetic-disc-increment.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Implement Kinetic Disc guardrails and spinout"
          git push origin HEAD:feature/slice-5-kinetic-disc-guardrails-spinout
